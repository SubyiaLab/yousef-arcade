<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Anti-Boredom</title>
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { width: 100%; height: 100%; }
body { background: #07060f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; z-index: 2;
  background: radial-gradient(ellipse at 50% 120%, #3b0f63 0%, #07060f 60%);
  font-family: "Arial Black", "Helvetica Neue", system-ui, sans-serif; color: #fff; }
#status::before { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(transparent 0 50%, rgba(255,255,255,.035) 50%) 0 0 / 100% 4px; }
#status h1 { margin: 0; font-size: clamp(40px, 9vw, 104px); letter-spacing: 4px; line-height: .95; text-align: center; font-style: italic;
  color: #e9f2ff; text-shadow: 0 0 18px #00e5ff, 0 0 42px rgba(0,229,255,.55), 4px 0 0 rgba(255,43,214,.75); animation: glitch 2.2s infinite steps(1); }
#status h1 b { display: block; color: #fff; text-shadow: 0 0 18px #ff2bd6, 0 0 42px rgba(255,43,214,.55), -4px 0 0 rgba(0,229,255,.75); }
@keyframes glitch { 0%, 92% { transform: none; } 94% { transform: translateX(-6px) skewX(-8deg); } 96% { transform: translateX(5px); } }
.bar { width: min(560px, 80vw); height: 14px; border: 2px solid #00e5ff; background: rgba(0,229,255,.08); box-shadow: 0 0 18px rgba(0,229,255,.45);
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 0px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.fill { height: 100%; width: 0%; background: linear-gradient(90deg, #00e5ff, #ff2bd6); transition: width .2s; }
#msg { font-size: 18px; letter-spacing: 3px; color: #00e5ff; text-shadow: 0 0 10px rgba(0,229,255,.7); text-align: center; padding: 0 20px; }
#small { font-family: system-ui, sans-serif; font-size: 14px; color: #8a90a8; text-align: center; padding: 0 24px; }
</style>

<canvas id="canvas">Your browser does not support the canvas tag.</canvas>
<noscript>Your browser does not support JavaScript.</noscript>
<div id="status">
  <h1>ANTI<b>BOREDOM</b></h1>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div id="msg">BOOTING ENGINE</div>
  <div id="small">Built with the Godot engine. First load is about 40 MB.</div>
</div>
<script>
// The engine file is split into parts (hosting limit per file); stitch them back together while streaming.
(function () {
  const PARTS = ["index.part1.wasm", "index.part2.wasm", "index.part3.wasm"];
  if (!PARTS.length) return;
  const realFetch = window.fetch.bind(window);
  window.fetch = function (input, init) {
    const url = typeof input === 'string' ? input : (input && input.url) || '';
    if (/index\.wasm(\?|$)/.test(url)) {
      const base = url.replace(/index\.wasm(\?.*)?$/, '');
      let i = 0, reader = null;
      const stream = new ReadableStream({
        async pull(ctrl) {
          for (;;) {
            if (!reader) {
              if (i >= PARTS.length) { ctrl.close(); return; }
              const r = await realFetch(base + PARTS[i++], { credentials: 'same-origin' });
              if (!r.ok) throw new Error('Could not load ' + PARTS[i - 1] + ' (' + r.status + ')');
              reader = r.body.getReader();
            }
            const { value, done } = await reader.read();
            if (done) { reader = null; continue; }
            ctrl.enqueue(value);
            return;
          }
        }
      });
      return Promise.resolve(new Response(stream, { status: 200, headers: { 'Content-Type': 'application/wasm' } }));
    }
    if (/index\.pck(\?|$)/.test(url)) {
      // the game data pack is hosted under a .wasm name (a file type the host serves)
      return realFetch(url.replace(/index\.pck/, 'index.pck.wasm'), init);
    }
    return realFetch(input, init);
  };
})();
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1149200,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);
(function () {
  const status = document.getElementById('status');
  const fill = document.getElementById('fill');
  const msg = document.getElementById('msg');
  const lines = ['BOOTING ENGINE', 'BUILDING 3D WORLD', 'CHARGING LASERS', 'ARMING THE GRAYLORD', 'ALMOST READY'];
  let li = 0;
  const timer = setInterval(() => { li = (li + 1) % lines.length; msg.textContent = lines[li]; }, 1800);
  function fail(err) {
    clearInterval(timer);
    console.error(err);
    msg.textContent = 'ERROR: ' + (err && err.message ? err.message : err) + ' - reload the page';
  }
  const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
  if (missing.length) { fail('This browser is missing: ' + missing.join(', ')); return; }
  engine.startGame({
    onProgress: function (cur, total) {
      if (cur > 0 && total > 0) fill.style.width = Math.min(100, cur / total * 100).toFixed(1) + '%';
    },
  }).then(() => { clearInterval(timer); status.remove(); }, fail);
})();
</script>
