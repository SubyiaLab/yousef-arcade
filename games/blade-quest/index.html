<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<title>Blade Quest</title>
<link rel="icon" type="image/png" href="index.icon.png">
<link rel="apple-touch-icon" href="index.apple-touch-icon.png">
<style>
html, body, #canvas { margin: 0; padding: 0; border: 0; }
html, body { height: 100%; }
body { background: #5cb3ff; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
#canvas { display: block; width: 100vw; height: 100vh; }
#canvas:focus { outline: none; }
#status { position: fixed; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: linear-gradient(180deg, #3a7bf2 0%, #7cc4ff 55%, #fff1c9 100%); font-family: "Segoe UI", Helvetica, Arial, sans-serif; z-index: 5; }
#status.hidden { display: none; }
#bq-title { font-size: clamp(42px, 9vw, 96px); font-weight: 900; color: #ffd84a; letter-spacing: 2px;
  text-shadow: 0 6px 0 #e9407d, 0 0 0 #000, -3px -3px 0 #2a1438, 3px -3px 0 #2a1438, -3px 3px 0 #2a1438, 3px 3px 0 #2a1438, 0 12px 20px rgba(0,0,0,.35); transform: rotate(-3deg); }
#bq-sub { margin-top: 14px; font-size: clamp(16px, 2.6vw, 26px); color: #fff; font-weight: 700; text-shadow: 0 2px 0 #2a1438; }
#bq-bar { margin-top: 34px; width: min(70vw, 460px); height: 26px; border-radius: 14px; background: rgba(42,20,56,.45); border: 4px solid #2a1438; overflow: hidden; }
#bq-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ff5b8a, #ffd84a); transition: width .25s; }
#bq-pct { margin-top: 10px; font-size: 18px; color: #2a1438; font-weight: 800; }
#bq-note { margin-top: 18px; font-size: 15px; color: #2a1438; opacity: .8; }
#status-notice { display: none; margin: 1rem 2rem; padding: 1rem; background: #5b3943; color: #fff; border-radius: 12px; text-align: center; max-width: 80vw; }
.blob { position: absolute; bottom: -30px; width: 160px; height: 120px; border-radius: 50% 50% 45% 45%; background: #58e36f; border: 5px solid #2a1438; animation: hop 1.1s ease-in-out infinite; }
.blob:after { content: ""; position: absolute; left: 36px; top: 34px; width: 22px; height: 28px; border-radius: 50%; background: #2a1438; box-shadow: 56px 0 0 #2a1438; }
.blob.b2 { left: 12%; background: #ff8ec6; animation-delay: .3s; } .blob.b1 { right: 14%; animation-delay: .6s; }
@keyframes hop { 0%,100% { transform: translateY(0) scale(1,1); } 40% { transform: translateY(-70px) scale(.9,1.15); } 55% { transform: translateY(-60px) scale(.95,1.05);} 90% { transform: translateY(0) scale(1.15,.85); } }
</style>
<canvas id="canvas" tabindex="0">Your browser does not support the canvas tag.</canvas>
<div id="status">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div id="bq-title">BLADE QUEST</div>
  <div id="bq-sub">Bonk monsters. Grab loot. Be the hero!</div>
  <div id="bq-bar"><div id="bq-fill"></div></div>
  <div id="bq-pct">Loading the island...</div>
  <div id="bq-note">Best in landscape. First load is about 40 MB.</div>
  <div id="status-notice"></div>
</div>
<script>
// Artifact storage limits mean the engine is shipped in pieces: stitch index.part*.wasm back into index.wasm,
// and serve the data pack from index.pck.wasm.
(function () {
  const PARTS = ["index.part1.wasm", "index.part2.wasm", "index.part3.wasm"];
  const WASM_SIZE = 39514754;
  const PCK_SIZE = 893460;
  const realFetch = window.fetch.bind(window);
  const fill = document.getElementById('bq-fill');
  const pct = document.getElementById('bq-pct');
  let got = 0;
  const total = WASM_SIZE + PCK_SIZE;
  function progress(n) {
    got += n;
    const p = Math.min(100, Math.round(100 * got / total));
    fill.style.width = p + '%';
    pct.textContent = p < 100 ? ('Loading the island... ' + p + '%') : 'Sharpening the sword...';
  }
  async function readAll(url) {
    const r = await realFetch(url);
    if (!r.ok) throw new Error('Could not load ' + url + ' (' + r.status + ')');
    const reader = r.body.getReader();
    const chunks = [];
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value);
      progress(value.byteLength);
    }
    const out = new Uint8Array(chunks.reduce((a, c) => a + c.byteLength, 0));
    let o = 0;
    for (const c of chunks) { out.set(c, o); o += c.byteLength; }
    return out;
  }
  window.fetch = async function (input, init) {
    const url = (typeof input === 'string') ? input : (input && input.url) || '';
    if (/index\.wasm(\?.*)?$/.test(url)) {
      const parts = await Promise.all(PARTS.map(readAll));
      const out = new Uint8Array(parts.reduce((a, c) => a + c.byteLength, 0));
      let o = 0;
      for (const c of parts) { out.set(c, o); o += c.byteLength; }
      return new Response(out, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
    }
    if (/index\.pck(\?.*)?$/.test(url)) {
      const data = await readAll('index.pck.wasm');
      return new Response(data, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } });
    }
    return realFetch(input, init);
  };
})();
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args": [], "canvasResizePolicy": 2, "emscriptenPoolSize": 8, "ensureCrossOriginIsolationHeaders": false, "executable": "index", "experimentalVK": false, "fileSizes": {"index.pck": 893460, "index.wasm": 39514754}, "focusCanvas": true, "gdextensionLibs": [], "godotPoolSize": 4};
const GODOT_THREADS_ENABLED = false;
(function(){ const h = (location.hash || '').slice(1); if (h && /^[a-z0-9_-]+$/.test(h)) { GODOT_CONFIG.args = ['--', '--screen=' + h]; } })();
const engine = new Engine(GODOT_CONFIG);
(function () {
  const statusOverlay = document.getElementById('status');
  const statusNotice = document.getElementById('status-notice');
  function fail(err) {
    console.error(err);
    statusNotice.style.display = 'block';
    statusNotice.textContent = (err && err.message) ? err.message : String(err);
  }
  const missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length !== 0) {
    fail('This browser is missing: ' + missing.join(', '));
    return;
  }
  engine.startGame({ 'onProgress': function () {} }).then(() => {
    statusOverlay.classList.add('hidden');
    const c = document.getElementById('canvas');
    if (c) c.focus();
  }, fail);
}());
</script>

</body></html>
