<style>
/* Layout: full-bleed 3D canvas, glass HUD pinned to corners, recent-weapon dock bottom-center, full arsenal sheet on demand */
:root{
  --bg:#05070c; --panel:rgba(10,14,22,.62); --sheet:#0c111a; --line:rgba(255,255,255,.12);
  --fg:#f3efe6; --muted:#9aa3b3; --hot:#ff6a2b; --hot2:#ffc24a;
  --display:'Chakra Petch','Arial Narrow',system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:14px}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);
  padding:10px 14px 12px;display:grid;gap:8px;max-width:calc(100vw - 150px);box-sizing:border-box}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.12em;font-size:14px}
.brand span{color:var(--hot)}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.stat output{font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
#side{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  display:flex;flex-direction:column;gap:8px}
button{cursor:pointer}
button:focus-visible{outline:2px solid var(--hot2);outline-offset:2px}
.ctl{font:600 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--fg);
  min-width:112px;height:44px;padding:0 14px;display:flex;align-items:center;gap:8px}
.ctl svg{width:18px;height:18px;flex:none}
.ctl[aria-pressed="true"]{border-color:var(--hot);color:var(--hot2)}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;gap:6px;padding:7px;max-width:calc(100vw - 24px);box-sizing:border-box}
#recent{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0}
#recent::-webkit-scrollbar{display:none}
.wpn{flex:none;width:80px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:11px;background:rgba(255,255,255,.04);border:1px solid transparent;color:var(--fg);
  font:600 12px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:0 4px;text-align:center;line-height:1.1}
.wpn svg{width:30px;height:30px;flex:none}
.wpn small{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:500 10px var(--body);color:var(--muted);letter-spacing:.02em;text-transform:none}
.wpn[aria-pressed="true"]{border-color:var(--hot);background:linear-gradient(180deg,rgba(255,106,43,.30),rgba(255,106,43,.06));
  box-shadow:0 0 22px rgba(255,106,43,.35)}
.wpn.all{background:rgba(255,194,74,.12);border-color:rgba(255,194,74,.4);color:var(--hot2)}
#arsenal{position:fixed;inset:0;z-index:5;background:rgba(3,5,10,.55);display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
#arsenal[hidden]{display:none}
.sheet{width:min(980px,100%);max-height:100%;overflow-y:auto;box-sizing:border-box;padding:0 18px 18px;background:var(--sheet);-webkit-overflow-scrolling:touch}
.sheethead{position:sticky;top:0;z-index:1;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px;background:var(--sheet);border-bottom:1px solid var(--line)}
.sheethead h2{margin:0;font:700 20px var(--display);letter-spacing:.12em;text-transform:uppercase;text-wrap:balance}
.sheethead p{margin:2px 0 0;color:var(--muted);font-size:13px}
.cat{display:grid;gap:8px;padding-top:16px;scroll-margin-top:150px}
#catnav{flex-basis:100%;display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 11px var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--fg);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:7px 11px}
.chip:hover{border-color:var(--hot2)}
.fac{display:grid;gap:10px;padding:14px;border:1px solid rgba(255,194,74,.35);border-radius:12px;background:rgba(255,194,74,.06)}
.facprev{display:flex;gap:14px;align-items:center;min-width:0}
.facicon svg{width:46px;height:46px;display:block}
.factext{min-width:0}
.facname{font:700 17px var(--display);letter-spacing:.06em;text-transform:uppercase;text-wrap:balance}
.facdesc{color:var(--muted);font-size:13px;margin-top:2px}
.facrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.facrow label{font:600 11px var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#facNum{font:600 16px var(--display);font-variant-numeric:tabular-nums;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:230px;max-width:100%;box-sizing:border-box;-webkit-user-select:text;user-select:text}
#facNum:focus-visible{outline:2px solid var(--hot2);outline-offset:1px}
.usebtn{font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:#1a0d05;background:var(--hot2);border:0;border-radius:999px;padding:9px 16px}
.usebtn:disabled{opacity:.4}
.facnote{margin:0;color:var(--muted);font-size:12px}
.chip.hot{border-color:rgba(255,194,74,.5);color:var(--hot2)}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);padding:10px 16px;font:600 15px var(--display);letter-spacing:.06em;color:var(--hot2);max-width:calc(100vw - 40px);text-align:center;z-index:4}
#toast[hidden]{display:none}
.cat h3{margin:0;font:600 11px var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--hot2)}
.cat h3 span{color:var(--muted);margin-left:6px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.grid .wpn{width:auto;height:92px}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 122px);
  padding:8px 14px;font-size:13px;color:var(--fg);white-space:nowrap;transition:opacity .6s}
#hint.gone{opacity:0}
#flash{position:fixed;inset:0;background:#fff7e0;opacity:0;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;font:600 14px var(--display);letter-spacing:.2em;color:var(--muted)}
@media (max-width:520px){
  .wpn{width:70px;height:72px}.wpn small{display:none}
  .grid{grid-template-columns:repeat(auto-fill,minmax(78px,1fr))}.grid .wpn{height:76px}
  .stat output{font-size:16px}.stats{gap:12px}
  .ctl{min-width:44px;padding:0 12px}.ctl span{display:none}
  #top{max-width:calc(100vw - 96px)}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + 104px);font-size:12px;white-space:normal;text-align:center;width:max-content;max-width:calc(100vw - 40px)}
}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

// ---------- renderer / scene ----------
const stage=document.getElementById('stage');

  const a=[];for(let i=0;i<2200;i++){const t=Math.random()*Math.PI*2,u=rand(.04,1),r=2800;const s=Math.sqrt(1-u*u);a.push(Math.cos(t)*s*r,u*r,Math.sin(t)*s*r);}

// ---------- textures ----------
function canvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h||w;return [c,c.getContext('2d')];}

const LIT=['#ffd58a','#ffe7bd','#ffcf70','#cfe4ff','#fff1d8'];

    for(let r=0;r<8;r++)for(let k=0;k<8;k++){const x=k*64+10,y=r*64+14,w=44,h=38;

      g.fillStyle='rgba(255,255,255,.18)';g.fillRect(x,y,w,3);g.fillStyle='#ddd5c8';g.fillRect(x+w/2-1,y,2,h);

const FAC=[facade(0),facade(1),facade(2)];
const TINTS=[['#ffffff','#efe2cf','#d2dbe3'],['#ffffff','#bcd4e2','#d6e6d8'],['#ffffff','#e9cdb8','#cdb7a8']];

const styleMats=FAC.map((f,s)=>TINTS[s].map(t=>{const m=new THREE.MeshStandardMaterial({color:C(t),map:f[0],emissiveMap:f[1],emissive:C('#ffffff'),emissiveIntensity:0,

// ---------- projectiles ----------
// [orientation, trail]
const KIND={rocket:['vel','rocket'],missile:['vel','rocket'],bomb:['drop',''],moab:['drop',''],nuke:['drop','nuke'],buster:['drop','faint'],meteor:['spin','meteor'],lava:['spin','lava'],
  grenade:['spin','faint'],bullet:['none',''],plasma:['none','plasma'],shell:['vel','faint'],rod:['drop','rod'],satellite:['tumble','meteor'],moon:['spin','moon'],
  icecomet:['spin','ice'],car:['tumble',''],hail:['none',''],boulder:['tumble','dust'],drone:['face',''],
  fireball:['spin','lava'],orb:['none','orb'],melon:['tumble',''],banana:['tumble',''],mars:['spin','moon'],iceplanet:['spin','ice']};
const projs=[];
function launch(kind,pos,vel,R,grav,o){const k=KIND[kind]||['none',''];
  const pr=Object.assign({kind,pos:pos.clone(),vel:vel.clone(),R,grav,mesh:model(kind),acc:0,age:0,orient:k[0],trail:k[1],rad:0,spinV:new V3(rand(-3,3),rand(-3,3),rand(-3,3))},o||{});
  if(kind==='orb')pr.mesh.add(glowSprite(pr.size||20,pr.col||'#ffffff'));if(o&&o.scale)pr.mesh.scale.multiplyScalar(o.scale);pr.mesh.position.copy(pr.pos);projs.push(pr);return pr;}
function hitTest(p,r){if(p.y-r<=SW+.3)return true;
  for(const b of buildings){if(b.alive&&p.y-r<b.h+SW&&Math.abs(p.x-b.x)<b.w/2+r*.5&&Math.abs(p.z-b.z)<b.d/2+r*.5)return true;}
  return false;}
const _v=new V3(),_d=new V3(),_tr=new V3();
function trail(pr){const t=_tr.copy(pr.pos).addScaledVector(_v,-3);const k=pr.mesh.scale.x;
  switch(pr.trail){
    case 'rocket':puff(1,t.x,t.y,t.z,2.2*k,rand(-1,1),rand(-1,1),rand(-1,1),rand(1.5,2.5),{c:C('#d8d4cf'),a:.5,grow:2.5,buoy:1});puff(0,t.x,t.y,t.z,2.6*k,0,0,0,.18,{});break;
    case 'meteor':t.addScaledVector(_v,-1);puff(0,t.x,t.y,t.z,rand(10,16)*k,rand(-3,3),rand(-3,3),rand(-3,3),rand(.4,.8),{});puff(1,t.x,t.y,t.z,rand(8,12)*k,rand(-2,2),rand(-2,2),rand(-2,2),rand(2.5,4),{hot:true,c:C('#4a3b33'),a:.6,grow:2.2,buoy:1});break;
    case 'lava':if(Math.random()<.5)puff(0,t.x,t.y,t.z,rand(4,7),0,0,0,rand(.3,.5),{});if(Math.random()<.3)puff(1,t.x,t.y,t.z,4,0,0,0,2,{c:C('#2b2624'),a:.5});break;
    case 'nuke':if(Math.random()<.3)puff(1,t.x,t.y+4,t.z,2*k,0,0,0,1,{c:C('#eeeeee'),a:.3});break;
    case 'faint':if(Math.random()<.5)puff(1,t.x,t.y,t.z,1.6*k,0,0,0,1.2,{c:C('#cfcac4'),a:.35,grow:2,buoy:1});break;
    case 'plasma':puff(3,t.x,t.y,t.z,rand(5,8),rand(-2,2),rand(-2,2),rand(-2,2),.4,{c:C('#6ac0ff')});break;
    case 'rod':puff(3,t.x,t.y+6,t.z,4,0,0,0,.3,{c:C('#ffffff')});break;
    case 'moon':for(let j=0;j<3;j++)puff(0,t.x+rand(-30,30),t.y+34+rand(-10,20),t.z+rand(-30,30),rand(20,34),0,0,0,rand(.5,1),{});
      puff(1,t.x,t.y+44,t.z,30,0,0,0,4,{hot:true,c:C('#4a3b33'),a:.5,grow:1.5,buoy:1});break;
    case 'ice':puff(3,t.x,t.y,t.z,rand(8,12),rand(-3,3),rand(-3,3),rand(-3,3),.6,{c:C('#bfe6ff')});puff(1,t.x,t.y,t.z,rand(6,10),0,0,0,2.5,{c:C('#eef8ff'),a:.5,grow:2,buoy:1});break;
    case 'orb':puff(3,t.x,t.y,t.z,(pr.size||20)*.35,rand(-2,2),rand(-2,2),rand(-2,2),.45,{c:C(pr.col||'#ffffff')});break;
    case 'dust':if(Math.random()<.4)puff(1,t.x,t.y,t.z,3,0,0,0,1,{c:C('#8a7d6c'),a:.4});break;}}
function updateProjs(dt){
  for(let i=projs.length-1;i>=0;i--){const pr=projs[i];pr.age+=dt;
    if(pr.cruise){const hx=pr.home.x-pr.pos.x,hz=pr.home.z-pr.pos.z,hd=Math.hypot(hx,hz);
      if(hd>70)_d.set(hx/hd*pr.speed,(pr.alt-pr.pos.y)*2,hz/hd*pr.speed);else _d.subVectors(pr.home,pr.pos).normalize().multiplyScalar(pr.speed);
      pr.vel.lerp(_d,Math.min(1,dt*4));}
    else if(pr.home&&pr.age>(pr.delay||0)){_d.subVectors(pr.home,pr.pos).normalize().multiplyScalar(pr.speed);pr.vel.lerp(_d,Math.min(1,dt*pr.turn));}
    if(pr.grav)pr.vel.y-=G*dt;
    pr.pos.addScaledVector(pr.vel,dt);pr.mesh.position.copy(pr.pos);
    if(pr.split&&pr.pos.y<pr.split){scene.remove(pr.mesh);projs.splice(i,1);
      puff(0,pr.pos.x,pr.pos.y,pr.pos.z,16,0,0,0,.5,{});puff(1,pr.pos.x,pr.pos.y,pr.pos.z,14,0,0,0,2.5,{c:C('#555555'),a:.6});boom(6,0);
      for(let k=0;k<(pr.splitN||14);k++){const a=rand(0,6.28),s=rand(10,40)*(pr.splitV||1);launch(pr.splitKind||'bomb',pr.pos,new V3(Math.cos(a)*s,rand(-15,5),Math.sin(a)*s),pr.splitR||16,true,{scale:pr.splitScale||.6,boom:pr.splitBoom});}
      continue;}
    _v.copy(pr.vel).normalize();
    if(pr.orient==='vel')pr.mesh.quaternion.setFromUnitVectors(UP,_v);
    else if(pr.orient==='drop')pr.mesh.quaternion.setFromUnitVectors(UP,_d.copy(_v).negate());
    else if(pr.orient==='spin')pr.mesh.rotation.x+=dt*3;
    else if(pr.orient==='tumble'){pr.mesh.rotation.x+=pr.spinV.x*dt;pr.mesh.rotation.y+=pr.spinV.y*dt;pr.mesh.rotation.z+=pr.spinV.z*dt;}
    else if(pr.orient==='face')pr.mesh.lookAt(_d.copy(pr.pos).add(pr.vel));
    pr.acc+=dt;if(pr.acc>.016&&pr.trail){pr.acc=0;trail(pr);}
    if((pr.age>.15&&hitTest(pr.pos,pr.rad))||pr.age>(pr.maxAge||14)){const p=pr.pos.clone();p.y=Math.max(SW,p.y-pr.rad);scene.remove(pr.mesh);projs.splice(i,1);
      if(pr.onHit)pr.onHit(p,pr);else explode(p,pr.R,pr.boom||pr.kind);}
  }
}

const jets=[];
const jetM=new THREE.MeshStandardMaterial({color:C('#6f7a84'),metalness:.7,roughness:.35});
function jetModel(){const g=new THREE.Group();
  g.add(new THREE.Mesh(new THREE.CylinderGeometry(.9,1.3,16,12).rotateX(Math.PI/2),jetM));
  const n=new THREE.Mesh(new THREE.ConeGeometry(.9,4,12).rotateX(Math.PI/2),jetM);n.position.z=10;g.add(n);
  const cp=new THREE.Mesh(new THREE.SphereGeometry(.9,12,8),glassMat);cp.scale.set(1,.7,2);cp.position.set(0,.9,5);g.add(cp);
  const w=new THREE.Mesh(new THREE.BoxGeometry(18,.3,5),jetM);w.position.z=-1;g.add(w);
  const t=new THREE.Mesh(new THREE.BoxGeometry(7,.25,2.5),jetM);t.position.z=-7;g.add(t);
  const fin=new THREE.Mesh(new THREE.BoxGeometry(.25,4,3),jetM);fin.position.set(0,2,-7);g.add(fin);
  const ex=glowSprite(6,'#ff9a3a');ex.position.z=-8.5;g.add(ex);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});scene.add(g);return g;}
function jetPass(target,o){o=o||{};let dir=o.dir;if(!dir){const f=camFwd();dir=new V3(-f.z,0,f.x);if(Math.random()<.5)dir.negate();}

  const drops=[];for(let i=0;i<n;i++)drops.push((i-(n-1)/2)*sp-lead);
  const right=new V3(-dir.z,0,dir.x);
  const jm=jetModel();if(o.big){jm.scale.setScalar(2.2);jm.traverse(q=>{if(q.isMesh)q.material=dark;});}
  jets.push({mesh:jm,target:target.clone().addScaledVector(right,o.off||0),dir,s:-520-(o.delay||0)*SP,H,SP,drops,di:0,acc:0,R:o.R||30,onHit:o.onHit||null,kind:o.kind||'bomb'});
  if(!o.quiet)whoosh(4.5,300,1400,.5);return dir;}
function updateJets(dt){
  for(let i=jets.length-1;i>=0;i--){const j=jets[i];j.s+=j.SP*dt;
    const p=j.target.clone().addScaledVector(j.dir,j.s);p.y=j.target.y+j.H;j.mesh.position.copy(p);j.mesh.lookAt(p.clone().add(j.dir));j.mesh.rotateZ(Math.sin(j.s*.01)*.08);
    while(j.di<j.drops.length&&j.s>=j.drops[j.di]){launch(j.kind,p.clone().add(new V3(0,-2,0)),j.dir.clone().multiplyScalar(j.SP*.6),j.R,true,j.onHit?{onHit:j.onHit}:null);j.di++;}
    j.acc+=dt;if(j.acc>.03){j.acc=0;const r=new V3(-j.dir.z,0,j.dir.x);
      for(const s of[-1,1]){const w=p.clone().addScaledVector(r,9*s).addScaledVector(j.dir,-2);puff(1,w.x,w.y,w.z,1.4,0,0,0,4,{c:C('#ffffff'),a:.45,grow:4,buoy:0,drag:0});}}

// ---------- specials framework + helpers ----------
let specials=[];
function addSpecial(s){specials.push(s);}
function updateSpecials(dt){for(let i=specials.length-1;i>=0;i--){const s=specials[i];if(s.update(dt)===false){specials.splice(i,1);s.end&&s.end();}}}
function clearSpecials(){const l=specials;specials=[];for(const s of l)s.end&&s.end();}
const _t=new V3();
function camFwd(){const f=new V3();camera.getWorldDirection(f);f.y=0;if(f.lengthSq()<1e-6)f.set(0,0,-1);return f.normalize();}
function camRight(f){return new V3(-f.z,0,f.x);}
function muzzle(){camera.updateMatrixWorld();const right=new V3().setFromMatrixColumn(camera.matrixWorld,0),down=new V3().setFromMatrixColumn(camera.matrixWorld,1).negate();
  return camera.position.clone().addScaledVector(right,3).addScaledVector(down,3);}
function ballistic(a,b,T){return new V3((b.x-a.x)/T,(b.y-a.y)/T+.5*G*T,(b.z-a.z)/T);}
function every(iv,n,fn){let i=0,acc=iv;addSpecial({update(dt){acc+=dt;while(acc>=iv&&i<n){acc-=iv;fn(i++);}if(i>=n)return false;}});}
function aroundT(t,r){const a=rand(0,6.28),d=Math.sqrt(Math.random())*r;return new V3(t.x+Math.cos(a)*d,SW,t.z+Math.sin(a)*d);}
function dist2(b,c){return Math.hypot(b.x-c.x,b.z-c.z);}
function nearestBuildings(c,maxD,n){return buildings.filter(b=>b.alive&&dist2(b,c)<maxD).sort((a,b)=>dist2(a,c)-dist2(b,c)).slice(0,n);}
function randomBuilding(c,minD,maxD){const l=buildings.filter(b=>{if(!b.alive)return false;const d=dist2(b,c);return d>=minD&&d<=maxD;});return l.length?l[(Math.random()*l.length)|0]:null;}
function pickAhead(pos,dir){let best=null,bd=1e9;for(const b of buildings){if(!b.alive)continue;_t.set(b.x-pos.x,0,b.z-pos.z);const d=_t.length();if(d<30||d>200||_t.dot(dir)/d<.3)continue;const sc=d+rand(0,50);if(sc<bd){bd=sc;best=b;}}return best;}
function bTop(b,k){return new V3(b.x,SW+b.h*(k===undefined?rand(.4,.95):k),b.z);}
function roofY(x,z){let y=SW;for(const b of buildings)if(b.alive&&Math.abs(x-b.x)<b.w/2&&Math.abs(z-b.z)<b.d/2)y=Math.max(y,SW+b.h);return y;}
function sparks(p,n,sp){for(let i=0;i<n;i++){const v=new V3(rand(-1,1),rand(.3,1),rand(-1,1)).normalize().multiplyScalar(rand(sp*.4,sp));puff(2,p.x,p.y+1,p.z,rand(1,2),v.x,v.y,v.z,rand(.4,.8),{});}}
function dust(p,n,r,col){for(let k=0;k<n;k++){const a=rand(0,6.28);puff(1,p.x+Math.cos(a)*r,2,p.z+Math.sin(a)*r,rand(10,18),Math.cos(a)*rand(10,30),rand(3,8),Math.sin(a)*rand(10,30),rand(2,3.5),{c:C(col||'#8a7d6c'),a:.6,grow:2});}}
function swirlDebris(c,rad,dt,up,spin,inward){for(const pl of pools)for(const d of pl.D){if(!d.on)continue;_t.set(d.p.x-c.x,0,d.p.z-c.z);const r=_t.length();if(r>rad||r<.01)continue;

function updateBolts(dt){for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];b.t+=dt;const k=b.t/b.life;

const toastEl=document.getElementById('toast');let toastT=null;
function toast(msg){toastEl.textContent=msg;toastEl.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{toastEl.hidden=true;},2600);}
function ringPts(t,r,n,a0){const out=[];for(let i=0;i<n;i++){const a=(a0||0)+i/n*Math.PI*2;out.push(new V3(t.x+Math.cos(a)*r,SW,t.z+Math.sin(a)*r));}return out;}
function dropAt(pts,iv,kind,R,h,o){every(iv,pts.length,i=>{const tg=pts[i];tg.y=roofY(tg.x,tg.z);launch(kind,tg.clone().add(new V3(0,h,0)),new V3(0,-60,0),R,true,o);});}
function boomAt(pts,iv,R,kind){every(iv,pts.length,i=>{const p=pts[i];p.y=roofY(p.x,p.z);explode(p,R,kind||'bomb');});}
function aimAt(o,t,spd){return t.clone().sub(o).normalize().multiplyScalar(spd);}
function fromSky(t,h,spread){return t.clone().add(new V3(rand(-spread,spread),h,rand(-spread,spread)));}
function bigBulletHit(p){damage(p,10,{few:true});puff(0,p.x,p.y+1,p.z,9,0,4,0,.35,{});sparks(p,5,50);}
function melonHit(p){damage(p,18,{few:true});for(let i=0;i<40;i++){const v=new V3(rand(-1,1),rand(.1,1),rand(-1,1)).normalize().multiplyScalar(rand(15,55));puff(3,p.x,p.y+2,p.z,rand(2,4),v.x,v.y,v.z,rand(.8,1.4),{c:C(i%4?'#ff4f6a':'#3aa84a')});}
  tone('triangle',200,80,.25,.3);boom(10,0);ring(p,18,.5);}

function iceGun(target){const o=muzzle();launch('orb',o,aimAt(o,target,150),0,false,{col:'#9fdcff',size:18,onHit:p=>{explode(p,18,'ice');freezeArea(new V3(p.x,0,p.z),40,.8);}});tone('sine',1800,600,.4,.2);}
function fireballGun(target){const o=muzzle();launch('fireball',o,aimAt(o,target,130),32,false,{onHit:p=>{explode(p,32,'meteor');for(let i=0;i<3;i++)burnAt(p.x+rand(-12,12),p.y,p.z+rand(-12,12),6,14);}});whoosh(1,900,300,.4);}
function zapGun(target){const o=muzzle();bolt(o,target,'#a8c4ff',.9,.3,4);bolt(o,target,'#ffffff',.35,.25,3);damage(target,16,{});sparks(target,8,70);tone('sawtooth',1400,200,.3,.2);
  let from=target.clone();const hit=new Set();for(let k=0;k<4;k++){const n=nearestBuildings(from,90,6).find(b=>!hit.has(b));if(!n)break;hit.add(n);const hp=bTop(n);bolt(from,hp,'#a8c4ff',.6,.3,6);damage(hp,13,{few:true});sparks(hp,4,50);from=hp;}}
function acidGun(target){const o=muzzle();tone('sine',500,900,.3,.2);launch('orb',o,aimAt(o,target,140),0,false,{col:'#8aff5a',size:16,onHit:p=>{explode(p,16,'#8aff5a');const c=new V3(p.x,0,p.z);let t=0,acc=0;
  addSpecial({update(dt){t+=dt;if(t>5)return false;acc+=dt;if(acc<.5)return;acc=0;for(const b of buildings){if(!b.alive||dist2(b,c)>40)continue;damage(new V3(b.x,SW+b.h+8,b.z),14,{only:b,few:true});puff(1,b.x,SW+b.h,b.z,10,0,4,0,3,{c:C('#7fbf3a'),a:.5,grow:2});}}});}});}

function holeGun(target){const o=muzzle();launch('orb',o,aimAt(o,target,120),0,false,{col:'#7a4aff',size:16,onHit:p=>blackHole(p,{size:.45})});tone('sine',200,90,.6,.25);}
function bounceNade(target){const o=muzzle();const m=model('grenade');const pos=o.clone();const vel=ballistic(o,target,.9+o.distanceTo(target)/450);let n=0,t=0;
  addSpecial({update(dt){t+=dt;vel.y-=G*dt;pos.addScaledVector(vel,dt);m.position.copy(pos);m.rotation.x+=dt*6;const fl=roofY(pos.x,pos.z)+1.8;
    if(t>.15&&pos.y<=fl&&vel.y<0){pos.y=fl;n++;tone('triangle',300,200,.08,.15);if(n>=4){explode(pos.clone(),28,'bomb');return false;}vel.y=Math.abs(vel.y)*.55+10;vel.x*=.75;vel.z*=.75;}
    if(t>12)return false;},end(){scene.remove(m);}});}
function stickyBombs(target){every(.1,6,()=>{const o=muzzle();const tg=aroundT(target,45);tg.y=roofY(tg.x,tg.z);launch('grenade',o,ballistic(o,tg,.9+o.distanceTo(tg)/450),20,true);});}

function bananaBomb(target){const o=muzzle();launch('banana',o,ballistic(o,target,1.1+o.distanceTo(target)/450),0,true,{scale:1.5,onHit:p=>{explode(p,20,'bomb');
  for(let k=0;k<5;k++){const a=k/5*6.28;launch('banana',p.clone().add(new V3(0,3,0)),new V3(Math.cos(a)*25,45,Math.sin(a)*25),16,true,{scale:.9});}}});}

function gasTank(target){const g=new THREE.Group();const tk=new THREE.Mesh(new THREE.CylinderGeometry(5,5,12,24),tankM);tk.position.y=6;g.add(tk);
  for(const y of[0,12]){const s=new THREE.Mesh(new THREE.SphereGeometry(5,24,12),tankM);s.position.y=y;s.scale.y=.5;g.add(s);}
  g.position.copy(target);g.traverse(o=>{if(o.isMesh)o.castShadow=true;});scene.add(g);let t=0;whoosh(2.2,4000,1500,.25);
  addSpecial({update(dt){t+=dt;g.position.x=target.x+rand(-.3,.3)*t;if(Math.random()<.5)puff(1,target.x,target.y+12,target.z,4,rand(-3,3),rand(4,8),rand(-3,3),1.2,{c:C('#eeeeee'),a:.4});
    if(t>2.2){const p=target.clone();explode(p,72,'bomb');ring(p,120,1.2);flashA=Math.max(flashA,.3);for(let k=0;k<6;k++){const a=k/6*6.28;launch('lava',p.clone().add(new V3(0,6,0)),new V3(Math.cos(a)*40,60,Math.sin(a)*40),14,true);}return false;}},
    end(){scene.remove(g);}});}
function c4Ring(target){ringPts(target,50,5).forEach(p=>{p.y=roofY(p.x,p.z);c4(p);});}
function landmines(target){const ms=[];for(let i=0;i<16;i++){const p=aroundT(target,120);p.y=roofY(p.x,p.z);const g=new THREE.Group();const d=new THREE.Mesh(new THREE.CylinderGeometry(2.6,3,1.2,20),oliveM);d.position.y=.6;g.add(d);
    const l=glowSprite(3,'#ff2020');l.position.y=1.6;g.add(l);g.position.copy(p);scene.add(g);ms.push({g,p,l,d:dist2(p,target)});}
  ms.sort((a,b)=>a.d-b.d);let t=0,i=0;
  addSpecial({update(dt){t+=dt;for(const m of ms)m.l.material.opacity=.4+.6*Math.abs(Math.sin(t*8));while(i<ms.length&&t>1.5+i*.15){const m=ms[i++];scene.remove(m.g);explode(m.p,20,'bomb');}if(i>=ms.length)return false;},
    end(){for(const m of ms)scene.remove(m.g);}});}
function timeBomb(target){const g=new THREE.Group();bombModel(g,3,dark);g.rotation.z=Math.PI/2;g.position.copy(target).add(new V3(0,2.4,0));const led=glowSprite(8,'#ff2020');g.add(led);g.traverse(o=>{if(o.isMesh)o.castShadow=true;});scene.add(g);
  let t=0,last=-1;toast('10 seconds…');addSpecial({update(dt){t+=dt;const s=Math.floor(t);if(s!==last){last=s;tone('square',s>=7?2200:1500,s>=7?2100:1400,.12,.18);led.material.opacity=1;}else led.material.opacity*=.9;
    if(t>10){explode(target.clone(),95,'bomb');damage(target,70,{flat:true,few:true});return false;}},end(){scene.remove(g);}});}

function neutron(target){launch('nuke',target.clone().add(new V3(0,360,0)),new V3(0,-55,0),150,true,{scale:.8,boom:'#7ac8ff'});whoosh(3,200,90,.3);}
function thermobaric(target){whoosh(2.5,500,150,.4);launch('bomb',target.clone().add(new V3(0,300,0)),new V3(0,-40,0),0,true,{scale:1.8,onHit:p=>{let t=0;tone('sine',200,120,1.2,.15);
  addSpecial({update(dt){t+=dt;if(t<1.3){for(let k=0;k<4;k++){const a=rand(0,6.28),r=rand(0,80*t/1.3);puff(1,p.x+Math.cos(a)*r,p.y+rand(1,12),p.z+Math.sin(a)*r,rand(14,22),0,rand(1,3),0,1.5,{c:C('#e8dcc8'),a:.35,grow:1});}return;}
    explode(p,90,'bomb');for(let k=0;k<8;k++){const a=k/8*6.28;const q=new V3(p.x+Math.cos(a)*65,0,p.z+Math.sin(a)*65);q.y=roofY(q.x,q.z);explode(q,30,'bomb');}flashA=Math.max(flashA,.4);return false;}});}});}
function supernova(target){const c=target.clone();const core=new THREE.Mesh(new THREE.SphereGeometry(1,32,20),new THREE.MeshBasicMaterial({color:C('#fff6dc')}));const gl=glowSprite(1,'#ffd27a');const g=new THREE.Group();g.add(core,gl);g.position.set(c.x,c.y+140,c.z);scene.add(g);let t=0;whoosh(4,100,1200,.5);
  addSpecial({update(dt){t+=dt;const k=Math.min(1,t/3.5);core.scale.setScalar(4+k*22);gl.scale.setScalar(40+k*260);gl.material.opacity=.6+.4*Math.random();g.position.y=c.y+140-k*60;shake=Math.max(shake,k*1.5);

function mk(geo,mat,x,y,z){const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);return m;}

function detach(b){const m=b.mesh;b.mesh=null;b.alive=false;b.rubble=false;flattened++;lostVol+=b.w*b.d*b.h;updateStats();return m;}
function disposeMesh(m){if(!m)return;if(m.parent)m.parent.remove(m);m.traverse(q=>{if(q.geometry&&q.geometry!==boomGeo&&q.geometry!==pinGeo)q.geometry.dispose();});}
function debrisAt(p,n,col,spd,up){for(let i=0;i<n;i++)chunk(Math.random()<.25?shards:rocks,p.x+rand(-5,5),p.y+rand(0,5),p.z+rand(-5,5),rand(1.4,3.4),rand(1,2.4),rand(1.4,3.4),rand(-1,1)*spd,rand(4,up||18),rand(-1,1)*spd,_c2.copy(col).multiplyScalar(rand(.4,.9)));}
function topple(b,dir,o){o=o||{};if(!b||!b.alive||!b.mesh)return false;const m=b.mesh,H=b.h,W=Math.min(b.w,b.d),col=b.side.color.clone();
  b.mesh=null;b.alive=false;b.rubble=true;b.rubH=Math.min(7,2.5+H*.05);flattened++;lostVol+=b.w*b.d*H;updateStats();
  dir=dir.clone().setY(0);if(dir.lengthSq()<1e-4)dir.set(1,0,0);dir.normalize();const half=(Math.abs(dir.x)*b.w+Math.abs(dir.z)*b.d)/2;
  const piv=new THREE.Group();piv.position.set(b.x+dir.x*half,SW,b.z+dir.z*half);scene.add(piv);if(m.parent)m.parent.remove(m);m.position.set(-dir.x*half,0,-dir.z*half);piv.add(m);
  const axis=new V3(dir.z,0,-dir.x);let ang=0,w=.15;tone('sawtooth',90,50,1.2,.08);
  addSpecial({update(dt){w+=dt*(1.6+ang*3);ang=Math.min(Math.PI/2,ang+w*dt);piv.quaternion.setFromAxisAngle(axis,ang);
    if(Math.random()<.3)puff(1,b.x+rand(-W,W)*.5,2,b.z+rand(-W,W)*.5,rand(8,14),0,rand(2,6),0,2.5,{c:C('#9a8c78'),a:.5,grow:2});
    if(ang<Math.PI/2)return;
    const step=Math.max(8,W*.8);for(let s=0;s<H;s+=step){const p=new V3(b.x+dir.x*(half+s),SW,b.z+dir.z*(half+s));damage(p,Math.max(10,W*.6),{few:true});debrisAt(p.clone().setY(SW+2),4,col,20,14);
      puff(1,p.x,3,p.z,rand(12,20),rand(-6,6),rand(4,10),rand(-6,6),rand(3,5),{c:C('#9a8c78'),a:.6,grow:2.2});}
    const end=new V3(b.x+dir.x*(half+H),SW,b.z+dir.z*(half+H));boom(Math.min(90,30+H*.3),Math.min(1,camera.position.distanceTo(end)/900));shake=Math.min(4,shake+1+H/80);
    if(b.ch.group)addRubble(b);if(o.onDone)o.onDone(end);return false;},

function heavyDrop(target,g,R,o){o=o||{};const pos=target.clone();pos.y=Math.max(target.y,0)+420;g.position.copy(pos);shade(g);addDecal(g);

function drive(target,o){const f=camFwd();const g=shade(o.build());scene.add(g);const dir=(o.dir||f).clone();

  addSpecial({update(dt){t+=dt;if(t>o.dur){g.position.y-=dt*60;return g.position.y>-90;}
    pos.addScaledVector(dir,o.speed*dt);
    if(o.hop){vy-=G*dt;air+=vy*dt;if(air<=0){if(vy<-5){const p=pos.clone().setY(SW);damage(p,o.R*1.6,{flat:true});ring(p,o.R*2.2,.6);boom(40,0);shake=Math.min(3,shake+1.6);dust(p,10,o.R);}air=0;vy=0;if(Math.random()<dt*.9)vy=55;}}
    g.position.set(pos.x,SW+air,pos.z);

      if(Math.random()<.5)puff(1,pos.x-dir.x*o.R,2,pos.z-dir.z*o.R,10,0,4,0,2,{c:C('#9a8c78'),a:.45,grow:2});}
    if(o.tick)o.tick(pos,dir,t,g,dt);},end(){scene.remove(g);}});}
function skyCrash(target,g,R,o){o=o||{};const from=target.clone().add(o.from||new V3(320,420,160));const pos=from.clone();const v=target.clone().sub(from).normalize().multiplyScalar(o.speed||160);

  const opts=extra=>{const o={scale:sc,onHit,col,size:Math.max(8,R*.6)};if(trail!==null)o.trail=trail;return Object.assign(o,extra||{});};
  const emit=(fn,max)=>{const n2=Math.min(N,max||N);
    if(g.timing===4){let i=0,t=0,next=0;addSpecial({update(dt){t+=dt;while(i<n2&&t>=next){fn(i++,n2);next+=Math.max(.02,.3*Math.pow(.85,i));}if(i>=n2)return false;}});}
    else if(g.timing===0){for(let i=0;i<n2;i++)fn(i,n2);}else every([0,.05,.12,.25][g.timing],n2,i=>fn(i,n2));};
  const dropTo=tg=>{tg.y=roofY(tg.x,tg.z);launch(kind,tg.clone().add(new V3(0,280,0)),new V3(0,-80*spd,0),R,true,opts());};
  whoosh(1.5,1200*spd,400,.3);
  switch(GDK[g.d]){
    case 'shot':emit(()=>{const o=muzzle();const tg=target.clone().add(new V3(rand(-1,1)*spread*.3,0,rand(-1,1)*spread*.3));launch(kind,o,aimAt(o,tg,180*spd),R,false,opts());});break;
    case 'rain':emit(()=>{const tg=aroundT(target,spread+10);tg.y=roofY(tg.x,tg.z);launch(kind,fromSky(tg,300,20),new V3(0,-80*spd,0),R,true,opts());});break;
    case 'meteor':emit(()=>{const tg=aroundT(target,spread+10);tg.y=roofY(tg.x,tg.z);const o=tg.clone().add(new V3(300,600,120));launch(kind,o,aimAt(o,tg,300*spd),R,false,opts());});break;
    case 'ring':{const pts=ringPts(target,Math.max(30,spread),Math.min(N,60));emit(i=>dropTo(pts[i]));break;}
    case 'line':{const r=camRight(camFwd()),L=Math.max(60,spread*2);emit((i,m)=>dropTo(target.clone().addScaledVector(r,m>1?(i/(m-1)-.5)*L:0)));break;}
    case 'spiral':emit((i,m)=>{const a=i*.7,rr=8+i*Math.max(60,spread)/Math.max(1,m);dropTo(new V3(target.x+Math.cos(a)*rr,SW,target.z+Math.sin(a)*rr));});break;
    case 'grid':{const k=Math.ceil(Math.sqrt(N)),gap=Math.max(20,Math.max(60,spread)*2/Math.max(1,k-1));emit(i=>dropTo(new V3(target.x+(i%k-(k-1)/2)*gap,SW,target.z+(Math.floor(i/k)-(k-1)/2)*gap)));break;}
    case 'jet':{const d=Math.min(N,20);jetPass(target,{drops:d,spacing:Math.max(12,Math.max(60,spread)*2/Math.max(1,d-1)),R,kind:kind==='orb'||kind==='drone'?'bomb':kind,onHit});break;}
    case 'lob':emit(()=>{const o=muzzle();const tg=aroundT(target,spread*.5+2);tg.y=roofY(tg.x,tg.z);launch(kind,o,ballistic(o,tg,(1+o.distanceTo(tg)/450)/spd),R,true,opts());});break;
    case 'beam':emit(i=>{const tg=i?aroundT(target,spread+20):target.clone();laserBeam(tg,{color:col,rad:Math.max(.5,Math.min(3,R/20)),dur:2.5,speed:spd*20});},8);break;
    case 'fountain':emit(()=>{const a=rand(0,6.28),s=rand(10,40)+spread*.15;launch(kind,target.clone().add(new V3(0,3,0)),new V3(Math.cos(a)*s,rand(70,110)*Math.sqrt(spd),Math.sin(a)*s),R,true,opts());});break;
    default:emit(()=>{const o=muzzle();const f=new V3();camera.getWorldDirection(f);const v=f.multiplyScalar(60).add(new V3(rand(-40,40),rand(20,50),rand(-40,40)));
      const h=aroundT(target,spread*.4+5);h.y=roofY(h.x,h.z);launch(kind,o,v,R,false,opts({home:h,speed:160*spd,turn:2.6,delay:.15}));});
  }
  return g;}
const genCache={};
function getW(id){if(WMAP[id])return WMAP[id];const m=/^gen:(\d+)$/.exec(id||'');if(!m)return null;const n=+m[1];if(!(n>=1&&n<=GEN_TOTAL))return null;
  if(!genCache[id]){const g=genParams(n);genCache[id]=[id,GE[g.e]+' '+GP[g.p][1],'Factory','factory',t=>genFire(n,t),GP[g.p][2]+'|'+GCOL[g.c],genName(g)+' · #'+n.toLocaleString()];}return genCache[id];}
function trillions(v){return (v/1e12).toFixed(1).replace(/\.0$/,'')+' trillion';}

let weapon='rocket';
function fire(target){marker.position.set(target.x,target.y+.4,target.z);marker.visible=true;markerT=0;markerHold=1.5;
  const w=getW(weapon);if(w)w[4](target);}

// ---------- time of day ----------
const MODES={
  day:{label:'Day',top:'#2a6fd1',bot:'#cfe6fa',sun:'#fff1d6',sunI:2.6,pos:[220,330,140],hs:'#d6ebff',hg:'#7a6a52',hi:.7,fog:'#c3dbee',exp:.95,win:0,car:0,stars:0,cloud:.85,cloudC:'#ffffff',glow:1,far:0},
  sunset:{label:'Sunset',top:'#273070',bot:'#ff8d4f',sun:'#ffa860',sunI:2.2,pos:[400,75,-80],hs:'#ffb48c',hg:'#463848',hi:.45,fog:'#d8896a',exp:1.05,win:1,car:1.5,stars:.15,cloud:.8,cloudC:'#ffb48a',glow:2.5,far:.05},
  night:{label:'Night',top:'#01030a',bot:'#0f1e3c',sun:'#9fb8ff',sunI:.5,pos:[-200,260,140],hs:'#3a5aa8',hg:'#0a0a12',hi:.28,fog:'#0b1428',exp:1.2,win:2.2,car:3,stars:1,cloud:.18,cloudC:'#8fa2c8',glow:.35,far:.16}
};
const ORDER=['day','sunset','night'];let modeI=0;
function applyMode(){const m=MODES[ORDER[modeI]];
  skyMat.uniforms.top.value.copy(C(m.top));skyMat.uniforms.bot.value.copy(C(m.bot));skyMat.uniforms.sunC.value.copy(C(m.sun)).multiplyScalar(m.glow);
  sunDirV.set(...m.pos).normalize();skyMat.uniforms.sunDir.value.copy(sunDirV);skyMat.uniforms.sunSize.value=ORDER[modeI]==='night'?.5:1;
  sun.color.copy(C(m.sun));sun.intensity=m.sunI;
  hemi.color.copy(C(m.hs));hemi.groundColor.copy(C(m.hg));hemi.intensity=m.hi;
  scene.fog.color.copy(C(m.fog));renderer.toneMappingExposure=m.exp;
  for(const w of winMats)w.emissiveIntensity=m.win;farMat.emissiveIntensity=m.far;
  headMat.emissiveIntensity=m.car;tailMat.emissiveIntensity=m.car*.8;
  starMat.opacity=m.stars;for(const c of clouds){c.material.opacity=m.cloud;c.material.color.copy(C(m.cloudC));}
  if(envRT)envRT.dispose();envRT=pmrem.fromScene(envScene,.04);scene.environment=envRT.texture;
  document.getElementById('timeLabel').textContent=m.label;}
applyMode();

// ---------- camera controls ----------
const ptrs=new Map();let moved=false,multi=false,pinch0=0,mid0=null;
const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{initAudio();el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,btn:e.button,shift:e.shiftKey});
  cam.travel=null;
  if(ptrs.size===1){moved=false;multi=false;}else{multi=true;const a=[...ptrs.values()];pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);mid0={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};}});
function pan(dx,dy){const k=cam.dist*.0022;const f=new V3(Math.sin(cam.yaw),0,Math.cos(cam.yaw)),r=new V3(Math.cos(cam.yaw),0,-Math.sin(cam.yaw));
  cam.target.addScaledVector(r,-dx*k).addScaledVector(f,-dy*k);}
el.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1&&!multi){if(Math.hypot(p.x-p.sx,p.y-p.sy)>8)moved=true;if(!moved)return;
    if(p.btn===2||p.shift)pan(dx,dy);else{cam.yaw-=dx*.005;cam.pitch=THREE.MathUtils.clamp(cam.pitch+dy*.004,.06,1.45);}}
  else if(ptrs.size===2){const a=[...ptrs.values()];const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),m={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
    if(pinch0>0)cam.dist=THREE.MathUtils.clamp(cam.dist*pinch0/d,35,950);pinch0=d;pan(m.x-mid0.x,m.y-mid0.y);mid0=m;}});
function up(e){const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);
  if(ptrs.size===0&&!multi&&!moved&&p.btn===0)tapFire(e.clientX,e.clientY);
  if(ptrs.size===1){const a=[...ptrs.values()][0];a.sx=a.x;a.sy=a.y;}}
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);});
el.addEventListener('contextmenu',e=>e.preventDefault());
el.addEventListener('wheel',e=>{e.preventDefault();cam.dist=THREE.MathUtils.clamp(cam.dist*Math.exp(e.deltaY*.0012),35,950);},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')closeArsenal();});addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
const ray=new THREE.Raycaster();
let hinted=false;
function tapFire(x,y){const r=el.getBoundingClientRect();ray.setFromCamera({x:(x-r.left)/r.width*2-1,y:-(y-r.top)/r.height*2+1},camera);
  const hits=ray.intersectObjects(clickables,true);if(!hits.length)return;
  fire(hits[0].point);
  if(!hinted){hinted=true;document.getElementById('hint').classList.add('gone');}}

// ---------- weapon UI ----------
const recentEl=document.getElementById('recent'),arsenal=document.getElementById('arsenal'),catsEl=document.getElementById('cats');
let recent=['rocket','nuke','robot','tsunami','dragon','moon','ufo','blackhole'];
try{const s=JSON.parse(localStorage.getItem('smash-recent')||'null');if(Array.isArray(s)){const ok=s.filter(id=>getW(id));if(ok.length)recent=ok.slice(0,8);}
  const w=localStorage.getItem('smash-weapon');if(w&&getW(w))weapon=w;}catch(e){}
if(!recent.includes(weapon))recent=[weapon,...recent].slice(0,8);
function svg(spec){const [id,col]=spec.split('|');return '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"'+(col?' style="color:'+col+'"':'')+'>'+(I[id]||'')+'</svg>';}
function wbtn(w){const b=document.createElement('button');b.type='button';b.className='wpn';b.dataset.w=w[0];
  b.innerHTML=svg(w[5]||w[0])+'<span>'+w[1]+'</span><small>'+w[2]+'</small>';if(w[6]){b.title=w[6];b.setAttribute('aria-label',w[6]);}b.setAttribute('aria-pressed',w[0]===weapon?'true':'false');
  b.addEventListener('click',()=>pick(w[0]));return b;}
function renderRecent(){recentEl.innerHTML='';for(const id of recent){const w=getW(id);if(w)recentEl.appendChild(wbtn(w));}}
function syncPressed(){document.querySelectorAll('.wpn[data-w]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.w===weapon?'true':'false'));}
function pick(id){initAudio();weapon=id;
  if(!recent.includes(id)){recent=[id,...recent].slice(0,8);renderRecent();}
  try{localStorage.setItem('smash-recent',JSON.stringify(recent));localStorage.setItem('smash-weapon',id);}catch(e){}
  syncPressed();closeArsenal();}
function buildArsenal(){
  const fchip=document.createElement('button');fchip.type='button';fchip.className='chip hot';fchip.textContent='Weapon factory';document.getElementById('catnav').appendChild(fchip);
  const fs=document.createElement('section');fs.className='cat';fchip.addEventListener('click',()=>fs.scrollIntoView({block:'start'}));
  fs.innerHTML='<h3>Weapon factory<span>'+GEN_TOTAL.toLocaleString()+' weapons</span></h3><div class="fac"><div class="facprev"><div class="facicon" id="facIcon"></div><div class="factext"><div class="facname" id="facName"></div><div class="facdesc" id="facDesc"></div></div></div>'+
   '<div class="facrow"><label for="facNum">Weapon number</label><input id="facNum" type="text" inputmode="numeric" autocomplete="off" spellcheck="false"><button type="button" class="chip" id="facRand">Random</button><button type="button" class="chip" id="facNext">Next</button><button type="button" class="usebtn" id="facUse">Use this weapon</button></div>'+
   '<p class="facnote">Every number from 1 to '+GEN_TOTAL.toLocaleString()+' is a different weapon.</p></div>';
  catsEl.appendChild(fs);
  const inp=fs.querySelector('#facNum');let facN=1+Math.floor(Math.random()*GEN_TOTAL);
  const show=()=>{const g=genParams(facN);fs.querySelector('#facIcon').innerHTML=svg(GP[g.p][2]+'|'+GCOL[g.c]);fs.querySelector('#facName').textContent=genName(g);fs.querySelector('#facDesc').textContent=genDesc(g);fs.querySelector('#facUse').disabled=false;};
  const setN=n=>{facN=n;inp.value=n.toLocaleString();show();};
  inp.addEventListener('input',()=>{const d=inp.value.replace(/\D/g,'');if(!d){fs.querySelector('#facName').textContent='Type a number';fs.querySelector('#facDesc').textContent='Any whole number from 1 to '+GEN_TOTAL.toLocaleString()+'.';fs.querySelector('#facUse').disabled=true;return;}
    let n=Number(d.slice(0,16));if(n<1)n=1;if(n>GEN_TOTAL)n=GEN_TOTAL;facN=n;show();});
  inp.addEventListener('blur',()=>{if(inp.value.replace(/\D/g,''))inp.value=facN.toLocaleString();});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')pick('gen:'+facN);});
  fs.querySelector('#facRand').addEventListener('click',()=>setN(1+Math.floor(Math.random()*GEN_TOTAL)));
  fs.querySelector('#facNext').addEventListener('click',()=>setN(facN>=GEN_TOTAL?1:facN+1));
  fs.querySelector('#facUse').addEventListener('click',()=>pick('gen:'+facN));
  setN(facN);
  for(const [key,label] of CATS){const list=WEAPONS.filter(w=>w[3]===key);
  const chip=document.createElement('button');chip.type='button';chip.className='chip';chip.textContent=label;document.getElementById('catnav').appendChild(chip);
  const sec=document.createElement('section');sec.className='cat';chip.addEventListener('click',()=>sec.scrollIntoView({block:'start'}));sec.innerHTML='<h3>'+label+'<span>'+list.length+'</span></h3>';
  const grid=document.createElement('div');grid.className='grid';list.forEach(w=>grid.appendChild(wbtn(w)));sec.appendChild(grid);catsEl.appendChild(sec);}
  document.getElementById('arsTitle').textContent='Arsenal · '+WEAPONS.length+' + '+trillions(GEN_TOTAL)+' weapons';
  document.getElementById('arsSub').textContent='Pick a weapon, then tap the city. The factory makes '+GEN_TOTAL.toLocaleString()+' more.';
  document.getElementById('allCount').textContent=trillions(GEN_TOTAL)+'+';}
function openArsenal(){initAudio();arsenal.hidden=false;syncPressed();document.getElementById('btnClose').focus();}
function closeArsenal(){if(!arsenal.hidden){arsenal.hidden=true;document.getElementById('btnArsenal').focus({preventScroll:true});}}
document.getElementById('btnArsenal').addEventListener('click',openArsenal);
document.getElementById('btnClose').addEventListener('click',closeArsenal);
arsenal.addEventListener('click',e=>{if(e.target===arsenal)closeArsenal();});
buildArsenal();renderRecent();

document.getElementById('btnTime').addEventListener('click',()=>{modeI=(modeI+1)%3;applyMode();});
document.getElementById('btnGo').addEventListener('click',()=>{const f=new V3(-Math.sin(cam.yaw),0,-Math.cos(cam.yaw));
  cam.travel={from:cam.target.clone(),to:cam.target.clone().addScaledVector(f,900),t:0};});
let timeScale=1,slowI=0;const bs=document.getElementById('btnSlow'),slowLabel=document.getElementById('slowLabel');
const SPEEDS=[[1,'Slow-mo'],[.25,'Slow'],[.08,'Super slow'],[.025,'Ultra slow']];
bs.addEventListener('click',()=>{slowI=(slowI+1)%SPEEDS.length;timeScale=SPEEDS[slowI][0];slowLabel.textContent=SPEEDS[slowI][1];bs.setAttribute('aria-pressed',slowI?'true':'false');});
function newCity(){
  clearSpecials();for(const p of projs)scene.remove(p.mesh);projs.length=0;for(const j of jets)scene.remove(j.mesh);jets.length=0;emitters=[];
  for(const d of decals)scene.remove(d);decals.length=0;for(const b of bolts)scene.remove(b.m);bolts.length=0;
  for(const pl of pools){for(let i=0;i<pl.max;i++){pl.D[i].on=false;pl.im.setMatrixAt(i,zeroM);}pl.im.instanceMatrix.needsUpdate=true;}
  for(const p of parts){p.on=false;p.s.visible=false;}
  for(const ch of chunks.values())if(ch.group)unloadNear(ch);chunks.clear();
  wseed=(Math.random()*1e6)|0;lostVol=0;flattened=0;cam.target.set(0,15,0);cam.travel=null;
  refreshChunks(true);cars.forEach(resetCar);updateStats();}
document.getElementById('btnReset').addEventListener('click',newCity);
const elB=document.getElementById('bill'),elF=document.getElementById('flat'),elDist=document.getElementById('dist');
function money(v){if(v>=1e12)return '$'+(v/1e12).toFixed(1)+'T';if(v>=1e9)return '$'+(v/1e9).toFixed(v>=1e10?0:1)+'B';if(v>=1e6)return '$'+(v/1e6).toFixed(0)+'M';if(v>=1e3)return '$'+(v/1e3).toFixed(0)+'K';return '$'+Math.round(v);}
function updateStats(){elB.textContent=money(lostVol*2600);elF.textContent=flattened.toLocaleString();}

// ---------- loop ----------
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize);
refreshChunks(true);cars.forEach(resetCar);updateStats();
let last=performance.now(),clock=0,distT=0;
function sim(rdt){const dt=rdt*timeScale;clock+=dt;
  if(cam.travel){const tr=cam.travel;tr.t=Math.min(1,tr.t+rdt/2.5);const k=tr.t*tr.t*(3-2*tr.t);cam.target.lerpVectors(tr.from,tr.to,k);if(tr.t>=1)cam.travel=null;}
  const kx=(keys['d']?1:0)-(keys['a']?1:0),kz=(keys['s']?1:0)-(keys['w']?1:0);if(kx||kz)pan(-kx*rdt*600,-kz*rdt*600);
  refreshChunks(false);
  const tx=cam.target.x,tz=cam.target.z;
  for(const c of cars){const cp=c.g.position;
    if(c.flying){c.vel.y-=G*dt;cp.addScaledVector(c.vel,dt);c.g.rotation.x+=c.av.x*dt;c.g.rotation.y+=c.av.y*dt;c.g.rotation.z+=c.av.z*dt;
      if(cp.y<0){cp.y=0;c.vel.y*=-.25;c.vel.x*=.55;c.vel.z*=.55;c.av.multiplyScalar(.5);
        if(c.vel.length()<3){c.flying=false;c.g.rotation.x=Math.round(c.g.rotation.x/Math.PI)*Math.PI;c.g.rotation.z=Math.round(c.g.rotation.z/Math.PI)*Math.PI;c.wreck=true;
          if(c.body.material===burntMat)burnAt(cp.x,0,cp.z,1.5,12);}}}
    else if(!c.wreck){c.along+=c.dir*c.speed*dt;placeCar(c);}
    if(!c.flying&&!c.sink&&(Math.abs(cp.x-tx)>320||Math.abs(cp.z-tz)>320))resetCar(c);
  }
  updateProjs(dt);updateJets(dt);updateSpecials(dt);updateBolts(dt);
  for(let i=emitters.length-1;i>=0;i--){const e=emitters[i];e.t+=dt;if(e.t>e.dur){emitters.splice(i,1);continue;}e.fn(e,dt);}
  updateParts(dt);updateDebris(dt);
  if(farDirty){farDirty=false;refreshChunks(true);}
  for(const r of rings){if(!r.m.visible)continue;r.t+=dt;const k=r.t/r.life;if(k>=1){r.m.visible=false;continue;}
    r.m.scale.setScalar(r.R*(.15+Math.pow(k,.5)));r.m.material.opacity=(1-k)*.9;}
  for(const l of flashes)l.intensity*=Math.exp(-dt*4.5);
  if(marker.visible){markerT+=rdt;const k=markerT/(markerHold+.4);if(k>=1)marker.visible=false;else{marker.scale.setScalar(6+Math.sin(markerT*10)*1.2);marker.material.opacity=.9*(1-k*k);}}
  if(flashA>0){flashEl.style.opacity=flashA.toFixed(3);flashA=Math.max(0,flashA-rdt*.7);if(flashA===0)flashEl.style.opacity=0;}
  for(const c of clouds){c.position.x+=dt*4;if(c.position.x>1700)c.position.x=-1700;}
  ground.position.set(Math.round(tx/CELL)*CELL,0,Math.round(tz/CELL)*CELL);
  far.position.set(tx,0,tz);
  sun.target.position.set(tx,0,tz);sun.position.copy(sunDirV).multiplyScalar(600).add(sun.target.position);
  distT+=rdt;if(distT>.3){distT=0;elDist.textContent=(Math.hypot(tx,tz)/1000).toFixed(1)+' km';}
}
function placeCamera(){const cp=Math.cos(cam.pitch);
  camera.position.set(cam.target.x+cp*Math.sin(cam.yaw)*cam.dist,cam.target.y+Math.sin(cam.pitch)*cam.dist,cam.target.z+cp*Math.cos(cam.yaw)*cam.dist);
  camera.lookAt(cam.target);}
function frame(now){requestAnimationFrame(frame);const rdt=Math.min(.05,(now-last)/1000);last=now;sim(rdt);
  placeCamera();
  if(shake>0){const s=reduceMotion?shake*.2:shake;camera.position.x+=rand(-s,s);camera.position.y+=rand(-s,s);camera.position.z+=rand(-s,s);shake=Math.max(0,shake-rdt*2.5*Math.max(1,shake));}
  sky.position.copy(camera.position);stars.position.copy(camera.position);
  renderer.render(scene,camera);
}
placeCamera();
requestAnimationFrame(frame);
// test hook: lets an automated check fire every weapon and step the simulation
window.__smash={total:()=>GEN_TOTAL,ids:()=>WEAPONS.map(w=>w[0]),fireAt(id,x,z){weapon=id;placeCamera();camera.updateMatrixWorld();fire(new V3(x,roofY(x,z),z));},
  step(sec){for(let t=0;t<sec;t+=1/30)sim(1/30);},stats:()=>({projs:projs.length,specials:specials.length,flattened,buildings:buildings.length,bolts:bolts.length}),newCity};
})();
</script>
