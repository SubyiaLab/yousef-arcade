<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Titan Smash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@500;600;700;800&display=swap">
<style>
/* Layout: one full-bleed 3D canvas; HUD pinned to the safe-area corners; menu is a left-hand plate laid over the live city */
:root {
  --ink: #EEF2F5;
  --ink-2: #BAC4CD;
  --ink-3: #7F8B97;
  --plate: rgba(10, 13, 17, .76);
  --plate-2: rgba(20, 25, 31, .86);
  --line: rgba(238, 242, 245, .16);
  --amber: #FFB020;
  --amber-ink: #1A1206;
  --core: #5BE6FF;
  --alert: #FF4A3D;
  --bg: #0A0C0F;
  --f-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
  --gt: max(14px, env(safe-area-inset-top, 0px));
  --gb: max(14px, env(safe-area-inset-bottom, 0px));
  --notch: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--ink); }
body { font-family: var(--f-ui); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

#stage { position: fixed; inset: 0; overflow: hidden; background: var(--bg); touch-action: none; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

/* ---------- shared pieces ---------- */
.logo { margin: 0; font: 900 clamp(64px, 11vw, 112px)/.8 var(--f-display); letter-spacing: .01em; text-transform: uppercase; color: var(--ink); text-wrap: balance; }
.logo span { display: block; color: var(--amber); }
.eyebrow { margin: 0; font: 700 13px/1.2 var(--f-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--ink-2); }
.hazard { height: 10px; width: 132px; background: repeating-linear-gradient(-45deg, var(--amber) 0 10px, #111 10px 20px); clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }

/* ---------- loading ---------- */
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(120% 90% at 70% 20%, #1b222b 0%, var(--bg) 70%); z-index: 30; padding-left: var(--gl); padding-right: var(--gr); }
.ld-inner { display: grid; gap: 18px; width: min(440px, 100%); }
.bar { height: 6px; background: rgba(255,255,255,.08); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0%; background: var(--amber); transition: width .25s ease; }
#ldText { margin: 0; font: 600 14px/1.3 var(--f-ui); color: var(--ink-3); letter-spacing: .04em; }
#ldErr { margin: 0; font: 600 15px/1.45 var(--f-ui); color: var(--ink); max-width: 46ch; }

/* ---------- menu ---------- */
#menu { position: absolute; inset: 0; z-index: 20; display: flex; align-items: stretch; pointer-events: none; }
.menu-col { pointer-events: auto; width: min(460px, 100%); box-sizing: border-box; padding-block: calc(var(--gt) + 18px) calc(var(--gb) + 18px); padding-left: calc(var(--gl) + 12px); padding-right: 28px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; background: linear-gradient(90deg, rgba(8,10,13,.92) 0%, rgba(8,10,13,.84) 62%, rgba(8,10,13,0) 100%); }
.menu-col .logo { margin-top: 4px; }
.modes { display: grid; gap: 12px; }
.mode { display: grid; gap: 4px; text-align: left; padding: 16px 18px 15px; background: var(--plate-2); border: 1px solid var(--line); clip-path: var(--notch); transition: border-color .15s, background .15s, transform .15s; }
.mode:hover, .mode:focus-visible { border-color: var(--amber); background: rgba(34, 30, 20, .92); }
.mode:active { transform: scale(.985); }
.mode-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.mode-k { font: 900 34px/1 var(--f-display); text-transform: uppercase; letter-spacing: .02em; }
.mode-s { font: 700 13px/1 var(--f-ui); color: var(--amber); letter-spacing: .06em; text-transform: uppercase; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mode-d { font: 500 14px/1.4 var(--f-ui); color: var(--ink-2); }
.opts { display: grid; gap: 12px; }
.opt { display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 12px; }
.opt-k { font: 700 12px/1 var(--f-ui); letter-spacing: .18em; text-transform: uppercase; color: var(--ink-3); }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 9px 13px 8px; font: 700 13px/1 var(--f-ui); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); background: rgba(255,255,255,.06); border: 1px solid transparent; }
.seg button[aria-pressed="true"] { background: var(--amber); color: var(--amber-ink); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); box-shadow: inset 0 0 0 3px rgba(0,0,0,.35); }
.swatches button[aria-pressed="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 3px rgba(0,0,0,.35), 0 0 0 2px rgba(255,176,32,.35); }
.hint { margin: 0; font: 500 13px/1.5 var(--f-ui); color: var(--ink-3); max-width: 44ch; }
.hint b { color: var(--ink-2); font-weight: 700; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
#hud .tl { position: absolute; left: var(--gl); top: var(--gt); display: grid; gap: 8px; }
.score-k, .armor-k, .city-k { font: 700 11px/1 var(--f-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-2); text-shadow: 0 1px 3px rgba(0,0,0,.6); }
#score { font: 900 48px/.9 var(--f-display); font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.55); }
#combo { font: 900 24px/1 var(--f-display); color: var(--amber); text-transform: uppercase; letter-spacing: .03em; min-height: 24px; text-shadow: 0 2px 8px rgba(0,0,0,.6); transition: transform .12s; }
#combo.pop { transform: scale(1.18); }
.armor { display: grid; gap: 5px; margin-top: 4px; }
.armor-bar { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; width: 210px; }
.armor-bar i { height: 9px; background: var(--core); box-shadow: 0 0 8px rgba(91,230,255,.45); transition: background .2s, opacity .2s; }
.armor-bar i.off { background: rgba(255,255,255,.12); box-shadow: none; }
.armor.low .armor-bar i:not(.off) { background: var(--alert); box-shadow: 0 0 8px rgba(255,74,61,.6); }
#hud .tc { position: absolute; left: 50%; top: var(--gt); transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; }
#timer { font: 900 40px/1 var(--f-display); font-variant-numeric: tabular-nums; padding: 6px 16px 5px; background: var(--plate); clip-path: var(--notch); }
#timer.hot { color: var(--alert); }
#hud .tr { position: absolute; right: var(--gr); top: var(--gt); display: flex; align-items: flex-start; gap: 14px; }
.city { display: grid; justify-items: end; gap: 4px; }
#wreckN { font: 900 34px/.9 var(--f-display); font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px rgba(0,0,0,.55); }
#btnPause { pointer-events: auto; width: 48px; height: 48px; display: grid; place-items: center; background: var(--plate); clip-path: var(--notch); }
#btnPause svg { width: 20px; height: 20px; }
#callouts { position: absolute; left: 0; right: 0; top: 24%; display: grid; justify-items: center; gap: 6px; padding-left: var(--gl); padding-right: var(--gr); }
.callout { display: grid; justify-items: center; animation: callout 1.9s cubic-bezier(.2,.9,.2,1) forwards; text-align: center; }
.callout b { font: 900 clamp(40px, 7vw, 72px)/.88 var(--f-display); text-transform: uppercase; letter-spacing: .02em; color: var(--ink); text-shadow: 0 3px 18px rgba(0,0,0,.6); }
.callout span { font: 900 26px/1 var(--f-display); color: var(--amber); font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,.6); }
.callout.small b { font-size: clamp(28px, 4.4vw, 42px); }
@keyframes callout { 0% { opacity: 0; transform: scale(1.5); } 10% { opacity: 1; transform: scale(1); } 78% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-26px); } }
#crosshair { position: absolute; left: 50%; top: 35%; width: 46px; height: 46px; margin: -23px 0 0 -23px; opacity: 0; transition: opacity .15s; }
#crosshair.on { opacity: 1; }

/* touch controls */
#joy { position: absolute; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; border: 2px solid rgba(255,255,255,.22); background: rgba(10,13,17,.25); opacity: 0; transition: opacity .12s; }
#joy.on { opacity: 1; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(238,242,245,.82); box-shadow: 0 2px 10px rgba(0,0,0,.4); }
#joyHint { position: absolute; left: calc(var(--gl) + 36px); bottom: calc(var(--gb) + 40px); font: 700 12px/1.3 var(--f-ui); letter-spacing: .16em; text-transform: uppercase; color: rgba(238,242,245,.55); text-shadow: 0 1px 3px rgba(0,0,0,.7); }
#actions { position: absolute; right: var(--gr); bottom: var(--gb); width: 280px; height: 250px; pointer-events: none; }
.act { position: absolute; pointer-events: auto; display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 50%; background: rgba(10,13,17,.55); border: 2px solid rgba(238,242,245,.35); color: var(--ink); touch-action: none; -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); transition: transform .08s, background .08s, opacity .2s; }
.act svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.act em { font: 800 10px/1 var(--f-ui); font-style: normal; letter-spacing: .14em; text-transform: uppercase; }
.act.down { transform: scale(.9); background: rgba(255,176,32,.35); border-color: var(--amber); }
.act.cool { opacity: .45; }
#aPunch { width: 108px; height: 108px; right: 4px; bottom: 6px; border-color: var(--amber); }
#aPunch svg { width: 40px; height: 40px; }
#aStomp { width: 76px; height: 76px; right: 124px; bottom: 0; }
#aFire { width: 88px; height: 88px; right: 106px; bottom: 94px; }
#aFire em { max-width: 72px; text-align: center; line-height: 1.05; }
#aDash { width: 68px; height: 68px; right: 20px; bottom: 128px; }
#aFire .ring { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); transform: rotate(-90deg); }
#aFire .ring circle { fill: none; stroke-width: 4; }
#aFire.cool { opacity: .55; }
#aFire.deny { animation: deny .28s linear; }
@keyframes deny { 0%, 100% { translate: 0 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
#wbar { position: absolute; right: var(--gr); bottom: calc(var(--gb) + 262px); display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
.kb #wbar { bottom: calc(var(--gb) + 74px); }
.wchip { position: relative; width: 50px; height: 50px; display: grid; place-items: center; background: rgba(10,13,17,.66); border: 2px solid rgba(238,242,245,.2); color: var(--ink-2); overflow: hidden; touch-action: none; clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px)); transition: border-color .12s, background .12s, color .12s, transform .08s; }
.wchip svg { position: relative; z-index: 1; width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
.wchip:active { transform: scale(.92); }
.wchip[aria-pressed="true"] { border-color: var(--amber); background: rgba(58,42,10,.86); color: var(--amber); }
.wchip .wcd { position: absolute; left: 0; right: 0; top: 0; height: 100%; background: rgba(0,0,0,.6); transform-origin: top; transform: scaleY(0); }
.wchip.ult .wcd { top: auto; bottom: 0; transform-origin: bottom; background: rgba(255,176,32,.32); }
.wchip.ult.ready { color: var(--amber); border-color: var(--amber); animation: ultPulse 1s ease-in-out infinite; }
.wchip.ult.ready .wcd { background: rgba(255,176,32,.42); }
@keyframes ultPulse { 0%, 100% { background-color: rgba(10,13,17,.66); } 50% { background-color: rgba(120,80,10,.85); } }
.wchip .wkey { position: absolute; z-index: 1; right: 6px; top: 3px; font: 800 9px/1 var(--f-ui); color: var(--ink-3); display: none; }
.kb .wchip .wkey { display: block; }
#wname { position: absolute; right: calc(var(--gr) + 64px); top: 0; padding: 7px 12px 6px; background: var(--plate); clip-path: var(--notch); font: 900 24px/1 var(--f-display); letter-spacing: .03em; text-transform: uppercase; color: var(--ink); opacity: 0; transform: translateX(10px); transition: opacity .18s, transform .18s; pointer-events: none; white-space: nowrap; }
#wname.show { opacity: 1; transform: none; }
#keysHint { position: absolute; right: var(--gr); bottom: var(--gb); padding: 10px 14px; background: var(--plate); font: 600 12px/1.6 var(--f-ui); color: var(--ink-2); letter-spacing: .02em; clip-path: var(--notch); }
#keysHint b { color: var(--ink); font-weight: 800; }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; background: rgba(6,8,10,.58); padding-left: var(--gl); padding-right: var(--gr); padding-block: var(--gt) var(--gb); overflow-y: auto; }
.card { width: min(520px, 100%); box-sizing: border-box; display: grid; gap: 18px; padding: 26px 26px 24px; background: var(--plate-2); border: 1px solid var(--line); clip-path: var(--notch); }
.card h2 { margin: 0; font: 900 56px/.9 var(--f-display); text-transform: uppercase; letter-spacing: .01em; }
.card h2.alert { color: var(--alert); }
.btns { display: grid; gap: 10px; }
.btn { padding: 15px 18px 14px; font: 900 24px/1 var(--f-display); text-transform: uppercase; letter-spacing: .04em; text-align: left; background: rgba(255,255,255,.06); border: 1px solid var(--line); clip-path: var(--notch); }
.btn:hover, .btn:focus-visible { border-color: var(--amber); }
.btn.primary { background: var(--amber); color: var(--amber-ink); border-color: var(--amber); }
.res-score { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.res-score b { font: 900 64px/.9 var(--f-display); font-variant-numeric: tabular-nums; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 38px; height: 38px; }
.stars path { fill: rgba(255,255,255,.12); }
.stars .on path { fill: var(--amber); }
.newbest { font: 900 20px/1 var(--f-display); letter-spacing: .08em; color: var(--amber); text-transform: uppercase; }
.stats { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
.stats li { display: flex; justify-content: space-between; gap: 8px; padding: 9px 0; border-top: 1px solid var(--line); font: 600 14px/1.2 var(--f-ui); color: var(--ink-2); font-variant-numeric: tabular-nums; min-width: 0; }
.stats li b { color: var(--ink); font-weight: 800; }
.res-next { margin: 0; font: 500 13px/1.45 var(--f-ui); color: var(--ink-3); }

@media (max-width: 720px) {
  .menu-col { width: 100%; padding-right: var(--gr); background: linear-gradient(180deg, rgba(8,10,13,.55) 0%, rgba(8,10,13,.9) 38%, rgba(8,10,13,.94) 100%); justify-content: flex-end; }
  .logo { font-size: 64px; }
  #score { font-size: 38px; }
  #timer { font-size: 32px; }
  #wreckN { font-size: 26px; }
  .armor-bar { width: 150px; }
  #actions { transform: scale(.86); transform-origin: right bottom; }
  #wbar { bottom: calc(var(--gb) + 226px); transform: scale(.86); transform-origin: right bottom; }
  .kb #wbar { bottom: calc(var(--gb) + 74px); }
  .stats { grid-template-columns: 1fr; }
  .card h2 { font-size: 44px; }
}
@media (max-width: 520px) {
  .wide-only { display: none; }
  #hud .tc { left: auto; right: var(--gr); top: calc(var(--gt) + 60px); transform: none; }
  #timer { font-size: 28px; padding: 5px 12px 4px; }
  #joyHint { max-width: 96px; }
}
@media (max-height: 600px) {
  #wbar { flex-direction: row; right: auto; left: 50%; bottom: auto; top: calc(var(--gt) + 54px); transform: translateX(-50%) scale(.8); transform-origin: center top; }
  .kb #wbar { bottom: auto; }
  #wname { display: none; }
}
@media (max-height: 520px) {
  #actions { transform: scale(.8); transform-origin: right bottom; }
  .menu-col { gap: 14px; }
  .logo { font-size: 60px; }
}
@media (prefers-reduced-motion: reduce) { .callout { animation-duration: 2.4s; } * { transition: none !important; } }
</style>

      <p id="ldErr" hidden></p>
    </div>
  </section>

  <section id="menu" hidden>
    <div class="menu-col">
      <div class="hazard"></div>
      <p class="eyebrow">Sector 7 · Demolition day</p>
      <h1 class="logo">Titan<span>Smash</span></h1>
      <div class="modes">

          <span class="mode-top"><span class="mode-k">Rampage</span><span class="mode-s" id="bestRampage">No best yet</span></span>

        <div class="opt"><span class="opt-k">Paint</span><div class="swatches" id="optPaint"></div></div>
        <div class="opt"><span class="opt-k">Graphics</span><div class="seg" id="optGfx"><button data-v="fast">Fast</button><button data-v="high">High</button><button data-v="ultra">Ultra</button></div></div>
        <div class="opt"><span class="opt-k">Sound</span><div class="seg" id="optSound"><button data-v="on">On</button><button data-v="off">Off</button></div></div>

  </section>

  <section id="hud" hidden>
    <div class="tl">
      <span class="score-k">Score</span>

    </div>
    <div id="callouts" aria-live="polite"></div>
    <svg id="crosshair" viewBox="0 0 46 46" fill="none" stroke="#EEF2F5" stroke-width="2"><circle cx="23" cy="23" r="9" stroke-opacity=".8"/><path d="M23 2v9M23 35v9M2 23h9M35 23h9" stroke-linecap="round"/><circle cx="23" cy="23" r="1.6" fill="#5BE6FF" stroke="none"/></svg>
    <div id="touchUI" hidden>
      <span id="joyHint">Drag here to walk</span>
      <div id="joy"><div id="joyKnob"></div></div>
      <div id="actions">

// ---------------- geometry builder for buildings ----------------
class GB {
  constructor() { this.pos = []; this.nor = []; this.col = []; this.wal = []; this.info = []; this.tier = []; }
  v(x, y, z, nx, ny, nz, c, u, bw, info, t0, t1) {
    this.pos.push(x, y, z); this.nor.push(nx, ny, nz); this.col.push(c[0], c[1], c[2]);
    this.wal.push(u, bw); this.info.push(info[0], info[1], info[2], info[3]); this.tier.push(t0, t1);
  }
  // quad a,b,c,d (CCW seen from the front), each vertex [x,y,z,u]
  quad(a, b, c, d, n, col, bw, info, t0, t1) {
    for (const p of [a, b, c, a, c, d]) this.v(p[0], p[1], p[2], n[0], n[1], n[2], col, p[3] || 0, bw, info, t0, t1);
  }
  // wall from A to B (along tangent T = up x N), outward normal n
  wall(ax, az, bx, bz, nx, nz, y0, y1, col, bayT, info, t0, t1) {
    const len = Math.hypot(bx - ax, bz - az);
    const nb = Math.max(1, Math.round(len / bayT)); const bw = len / nb;
    this.quad([ax, y0, az, 0], [bx, y0, bz, nb], [bx, y1, bz, nb], [ax, y1, az, 0], [nx, 0, nz], col, bw, info, t0, t1);
  }
  box(x0, x1, z0, z1, y0, y1, col, bayT, info, t0 = y0, t1 = y1) {
    this.wall(x0, z1, x1, z1, 0, 1, y0, y1, col, bayT, info, t0, t1);
    this.wall(x1, z0, x0, z0, 0, -1, y0, y1, col, bayT, info, t0, t1);
    this.wall(x1, z1, x1, z0, 1, 0, y0, y1, col, bayT, info, t0, t1);
    this.wall(x0, z0, x0, z1, -1, 0, y0, y1, col, bayT, info, t0, t1);
  }
  flat(x0, x1, z0, z1, y, col, info, t0, t1, down = false) {
    if (!down) this.quad([x0, y, z1], [x1, y, z1], [x1, y, z0], [x0, y, z0], [0, 1, 0], col, 3, info, t0, t1);
    else this.quad([x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1], [0, -1, 0], col, 3, info, t0, t1);
  }
  // a solid detail box (walls + top), plain surface
  solid(x0, x1, z0, z1, y0, y1, col, info) {
    this.box(x0, x1, z0, z1, y0, y1, col, 3, info, -100, 1e4);
    this.flat(x0, x1, z0, z1, y1, col, info, -100, 1e4);
  }
  // tapered cylinder walls
  cyl(cx, cz, r0, r1, y0, y1, segs, col, bayT, info, t0 = y0, t1 = y1, cap = true) {
    const circ = TAU * (r0 + r1) * 0.5; const nb = Math.max(3, Math.round(circ / bayT)); const bw = circ / nb;
    const slope = (r0 - r1) / Math.max(0.001, y1 - y0); const ny = slope / Math.sqrt(1 + slope * slope), nh = 1 / Math.sqrt(1 + slope * slope);
    for (let k = 0; k < segs; k++) {
      const a0 = (k / segs) * TAU, a1 = ((k + 1) / segs) * TAU;
      const u0 = ((TAU - a0) / TAU) * nb, u1 = ((TAU - a1) / TAU) * nb;
      const c0 = Math.cos(a0), s0 = Math.sin(a0), c1 = Math.cos(a1), s1 = Math.sin(a1);
      // A at a1 (lower u), B at a0
      const A0 = [cx + c1 * r0, y0, cz + s1 * r0, u1], B0 = [cx + c0 * r0, y0, cz + s0 * r0, u0];
      const B1 = [cx + c0 * r1, y1, cz + s0 * r1, u0], A1 = [cx + c1 * r1, y1, cz + s1 * r1, u1];
      const verts = [A0, B0, B1, A0, B1, A1];
      const norms = [[c1 * nh, ny, s1 * nh], [c0 * nh, ny, s0 * nh], [c0 * nh, ny, s0 * nh], [c1 * nh, ny, s1 * nh], [c0 * nh, ny, s0 * nh], [c1 * nh, ny, s1 * nh]];
      for (let i = 0; i < 6; i++) { const p = verts[i], n = norms[i]; this.v(p[0], p[1], p[2], n[0], n[1], n[2], col, p[3], bw, info, t0, t1); }
    }
    if (cap) this.disc(cx, cz, r1, y1, segs, col, [info[0], info[1], info[2], 1], t0, t1);
  }
  disc(cx, cz, r, y, segs, col, info, t0, t1, down = false) {
    for (let k = 0; k < segs; k++) {
      const a0 = (k / segs) * TAU, a1 = ((k + 1) / segs) * TAU;
      const p0 = [cx, y, cz], p1 = [cx + Math.cos(a0) * r, y, cz + Math.sin(a0) * r], p2 = [cx + Math.cos(a1) * r, y, cz + Math.sin(a1) * r];
      const tri = down ? [p0, p1, p2] : [p0, p2, p1];
      for (const p of tri) this.v(p[0], p[1], p[2], 0, down ? -1 : 1, 0, col, 0, 3, info, t0, t1);
    }
  }
  // import any three.js geometry (non-indexed after conversion) with a transform
  geo(g, matrix, col, info, t0 = -100, t1 = 1e4, uScale = 0.33) {
    const gg = g.index ? g.toNonIndexed() : g;
    const p = gg.attributes.position, n = gg.attributes.normal;
    const nm = new THREE.Matrix3().getNormalMatrix(matrix);
    const pv = new THREE.Vector3(), nv = new THREE.Vector3();
    for (let i = 0; i < p.count; i++) {
      pv.fromBufferAttribute(p, i).applyMatrix4(matrix);
      nv.fromBufferAttribute(n, i).applyMatrix3(nm).normalize();
      this.v(pv.x, pv.y, pv.z, nv.x, nv.y, nv.z, col, (pv.x + pv.z) * uScale, 3, info, t0, t1);
    }
  }
  count() { return this.pos.length / 3; }
  toGeometry() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
    g.setAttribute('aWall', new THREE.Float32BufferAttribute(this.wal, 2));
    g.setAttribute('aInfo', new THREE.Float32BufferAttribute(this.info, 4));
    g.setAttribute('aTier', new THREE.Float32BufferAttribute(this.tier, 2));
    g.computeBoundingSphere(); g.computeBoundingBox();
    return g;
  }
}

// ---------------- building records ----------------
function newBuilding(opts) {
  const b = Object.assign({
    id: B.length, tiers: [], fac: 1, col: [0.6, 0.6, 0.6], glass: false, cut: 9999, holes: [], heat: 0,
    state: 0, hp: 1, maxHp: 1, h: 0, vol: 0, landmark: null, geo: null, tile: 0, hits: 0,
  }, opts);
  B.push(b);
  return b;
}
function finalizeBuilding(b) {
  let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9, h = 0, vol = 0;
  for (const t of b.tiers) { x0 = Math.min(x0, t.x0); x1 = Math.max(x1, t.x1); z0 = Math.min(z0, t.z0); z1 = Math.max(z1, t.z1); h = Math.max(h, t.y1); vol += (t.x1 - t.x0) * (t.z1 - t.z0) * (t.y1 - t.y0) * (t.round ? 0.785 : 1); }
  b.x0 = x0; b.x1 = x1; b.z0 = z0; b.z1 = z1; b.cx = (x0 + x1) / 2; b.cz = (z0 + z1) / 2;
  b.h = Math.max(h, b.h || 0); b.vol = vol; b.vol0 = vol;
  if (!b.landmark) {
    const H = b.h;
    b.maxHp = H < 20 ? 0.8 : H < 40 ? 1.6 : H < 70 ? 2.4 : H < 120 ? 3.4 : 4.4;
  }
  b.hp = b.maxHp;
  b.tile = clamp(Math.floor((b.cx + 700) / 350), 0, 3) + clamp(Math.floor((b.cz + 700) / 350), 0, 3) * 4;
}
// top height of the building at a point (respects cut)
function bTopAt(b, x, z) {
  let top = -1;
  for (const t of b.tiers) if (x >= t.x0 && x <= t.x1 && z >= t.z0 && z <= t.z1) top = Math.max(top, t.y1);
  return Math.min(top, b.cut);
}

function buildingGeometry(b, rng) {
  const gb = new GB();
  const seed = rng();
  const info = (surf) => [b.id, b.fac, seed, surf];
  const col = b.col;
  const bay = b.fac === 0 ? 3.0 : b.fac === 1 ? 3.4 : b.fac === 2 ? 3.2 : 3.0;
  for (let i = 0; i < b.tiers.length; i++) {
    const t = b.tiers[i];
    const fac = t.fac !== undefined ? t.fac : b.fac;
    const tc = t.col || col;
    const inf = [b.id, fac, seed, 0];
    const tbay = fac === 0 ? 3.0 : fac === 1 ? 3.4 : fac === 2 ? 3.2 : 3.0;
    const par = t.noParapet ? 0 : fac === 0 ? 2.4 : 1.3;
    if (t.round) {
      const r = (t.x1 - t.x0) / 2, cx = (t.x0 + t.x1) / 2, cz = (t.z0 + t.z1) / 2;
      gb.cyl(cx, cz, r, r, t.y0, t.y1, 40, tc, tbay, inf, t.y0, t.y1, false);
      gb.disc(cx, cz, r - 0.5, t.y1 - par, 40, tc, [b.id, fac, seed, 1], t.y0, t.y1);
      if (par > 0) gb.cyl(cx, cz, r - 0.5, r - 0.5, t.y1 - par, t.y1, 40, [tc[0] * 0.8, tc[1] * 0.8, tc[2] * 0.8], 3, [b.id, fac, seed, 2], t.y0, t.y1, false);
      gb.disc(cx, cz, r, t.y0, 24, tc, [b.id, fac, seed, 3], t.y0, t.y1);
    } else {
      gb.box(t.x0, t.x1, t.z0, t.z1, t.y0, t.y1, tc, tbay, inf, t.y0, t.y1);
      const ry = t.y1 - par;
      gb.flat(t.x0 + 0.01, t.x1 - 0.01, t.z0 + 0.01, t.z1 - 0.01, ry, tc, [b.id, fac, seed, 1], t.y0, t.y1);
      if (par > 0) {
        const s = 0.5, ic = [tc[0] * 0.75, tc[1] * 0.75, tc[2] * 0.75], ii = [b.id, fac, seed, 2];
        // inner parapet faces (normals point inward)
        gb.wall(t.x1 - s, t.z1 - s, t.x0 + s, t.z1 - s, 0, -1, ry, t.y1, ic, 3, ii, -100, 1e4);
        gb.wall(t.x0 + s, t.z0 + s, t.x1 - s, t.z0 + s, 0, 1, ry, t.y1, ic, 3, ii, -100, 1e4);
        gb.wall(t.x1 - s, t.z0 + s, t.x1 - s, t.z1 - s, -1, 0, ry, t.y1, ic, 3, ii, -100, 1e4);
        gb.wall(t.x0 + s, t.z1 - s, t.x0 + s, t.z0 + s, 1, 0, ry, t.y1, ic, 3, ii, -100, 1e4);
        // coping
        const cc = [0.62, 0.61, 0.6];
        gb.flat(t.x0, t.x1, t.z1 - s, t.z1, t.y1, cc, ii, -100, 1e4);
        gb.flat(t.x0, t.x1, t.z0, t.z0 + s, t.y1, cc, ii, -100, 1e4);
        gb.flat(t.x0, t.x0 + s, t.z0 + s, t.z1 - s, t.y1, cc, ii, -100, 1e4);
        gb.flat(t.x1 - s, t.x1, t.z0 + s, t.z1 - s, t.y1, cc, ii, -100, 1e4);
      }
      // dynamic rubble cap (moved to the cut height in the vertex shader)
      gb.flat(t.x0 + 0.2, t.x1 - 0.2, t.z0 + 0.2, t.z1 - 0.2, t.y0, tc, [b.id, fac, seed, 3], t.y0, t.y1);
    }
  }
  // rooftop details on the top tier
  const top = b.tiers[b.tiers.length - 1];
  if (!b.landmark && !top.round) {
    const rx0 = top.x0 + 3, rx1 = top.x1 - 3, rz0 = top.z0 + 3, rz1 = top.z1 - 3;
    const par = b.fac === 0 ? 2.4 : 1.3;
    const ry = top.y1 - par;
    const dc = [0.42, 0.43, 0.45], di = info(2);
    if (rx1 - rx0 > 6 && rz1 - rz0 > 6) {
      if (b.fac === 0 && top.y1 > 60) {
        // mechanical penthouse + crown
        const px0 = lerp(rx0, rx1, 0.2), px1 = lerp(rx0, rx1, 0.8), pz0 = lerp(rz0, rz1, 0.22), pz1 = lerp(rz0, rz1, 0.78);
        const ph = 5 + rng() * 5;
        gb.solid(px0, px1, pz0, pz1, ry, ry + ph, [0.3, 0.31, 0.33], di);
        b.h = Math.max(b.h, ry + ph);
        const r = rng();
        if (r < 0.35) {
          const ah = 14 + rng() * 22;
          const ax = lerp(px0, px1, 0.5), az = lerp(pz0, pz1, 0.5);
          gb.solid(ax - 0.5, ax + 0.5, az - 0.5, az + 0.5, ry + ph, ry + ph + ah, [0.55, 0.55, 0.58], di);
          b.h = Math.max(b.h, ry + ph + ah);
          b.beacon = [ax, ry + ph + ah + 0.6, az];
        } else if (r < 0.55) {
          const sh = 18 + rng() * 26, sw = Math.min(px1 - px0, pz1 - pz0) * 0.4;
          const g = new THREE.ConeGeometry(sw, sh, 4, 1, true);
          const m = new THREE.Matrix4().makeRotationY(Math.PI / 4).setPosition((px0 + px1) / 2, ry + ph + sh / 2, (pz0 + pz1) / 2);
          gb.geo(g, m, [0.62, 0.64, 0.66], di);
          b.h = Math.max(b.h, ry + ph + sh);
          b.beacon = [(px0 + px1) / 2, ry + ph + sh + 0.5, (pz0 + pz1) / 2];
        } else if (r < 0.75) {
          // helipad
          gb.cyl((rx0 + rx1) / 2, (rz0 + rz1) / 2, 8, 8, ry + ph, ry + ph + 0.6, 20, [0.18, 0.19, 0.2], 3, info(2), -100, 1e4, true);
        }
      } else {
        const n = 1 + Math.floor(rng() * 4);
        for (let i = 0; i < n; i++) {
          const w = 2 + rng() * 3, d = 2 + rng() * 3, hh = 1.5 + rng() * 2;
          const x = lerp(rx0 + w, rx1 - w, rng()), z = lerp(rz0 + d, rz1 - d, rng());
          gb.solid(x - w / 2, x + w / 2, z - d / 2, z + d / 2, ry, ry + hh, dc, di);
        }
        if (rng() < 0.35 && b.fac !== 0) {
          const x = lerp(rx0 + 3, rx1 - 3, rng()), z = lerp(rz0 + 3, rz1 - 3, rng());
          gb.cyl(x, z, 2.2, 2.2, ry + 2, ry + 6, 12, [0.42, 0.3, 0.22], 3, info(2), -100, 1e4, true);
          const cone = new THREE.ConeGeometry(2.3, 1.4, 12);
          gb.geo(cone, new THREE.Matrix4().makeTranslation(x, ry + 6.7, z), [0.32, 0.24, 0.18], info(2));
          gb.solid(x - 2, x + 2, z - 2, z + 2, ry, ry + 2, [0.3, 0.3, 0.3], di);
        }
        if (rng() < 0.4) {
          const x = lerp(rx0 + 3, rx1 - 3, rng()), z = lerp(rz0 + 3, rz1 - 3, rng());
          gb.solid(x - 2.5, x + 2.5, z - 2, z + 2, ry, ry + 3.5, [0.5, 0.49, 0.47], di);
        }
      }
    }
  }
  b.geo = gb.toGeometry();
  return gb;
}

// ---------------- the building material ----------------
const B_VERT_DECL = `
attribute vec2 aWall; attribute vec4 aInfo; attribute vec2 aTier;
uniform highp sampler2D uBState;
uniform vec3 uFallPlane;
varying vec3 vObj; varying vec3 vNObj; varying vec2 vWall; varying vec2 vTier; varying vec3 vCamObj;
flat varying vec4 vInfo; flat varying vec4 vCut; flat varying vec4 vH0; flat varying vec4 vH1; flat varying vec4 vH2; flat varying vec4 vH3; flat varying vec4 vX;
`;
const B_VERT_MAIN = `
vec3 transformed = vec3(position);
vInfo = aInfo; vWall = aWall; vTier = aTier; vNObj = normal;
int bid = int(aInfo.x + 0.5);
int bx = bid - (bid / 256) * 256;
int by = (bid / 256) * 6;
vCut = texelFetch(uBState, ivec2(bx, by), 0);
vH0 = texelFetch(uBState, ivec2(bx, by + 1), 0);
vH1 = texelFetch(uBState, ivec2(bx, by + 2), 0);
vH2 = texelFetch(uBState, ivec2(bx, by + 3), 0);
vH3 = texelFetch(uBState, ivec2(bx, by + 4), 0);
vX = texelFetch(uBState, ivec2(bx, by + 5), 0);
#ifdef FALLING
  if (aInfo.w > 2.5) transformed.y = clamp(uFallPlane.x + uFallPlane.y * transformed.x + uFallPlane.z * transformed.z + 0.8, aTier.x, aTier.y);
#else
  if (vX.y < -0.5) transformed = vec3(0.0, -2000.0, 0.0);
  else if (aInfo.w > 2.5) {
    if (vX.y >= aTier.y - 0.3 || vX.y < aTier.x) transformed = vec3(0.0, -2000.0, 0.0);
    else { float cy = vCut.x + vCut.z * transformed.x + vCut.w * transformed.z; transformed.y = clamp(cy - 1.0, aTier.x + 0.05, aTier.y - 0.05); }
  }
#endif
vObj = transformed;
vCamObj = (inverse(modelMatrix) * vec4(cameraPosition, 1.0)).xyz;
`;
const B_FRAG_DECL = `
uniform vec3 uFallPlane; uniform float uNight; uniform float uLitFrac;
uniform vec3 uXrayA; uniform vec3 uXrayB; uniform float uXrayR;
varying vec3 vObj; varying vec3 vNObj; varying vec2 vWall; varying vec2 vTier; varying vec3 vCamObj;
flat varying vec4 vInfo; flat varying vec4 vCut; flat varying vec4 vH0; flat varying vec4 vH1; flat varying vec4 vH2; flat varying vec4 vH3; flat varying vec4 vX;
float bHash(vec3 p){ p = fract(p * 0.3183099 + vec3(0.1, 0.2, 0.3)); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float bNoise(vec3 x){ vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(bHash(i), bHash(i + vec3(1.0, 0.0, 0.0)), f.x), mix(bHash(i + vec3(0.0, 1.0, 0.0)), bHash(i + vec3(1.0, 1.0, 0.0)), f.x), f.y),
             mix(mix(bHash(i + vec3(0.0, 0.0, 1.0)), bHash(i + vec3(1.0, 0.0, 1.0)), f.x), mix(bHash(i + vec3(0.0, 1.0, 1.0)), bHash(i + vec3(1.0, 1.0, 1.0)), f.x), f.y), f.z); }
float bJag(vec3 p, float s){ return (bNoise(vec3(p.xz * 0.2, s * 13.0)) - 0.5) * 6.5 + (bNoise(vec3(p.xz * 0.85, s * 7.0 + 3.0)) - 0.5) * 2.2; }
float bayer4(vec2 p){ ivec2 q = ivec2(mod(p, 4.0)); int i = q.x + q.y * 4;
  float m[16] = float[16](0.0, 8.0, 2.0, 10.0, 12.0, 4.0, 14.0, 6.0, 3.0, 11.0, 1.0, 9.0, 15.0, 7.0, 13.0, 5.0);
  return (m[i] + 0.5) / 16.0; }
float bDiscard(){
  float edge = 1e4;
  #ifdef FALLING
    bool hasCut = true;
    float cutY = uFallPlane.x + uFallPlane.y * vObj.x + uFallPlane.z * vObj.z;
  #else
    bool hasCut = vCut.x < 9000.0;
    float cutY = vCut.x + vCut.z * vObj.x + vCut.w * vObj.z;
  #endif
  if (vInfo.w < 2.5 && hasCut) {
    float j = bJag(vObj, vInfo.z) * vX.x;
    #ifdef FALLING
      if (vObj.y < cutY + j) discard;
    #else
      if (vObj.y > cutY + j) discard;
    #endif
    edge = abs(vObj.y - cutY - j);
  }
  vec4 hh[4]; hh[0] = vH0; hh[1] = vH1; hh[2] = vH2; hh[3] = vH3;
  for (int k = 0; k < 4; k++) {
    vec4 h = hh[k];
    if (h.w > 0.0) {
      float n = bNoise(vObj * 0.3 + float(k) * 7.31) * 0.72 + bNoise(vObj * 1.3 + float(k) * 3.7) * 0.28;
      float d = length(vObj - h.xyz) - h.w * (0.68 + 0.6 * n);
      if (d < 0.0) discard;
      edge = min(edge, d);
    }
  }

      const z0 = zRoads[j].c + zRoads[j].w / 2, z1 = zRoads[j + 1].c - zRoads[j + 1].w / 2;
      BLOCKS.push({ x0, x1, z0, z1, cx: (x0 + x1) / 2, cz: (z0 + z1) / 2 });
    }
  }
  for (const blk of BLOCKS) {
    const s = 5;
    const ux0 = blk.x0 + s, ux1 = blk.x1 - s, uz0 = blk.z0 + s, uz1 = blk.z1 - s;
    const dd = Math.hypot(blk.cx - DOWNTOWN.x, (blk.cz - DOWNTOWN.z) * 1.1);

      blk.kind = 'down';

      if (r < 0.42) {
        const w = Math.min(ux1 - ux0, R(32, 46)), d = Math.min(uz1 - uz0, R(32, 46));
        const cx = blk.cx + R(-4, 4), cz = blk.cz + R(-4, 4);
        const H = R(120, 195) * hScale;
        const fac = rng() < 0.72 ? 0 : 1;
        const b = newBuilding({ fac, col: fac === 0 ? P(PAL.glass) : P(PAL.concrete), glass: fac === 0 });
        let base = 0;
        if (rng() < 0.45) { const ph = R(9, 15); b.tiers.push(makeTier(ux0, ux1, uz0, uz1, 0, ph, { fac: 1, col: P(PAL.concrete) })); base = ph; }
        if (rng() < 0.12 && !base) {

          b.tiers.push(makeTier(cx - w / 2, cx + w / 2, cz - d / 2, cz + d / 2, base, h1));
          const i1 = R(3, 6);
          b.tiers.push(makeTier(cx - w / 2 + i1, cx + w / 2 - i1, cz - d / 2 + i1, cz + d / 2 - i1, h1, h2));
          const i2 = i1 + R(3, 6);
          b.tiers.push(makeTier(cx - w / 2 + i2, cx + w / 2 - i2, cz - d / 2 + i2, cz + d / 2 - i2, h2, H));
        } else {
          b.tiers.push(makeTier(cx - w / 2, cx + w / 2, cz - d / 2, cz + d / 2, base, H));
        }
      } else if (r < 0.78) {
        const alongX = rng() < 0.5;
        for (let k = 0; k < 2; k++) {
          const fac = rng() < 0.65 ? 0 : 1;
          const b = newBuilding({ fac, col: fac === 0 ? P(PAL.glass) : P(PAL.concrete), glass: fac === 0 });
          const H = R(85, 160) * hScale;
          if (alongX) {
            const xm = (ux0 + ux1) / 2, xa = k === 0 ? ux0 : xm + 3, xb = k === 0 ? xm - 3 : ux1;

        else { lots.push([ux0, (ux0 + ux1) / 2 - 2, uz0, uz1]); lots.push([(ux0 + ux1) / 2 + 2, ux1, uz0, (uz0 + uz1) / 2 - 2]); lots.push([(ux0 + ux1) / 2 + 2, ux1, (uz0 + uz1) / 2 + 2, uz1]); }
      } else {
        for (let a = 0; a < 2; a++) for (let c = 0; c < 2; c++) {
          lots.push([lerp(ux0, ux1, a / 2) + (a ? 2 : 0), lerp(ux0, ux1, (a + 1) / 2) - (a ? 0 : 2), lerp(uz0, uz1, c / 2) + (c ? 2 : 0), lerp(uz0, uz1, (c + 1) / 2) - (c ? 0 : 2)]);

      for (const L of lots) {

        } else b.tiers.push(makeTier(x0, x1, z0, z1, 0, H));
      }
    } else {
      blk.kind = 'out';
      for (let a = 0; a < 3; a++) for (let c = 0; c < 3; c++) {
        const lx0 = lerp(ux0, ux1, a / 3) + (a ? 1.5 : 0), lx1 = lerp(ux0, ux1, (a + 1) / 3) - (a < 2 ? 1.5 : 0);

        if (rng() < 0.16) { LOTS_EMPTY.push({ x0: lx0, x1: lx1, z0: lz0, z1: lz1, kind: rng() < 0.6 ? 'yard' : 'parking' }); continue; }
        const r = rng();
        const fac = r < 0.6 ? 2 : r < 0.88 ? 1 : 3;
        const b = newBuilding({ fac, col: fac === 2 ? P(PAL.resi) : fac === 1 ? P(PAL.concrete) : P(PAL.ware) });
        const H = fac === 3 ? R(8, 13) : R(9, 27);
        b.tiers.push(makeTier(lx0 + R(0.5, 3), lx1 - R(0.5, 3), lz0 + R(0.5, 3), lz1 - R(0.5, 3), 0, H));
      }
    }
  }
  // waterfront: warehouses on the dock strip
  for (let i = 0; i < xRoads.length - 1; i++) {
    const x0 = xRoads[i].c + xRoads[i].w / 2 + 4, x1 = xRoads[i + 1].c - xRoads[i + 1].w / 2 - 4;
    const cx = (x0 + x1) / 2;
    if (cx > -420 && cx < -280) continue; // ferris wheel plaza
    if (cx > 120 && cx < 340) continue;    // container yard + cranes
    if (rng() < 0.75) {
      const b = newBuilding({ fac: 3, col: P(PAL.ware) });
      b.tiers.push(makeTier(x0 + R(0, 6), x1 - R(0, 6), 418, 418 + R(22, 34), 0, R(10, 16)));
    }
  }
}

// ---------------- materials & meshes ----------------
let bMat = null, bDepth = null;
function buildCityMeshes() {
  const rng = mulberry32(777);
  bMat = makeBuildingMaterial(null);
  bDepth = makeBuildingDepth(null);
  const tileGB = Array.from({ length: 16 }, () => ({ parts: [] }));
  for (const b of B) {
    finalizeBuilding(b);
    if (b.build) {
      const gb = new GB(); b.build(gb, rng()); b.geo = gb.toGeometry();
      // dynamic caps for each landmark tier
      const seed = rng();
      if (b.landmark === 'needle') {
        const capGB = new GB();
        for (const t of b.tiers) {
          if (t.round) capGB.disc((t.x0 + t.x1) / 2, (t.z0 + t.z1) / 2, (t.x1 - t.x0) / 2 - 0.6, t.y0, 28, [0.5, 0.5, 0.5], [b.id, 3, seed, 3], t.y0, t.y1);
          else capGB.flat(t.x0 + 0.5, t.x1 - 0.5, t.z0 + 0.5, t.z1 - 0.5, t.y0, [0.5, 0.5, 0.5], [b.id, 3, seed, 3], t.y0, t.y1);
        }
        b.geo = mergeBufferGeos([b.geo, capGB.toGeometry()]);
      }
    } else {
      buildingGeometry(b, rng);
    }
    tileGB[b.tile].parts.push(b.geo);
  }
  for (let i = 0; i < 16; i++) {
    if (!tileGB[i].parts.length) continue;
    const g = mergeBufferGeos(tileGB[i].parts);
    const mesh = new THREE.Mesh(g, bMat);
    mesh.customDepthMaterial = bDepth;
    mesh.castShadow = true; mesh.receiveShadow = true;
    mesh.matrixAutoUpdate = false; mesh.updateMatrix();
    scene.add(mesh); TILES.push(mesh);
  }
}
function mergeBufferGeos(list) {
  const names = Object.keys(list[0].attributes);
  let total = 0; for (const g of list) total += g.attributes.position.count;
  const out = new THREE.BufferGeometry();
  for (const n of names) {
    const size = list[0].attributes[n].itemSize;
    const arr = new Float32Array(total * size);
    let o = 0;
    for (const g of list) { arr.set(g.attributes[n].array, o); o += g.attributes[n].array.length; }
    out.setAttribute(n, new THREE.BufferAttribute(arr, size));
  }
  out.computeBoundingSphere(); out.computeBoundingBox();
  return out;
}

// ---------------- ground map ----------------
let mapCanvas = null, mapTex = null;
function w2m(v) { return ((v - MAP.min) / MAP.size) * MAP.res; }
function paintMap(rng) {
  const c = document.createElement('canvas'); c.width = c.height = MAP.res;
  const g = c.getContext('2d');
  const S = MAP.res / MAP.size;
  const rect = (x0, z0, x1, z1, col) => { g.fillStyle = col; g.fillRect(w2m(x0), w2m(z0), (x1 - x0) * S, (z1 - z0) * S); };
  // outskirts
  g.fillStyle = '#56603f'; g.fillRect(0, 0, MAP.res, MAP.res);
  for (let i = 0; i < 9000; i++) {
    const x = rng() * MAP.res, y = rng() * MAP.res, r = 2 + rng() * 9;
    g.fillStyle = rng() < 0.5 ? 'rgba(70,86,48,0.35)' : 'rgba(110,100,70,0.25)';
    g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }
  // city sidewalk base
  rect(CITY.minX, CITY.minZ, CITY.maxX, CITY.shore, '#8b8881');
  // blocks
  for (const blk of BLOCKS) {
    const ix0 = blk.x0 + 5, ix1 = blk.x1 - 5, iz0 = blk.z0 + 5, iz1 = blk.z1 - 5;
    if (blk.kind === 'park') {
      rect(blk.x0 + 3, blk.z0 + 3, blk.x1 - 3, blk.z1 - 3, '#4b7834');
      for (let i = 0; i < 600; i++) { g.fillStyle = rng() < 0.5 ? 'rgba(40,90,30,0.35)' : 'rgba(120,140,60,0.25)'; g.beginPath(); g.arc(w2m(lerp(blk.x0, blk.x1, rng())), w2m(lerp(blk.z0, blk.z1, rng())), 2 + rng() * 6, 0, TAU); g.fill(); }
      g.strokeStyle = '#b9ab8b'; g.lineWidth = 3.2 * S; g.beginPath();
      g.moveTo(w2m(blk.x0 + 3), w2m(blk.cz)); g.quadraticCurveTo(w2m(blk.cx + 10), w2m(blk.cz - 25), w2m(blk.x1 - 3), w2m(blk.cz + 6)); g.stroke();
      g.beginPath(); g.moveTo(w2m(blk.cx), w2m(blk.z0 + 3)); g.quadraticCurveTo(w2m(blk.cx - 18), w2m(blk.cz), w2m(blk.cx + 4), w2m(blk.z1 - 3)); g.stroke();
      if (blk.cx === -250 && blk.cz === 150) { g.fillStyle = '#2f5e6e'; g.beginPath(); g.ellipse(w2m(blk.cx), w2m(blk.cz), 22 * S, 15 * S, 0.3, 0, TAU); g.fill(); g.strokeStyle = '#a99d82'; g.lineWidth = 1.6 * S; g.stroke(); }
    } else if (blk.kind === 'needle') {
      rect(ix0, iz0, ix1, iz1, '#a7a299');
      g.fillStyle = '#4e7c36'; g.beginPath(); g.arc(w2m(blk.cx), w2m(blk.cz), 34 * S, 0, TAU); g.fill();
      g.fillStyle = '#b3aea4'; g.beginPath(); g.arc(w2m(blk.cx), w2m(blk.cz), 24 * S, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(80,76,70,0.5)'; g.lineWidth = 0.4 * S;
      for (let r = 4; r < 24; r += 4) { g.beginPath(); g.arc(w2m(blk.cx), w2m(blk.cz), r * S, 0, TAU); g.stroke(); }
    } else {
      rect(ix0, iz0, ix1, iz1, blk.kind === 'down' ? '#9a958c' : '#85827a');
      g.strokeStyle = 'rgba(60,58,54,0.18)'; g.lineWidth = 0.25 * S;
      for (let x = ix0; x < ix1; x += 3) { g.beginPath(); g.moveTo(w2m(x), w2m(iz0)); g.lineTo(w2m(x), w2m(iz1)); g.stroke(); }
    }
  }
  for (const L of LOTS_EMPTY) {
    if (L.kind === 'parking') {
      rect(L.x0, L.z0, L.x1, L.z1, '#3c3e42');
      g.strokeStyle = 'rgba(235,235,230,0.75)'; g.lineWidth = 0.15 * S;
      for (let x = L.x0 + 1; x < L.x1 - 1; x += 2.7) { g.beginPath(); g.moveTo(w2m(x), w2m(L.z0 + 1)); g.lineTo(w2m(x), w2m(L.z0 + 6)); g.stroke(); g.beginPath(); g.moveTo(w2m(x), w2m(L.z1 - 6)); g.lineTo(w2m(x), w2m(L.z1 - 1)); g.stroke(); }
    } else if (L.kind === 'yard') {
      rect(L.x0, L.z0, L.x1, L.z1, '#5a7a3c');
    } else {
      rect(L.x0, L.z0, L.x1, L.z1, '#aaa59b');

function makePuffTexture() {
  const S = 256, H = 128;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d'); const img = g.createImageData(S, S); const d = img.data;
  const rng = mulberry32(42);
  const perm = []; for (let i = 0; i < 512; i++) perm.push(rng());
  const hsh = (x, y) => perm[(((x * 73856093) ^ (y * 19349663)) >>> 0) % 512];
  const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi; const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    return lerp(lerp(hsh(xi, yi), hsh(xi + 1, yi), u), lerp(hsh(xi, yi + 1), hsh(xi + 1, yi + 1), u), v); };
  for (let cell = 0; cell < 4; cell++) {
    const ox = (cell % 2) * H, oy = Math.floor(cell / 2) * H, off = cell * 17.3;
    for (let y = 0; y < H; y++) for (let x = 0; x < H; x++) {
      const nx = (x / H) * 2 - 1, ny = (y / H) * 2 - 1;
      let f = 0, a = 0.5, fr = 3;
      for (let o = 0; o < 5; o++) { f += a * vn(nx * fr + off, ny * fr + off * 1.7); fr *= 2.1; a *= 0.5; }
      const r = Math.sqrt(nx * nx + ny * ny);
      const fall = clamp(1 - r, 0, 1);
      const alpha = clamp((fall * 1.35 - 0.12) * (0.55 + f * 0.9), 0, 1);
      const i = ((oy + y) * S + ox + x) * 4;
      d[i] = Math.floor(clamp(f * 1.3, 0, 1) * 255); d[i + 1] = d[i]; d[i + 2] = d[i];
      d[i + 3] = Math.floor(Math.pow(alpha, 1.2) * 255);
    }
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.NoColorSpace;
  return t;
}

const Weapons = {
  cur: 0, cd: WEAPONS.map(() => 0), ult: 0, ultShown: false, inited: false,
  init() {
    RocketFist.init(); Missiles.init(); Sword.init(); Bolts.init(); BlackHole.init(); Orbital.init();
    this.cur = clamp(store.get('weapon', 0) | 0, 0, WEAPONS.length - 1);
    Sword.setDrawn(WEAPONS[this.cur].id === 'sword', true);
    this.inited = true;
  },
  resetRun() { this.cd.fill(0); this.ult = 0; this.ultShown = false; this.reset(); },
  reset() {
    if (!this.inited) return;
    RocketFist.recall(true); Missiles.clear(); Bolts.clear(); Storm.clear(); BlackHole.clear(); Orbital.clear();
    Sword.setDrawn(WEAPONS[this.cur].id === 'sword', true); Sword.queued = false;
    Post.fx.dark = 0; Post.fx.bh.w = 0;
    SFX.silenceLoops();
  },
  select(i) {
    if (i < 0 || i >= WEAPONS.length || i === this.cur) return;
    if (Titan.beamOn) { Titan.beamOn = false; SFX.beamOff(); }
    this.cur = i;
    Sword.setDrawn(WEAPONS[i].id === 'sword');
    store.set('weapon', i);
    SFX.select(i);
    Game.onWeaponChanged(i);
  },
  charge(x) {
    if (this.ult >= 1 || Orbital.state !== 'idle' || Game.state !== 'play') return;
    this.ult = Math.min(1, this.ult + x);
    if (this.ult >= 1 && !this.ultShown) { this.ultShown = true; Game.callout('Orbital strike ready', 0, true); SFX.ultReady(); }
  },
  ready(i) {
    const w = WEAPONS[i];
    if (w.ult) return this.ult >= 1 && Orbital.state === 'idle';
    if (w.id === 'rocket' && RocketFist.active) return false;
    if (w.id === 'hole' && BlackHole.state !== 'idle') return false;
    if (w.id === 'storm' && Storm.active) return false;
    return this.cd[i] <= 0;
  },
  readiness(i) {
    const w = WEAPONS[i];
    if (w.id === 'beam') return Titan.energy / 100;
    if (w.ult) return Orbital.state !== 'idle' ? 0 : this.ult;
    if (!this.ready(i) && this.cd[i] <= 0) return 0;
    return w.cd ? 1 - this.cd[i] / w.cd : 1;
  },
  control(dt, inp) {
    if (inp.select >= 0) this.select(inp.select);
    if (inp.next) this.select((this.cur + 1) % WEAPONS.length);
    const w = WEAPONS[this.cur];
    Titan.updateBeam(dt, w.id === 'beam' && inp.fireHeld && !Titan.act);
    if (inp.fire && w.id !== 'beam') this.fire(this.cur);
  },
  fire(i) {
    const w = WEAPONS[i];
    if (!Titan.alive || Game.state !== 'play') return;
    if (w.id === 'sword') { Sword.fire(); return; }
    if (!this.ready(i)) { SFX.deny(); Game.denyFire(); return; }
    if (Titan.act) return;
    let ok = false;
    if (w.id === 'rocket') ok = RocketFist.fire();
    else if (w.id === 'missiles') ok = Missiles.fire();
    else if (w.id === 'storm') ok = Storm.fire();
    else if (w.id === 'hole') ok = BlackHole.fire();
    else if (w.id === 'orbital') ok = Orbital.fire();
    if (ok) { if (w.ult) { this.ult = 0; this.ultShown = false; } else this.cd[i] = w.cd; }
  },
  update(dt) {
    for (let i = 0; i < this.cd.length; i++) if (this.cd[i] > 0) this.cd[i] = Math.max(0, this.cd[i] - dt);
    RocketFist.update(dt); Missiles.update(dt); Sword.update(dt); Storm.update(dt); Bolts.update(dt); BlackHole.update(dt); Orbital.update(dt);
  },
  updateAct(a, dt) {
    const T = Titan;
    switch (a.type) {
      case 'rocket':
        if (!a.fired && a.t >= 0.24) { a.fired = true; RocketFist.launch(); }
        if (a.t >= a.dur) T.act = null;
        break;
      case 'slash': Sword.updateAct(a); break;
      case 'throw':
        if (!a.released && a.t >= 0.42) { a.released = true; BlackHole.release(); }
        if (a.t >= a.dur) T.act = null;
        break;
      default:
        if (a.t >= a.dur) T.act = null;
    }
  },
  pose(a, A, P) {
    const t = a.t;
    switch (a.type) {
      case 'rocket': {
        const pitch = RocketFist.aimPitch || 0;
        if (t < 0.22) { const u = easeOut(t / 0.22); A.rS = lerp3(P.rS, [0.55, 0.05, -0.42], u); A.rE = lerp(P.rE, -1.95, u); A.chestY = lerp(0, -0.38, u); }

      case 'missiles': {

        A.spineX = -0.06 + rec; A.chestX = -0.14 * u + rec; A.headX = -0.2 * u;
        return t < 0.9 ? 1 : 1 - smoothstep(0.9, a.dur, t);
      }
      case 'slash': return Sword.pose(a, A, P);
      case 'storm': {
        const u = easeOut(clamp(t / 0.35, 0, 1)), sh = Math.sin(t * 31) * 0.03;
        A.lS = [lerp(P.lS[0], -2.95, u), 0, lerp(P.lS[2], 0.42, u)]; A.rS = [lerp(P.rS[0], -2.95, u), 0, lerp(P.rS[2], -0.42, u)];

      }
      case 'throw': {
        if (t < 0.36) { const u = easeOut(t / 0.36); A.rS = lerp3(P.rS, [0.65, 0.25, -0.5], u); A.rE = lerp(P.rE, -1.7, u); A.chestY = lerp(0, -0.5, u); A.spineX = lerp(0.03, -0.08, u); }
        else { const u = easeOut(clamp((t - 0.36) / 0.14, 0, 1)); A.rS = lerp3([0.65, 0.25, -0.5], [-2.25, -0.12, -0.15], u); A.rE = lerp(-1.7, -0.2, u); A.chestY = lerp(-0.5, 0.45, u); A.spineX = lerp(-0.08, 0.25, u); }

      }
      case 'orbital': {
        const c = Orbital.target, T = Titan;
        const dx = c.x - T.pos.x, dz = c.z - T.pos.z, pitch = Math.atan2(c.y - (T.root.position.y + 50), Math.max(Math.hypot(dx, dz), 1));

        A.rS = lerp3(P.rS, [-Math.PI / 2 - pitch, 0.05, -0.08], u); A.rE = lerp(P.rE, -0.03, u);
        A.lS = [0.1, 0, 0.3]; A.lE = -0.9; A.chestY = 0.25 * u; A.headX = clamp(-pitch * 0.5, -0.4, 0.4);

    }

  },
  overlay(P, a) {
    if (!Titan.alive) return;
    if (RocketFist.active) { const pitch = RocketFist.aimPitch || 0; P.rS = [-Math.PI / 2 - pitch, 0.05, -0.06]; P.rE = -0.03; return; }

  afterPose(dt) { Sword.afterPose(dt); },
  render(raw) { Bolts.render(); BlackHole.render(); },

// ---------------- props reset ----------------
let PROP_SAVE = null;
function saveProps() {
  PROP_SAVE = [];

  PROP_SAVE.states = [PROPS.treeState, PROPS.carState, PROPS.boxState, PROPS.poleState].map((s) => ({ s, x: s.x.slice(), z: s.z.slice() }));
}
function resetProps() {
  if (!PROP_SAVE) return;
  for (const p of PROP_SAVE) { p.m.instanceMatrix.array.set(p.mat); p.m.instanceMatrix.needsUpdate = true; if (p.col) { p.m.instanceColor.array.set(p.col); p.m.instanceColor.needsUpdate = true; } }
  for (const p of PROP_SAVE.states) { p.s.x.set(p.x); p.s.z.set(p.z); p.s.alive.fill(1); }
}

// =====================================================================
//  MENU & OVERLAY WIRING
// =====================================================================
function initUI() {

    const box = $(id);

  };
  seg('optTime', settings.time, (v) => { settings.time = v; store.set('time', v); applyTOD(v); });

    b.setAttribute('aria-label', p.name + ' paint'); b.setAttribute('aria-pressed', String(i === settings.paint)); b.title = p.name;

  $('touchUI').hidden = !IS_TOUCH; $('keysHint').hidden = IS_TOUCH;
  $('hud').classList.toggle('kb', !IS_TOUCH);

    b.innerHTML = '<i class="wcd"></i><svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[w.id] + '</svg><span class="wkey">' + (i + 1) + '</span>';
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); e.stopPropagation(); SFX.resume(); if (Game.state === 'play' || Game.state === 'intro') Weapons.select(i); });
    b.addEventListener('contextmenu', (e) => e.preventDefault());

  });

  $('armorBar').innerHTML = '<i></i>'.repeat(12);
  $('btnRampage').addEventListener('click', () => Game.start('rampage'));
  $('btnFree').addEventListener('click', () => Game.start('free'));
  $('btnPause').addEventListener('click', () => Game.pause());
  $('btnResume').addEventListener('click', () => Game.resume());
  $('btnRestart').addEventListener('click', () => Game.start(Game.mode));
  $('btnRebuild').addEventListener('click', () => { Game.resetCity(); Game.resume(); });
  $('btnQuit').addEventListener('click', () => Game.toMenu());
  $('btnAgain').addEventListener('click', () => Game.start('rampage'));
  $('btnMenu').addEventListener('click', () => Game.toMenu());
  document.addEventListener('visibilitychange', () => { if (document.hidden && Game.state === 'play') Game.pause(); });
  Game.updateBestLabel();
}

// =====================================================================
//  BOOT
// =====================================================================

}

    prog('Pouring concrete', 15); await nextFrame();

    prog('Lighting the sky', 45); await nextFrame();

    configureShadow();
    Post.init();
    prog('Loading debris', 55); await nextFrame();
    Fx.init(); Debris.init(); Rubble.init(); Rings.init(); FxLights.init(); FireGlow.init(); Destruction.init();
    prog('Assembling the Titan', 65); await nextFrame();
