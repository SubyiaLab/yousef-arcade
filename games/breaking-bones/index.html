<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Breaking Bones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: full-screen 3D canvas. HUD chips top-left, tool buttons right edge, joystick bottom-left, jump bottom-right, item/gear trays slide above. Single bright game look on purpose. */
:root{
  --ink:#16202b;
  --panel:#fdfdfb;
  --muted:#56626f;
  --accent:#ff3b30;
  --gold:#ffcc1f;
  --mint:#2fd27a;
  --bruise:#8a5cf6;
  --lava:#ff7a1a;
  --sky:#8fd3ff;
  --display:"Lilita One","Arial Black",Impact,system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:relative;height:100%;width:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.chip{background:var(--panel);border:3px solid var(--ink);border-radius:10px;padding:2px 9px;font-family:var(--display);font-size:15px;letter-spacing:.02em;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
.hud-top{position:absolute;top:10px;left:16px;right:96px;display:flex;flex-wrap:wrap;gap:7px;pointer-events:none}
.brain[data-l="1"],.brain[data-l="2"]{background:var(--gold)}
.brain[data-l="3"]{background:#b9c3ff}
.brain[data-l="4"]{background:var(--bruise);color:#fff}
.brain[data-l="5"]{background:var(--accent);color:#fff;animation:shake .3s infinite}
@keyframes shake{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.goal{position:absolute;top:84px;left:16px;right:96px;font-weight:900;font-size:12px;line-height:1.35;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 1px #000;pointer-events:none}
.tools{position:absolute;top:10px;right:16px;display:grid;gap:8px}
.tool{width:72px;height:40px;border:3px solid var(--ink);border-radius:10px;background:var(--panel);box-shadow:0 4px 0 var(--ink);font-family:var(--display);font-size:15px}
.tool[aria-pressed="true"]{background:var(--gold)}
.tool:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
#pops{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;transform:translate(-50%,-50%);font-family:var(--display);font-size:20px;color:#fff;-webkit-text-stroke:1.5px var(--ink);text-shadow:0 3px 0 var(--ink);white-space:nowrap;animation:rise 1.1s ease-out forwards}
.pop.hot{color:var(--lava)}
.pop.head{color:var(--gold)}
.pop.npc{color:var(--mint)}
.pop.boom{color:var(--lava);font-size:30px}
.pop.talk{font-family:var(--body);font-weight:900;font-size:13px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:3px 8px;animation:talk 2.2s ease-out forwards}
.pop.big{left:50%;top:30%;font-size:clamp(28px,8vw,54px);color:var(--gold);animation:slam 1.6s ease-out forwards;text-align:center;white-space:normal;width:90%}
.pop.big.ultra{color:var(--accent)}
.pop.toast{left:50%;top:22%;font-family:var(--body);font-weight:900;font-size:15px;color:var(--ink);-webkit-text-stroke:0;text-shadow:none;background:var(--gold);border:3px solid var(--ink);border-radius:10px;padding:6px 12px;animation:talk 2.4s ease-out forwards;white-space:normal;max-width:80%;text-align:center}
@keyframes rise{0%{opacity:0;margin-top:0;scale:.6}15%{opacity:1;scale:1.15}100%{opacity:0;margin-top:-60px;scale:1}}
@keyframes talk{0%{opacity:0;scale:.7}10%{opacity:1;scale:1}85%{opacity:1}100%{opacity:0;margin-top:-20px}}
@keyframes slam{0%{opacity:0;scale:2.2}12%{opacity:1;scale:1}80%{opacity:1}100%{opacity:0;scale:1.05}}
.tray{position:absolute;left:16px;right:16px;bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);padding:8px;display:grid;gap:6px}
.tray-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--display);font-size:15px}
.tray-head button{border:2px solid var(--ink);border-radius:8px;background:#ffe1df;font-family:var(--display);font-size:13px;padding:3px 8px}
.tray-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;touch-action:pan-x}
.tray-row::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;min-width:86px;background:#f1f4f7;border:3px solid var(--ink);border-radius:10px;box-shadow:0 3px 0 var(--ink);padding:6px 8px;text-align:left;display:grid;gap:2px}
.slot b{font-family:var(--display);font-weight:400;font-size:14px;display:flex;align-items:center;gap:6px}
.slot b i{width:11px;height:11px;border:2px solid var(--ink);border-radius:2px;display:inline-block}
.slot small{font-size:11px;font-weight:800;color:var(--muted)}
.slot[aria-pressed="true"]{background:var(--gold)}
.slot:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.stick{position:absolute;left:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.28);border:3px solid rgba(22,32,43,.55);touch-action:none}
.knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--panel);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);pointer-events:none}
.jump{--p:0;position:absolute;right:16px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);
  background:radial-gradient(circle,var(--accent) 0 61%,transparent 62%),conic-gradient(var(--gold) calc(var(--p)*360deg),rgba(255,255,255,.75) 0);color:#fff;font-family:var(--display);font-size:22px;line-height:1;padding:0 10px}
.jump:active{transform:translateY(3px);box-shadow:0 3px 0 var(--ink)}
.jump small{display:block;font-size:11px;font-family:var(--body);font-weight:900;opacity:.9;margin-top:3px}
.screen{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:rgba(22,32,43,.3);overflow-y:auto;touch-action:pan-y}
.panel{width:min(100%,460px);background:var(--panel);border:4px solid var(--ink);border-radius:16px;box-shadow:0 8px 0 var(--ink);padding:18px;display:grid;gap:14px;max-height:100%;overflow-y:auto}
.res-head{font-family:var(--display);font-size:32px;margin:0;line-height:1}
.res-head.win{color:#13a85a}.res-head.lose{color:var(--accent)}
.stats{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-weight:800;font-variant-numeric:tabular-nums}
.stats span:nth-child(even){text-align:right;font-family:var(--display);font-size:18px}
.bones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.bone{font-size:11px;font-weight:900;border:2px solid var(--ink);border-radius:6px;padding:3px 5px;background:#eef0f3;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.bone.x{background:var(--bruise);color:#fff}
.banner{font-family:var(--display);font-size:20px;text-align:center;background:var(--accent);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:6px}
.note{font-weight:800;font-size:14px;background:#fff6cf;border:2px dashed var(--ink);border-radius:8px;padding:6px 10px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 120px;height:52px;border:3px solid var(--ink);border-radius:12px;box-shadow:0 5px 0 var(--ink);background:var(--panel);font-family:var(--display);font-size:18px}
.btn.go{background:var(--mint)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.pop,.pop.big,.pop.talk,.pop.toast,.brain[data-l="5"]{animation-duration:.01s}}
</style>

<div id="app">

  <div class="hud-top">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const V3=THREE.Vector3;
const MAP2_DATE=new Date(2026,9,18); // October 18, 2026 local time
const MAPS={
  1:{id:1,name:'Blocky Peaks',skyTop:0x2f7fd6,skyBot:0xcfeeff,rock:0x8d939c,grass:0x4caf3c,ground:0x5aa64a,lava:false,step:3},
  2:{id:2,name:'Lava Peaks',skyTop:0x1a0605,skyBot:0x8a2a10,rock:0x3d2c2a,grass:0x6a3a28,ground:0xff6a1a,lava:true,step:4.5}
};
const BONES=['Skull','Neck','Upper Spine','Ribs','Lower Spine','Pelvis','L Arm','L Forearm','L Hand','R Arm','R Forearm','R Hand','L Femur','L Shin','L Foot','R Femur','R Shin','R Foot'];

  {id:'boulder',name:'Boulder',desc:'Rolls & smashes',color:'#7d7368'},
  {id:'car',name:'Car',desc:'Crash into it',color:'#ff3b30'},
  {id:'barrel',name:'Barrel',desc:'Rolls around',color:'#3f8f4a'}
];
const BRAIN=[[0,'FINE'],[15,'DIZZY'],[40,'CONCUSSION'],[75,'COMA'],[120,'BRAIN DAMAGE']];
const TALK_READY=["Don't do it!","Do a flip!","He's really doing it","Bro what","Go go go!","Not again...","Send it!","Nice day for a fall","Push me, I dare you"];
const TALK_FLY=["WATCH OUT!","INCOMING!","RUN!","No no no no","AAAH!"];

const PANTS=[0x1f3b73,0x3b3b3b,0x6b4a2b,0x2f5d2f];
const SKINS=[0xf5cd30,0xf1c27d,0xd9a066,0x8d5524];
const HATS=[null,null,0xd23c3c,0x222222,0x1f6fd0,0xffcc1f];
const DT=1/120, G=-22, DAMP=0.999, FRIC=0.09, T=10.5, PLAT=12, WALK=7;

let save={lv:{1:1,2:1},best:0};
try{const s=JSON.parse(localStorage.getItem('bb-save')||'null'); if(s&&s.lv) save=s;}catch(e){}
function persist(){try{localStorage.setItem('bb-save',JSON.stringify(save))}catch(e){}}
const map2Open=()=>new Date()>=MAP2_DATE;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const isMobile=window.matchMedia&&window.matchMedia('(pointer:coarse)').matches;

/* ---------- three setup ---------- */
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(58,1,0.1,2000);
const hemi=new THREE.HemisphereLight(0xdfefff,0x5a6a50,0.62); scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff3dd,0.95); scene.add(sun); scene.add(sun.target);
sun.castShadow=true; const SM=isMobile?1024:2048; sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:220}); sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.03;
const SUN_DIR=new V3(0.45,0.8,0.35).normalize();
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{top:{value:new THREE.Color()},bot:{value:new THREE.Color()},sunDir:{value:SUN_DIR}},
  vertexShader:'varying vec3 vW; void main(){ vW=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
  fragmentShader:'uniform vec3 top; uniform vec3 bot; uniform vec3 sunDir; varying vec3 vW; void main(){ float h=clamp(vW.y*1.3+0.12,0.0,1.0); vec3 c=mix(bot,top,pow(h,0.75)); float s=max(dot(normalize(vW),sunDir),0.0); c+=vec3(1.0,0.92,0.75)*pow(s,600.0)*1.4+vec3(1.0,0.85,0.6)*pow(s,10.0)*0.22; gl_FragColor=vec4(c,1.0); }'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(900,32,16),skyMat); sky.renderOrder=-1; scene.add(sky);
function resize(){const a=$('app'); renderer.setSize(a.clientWidth,a.clientHeight,false); camera.aspect=a.clientWidth/Math.max(1,a.clientHeight); camera.updateProjectionMatrix();}
window.addEventListener('resize',resize); resize();

const css=h=>'#'+h.toString(16).padStart(6,'0');
function canvasTex(draw,size){const c=document.createElement('canvas'); c.width=c.height=size||64; draw(c.getContext('2d'),c.width); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;}
function studTex(hex){return canvasTex((g,s)=>{g.fillStyle=css(hex); g.fillRect(0,0,s,s);
  g.fillStyle='rgba(0,0,0,.16)'; g.beginPath(); g.arc(35,35,13,0,7); g.fill();
  g.fillStyle='rgba(255,255,255,.28)'; g.beginPath(); g.arc(31,31,13,0,7); g.fill();
  g.fillStyle=css(hex); g.beginPath(); g.arc(32,32,10,0,7); g.fill();
  g.strokeStyle='rgba(0,0,0,.16)'; g.lineWidth=3; g.strokeRect(0,0,s,s);});}
const CRATE_T=canvasTex((g,s)=>{g.fillStyle='#b07a3c'; g.fillRect(0,0,s,s); g.strokeStyle='#6e4520'; g.lineWidth=10; g.strokeRect(5,5,s-10,s-10); g.lineWidth=8; g.beginPath(); g.moveTo(8,8); g.lineTo(s-8,s-8); g.stroke(); g.strokeStyle='rgba(0,0,0,.15)'; g.lineWidth=2; for(let y=22;y<s;y+=22){g.beginPath(); g.moveTo(0,y); g.lineTo(s,y); g.stroke();}},128);
const TNT_T=canvasTex((g,s)=>{g.fillStyle='#d62828'; g.fillRect(0,0,s,s); g.fillStyle='#f4efe6'; g.fillRect(0,s*.36,s,s*.28); g.fillStyle='#16202b'; g.font='bold '+(s*.26)+'px Arial Black,Impact,sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('TNT',s/2,s/2+2); g.strokeStyle='rgba(0,0,0,.25)'; g.lineWidth=3; for(let x=s/6;x<s;x+=s/6){g.beginPath(); g.moveTo(x,0); g.lineTo(x,s*.36); g.moveTo(x,s*.64); g.lineTo(x,s); g.stroke();}},128);
CRATE_T.__keep=true; TNT_T.__keep=true;
const faceCache={};
function face(state,skin){
  const k=state+'_'+skin; if(faceCache[k])return faceCache[k];
  const t=canvasTex((g)=>{
    g.fillStyle=css(skin); g.fillRect(0,0,128,128); g.fillStyle='#1b1b1b'; g.strokeStyle='#1b1b1b'; g.lineWidth=7; g.lineCap='round';
    if(state===0){ g.beginPath(); g.arc(44,52,8,0,7); g.arc(84,52,8,0,7); g.fill(); g.beginPath(); g.arc(64,66,26,.18*Math.PI,.82*Math.PI); g.stroke(); }
    else if(state===1){ [[44,52],[84,52]].forEach(([x,y])=>{g.beginPath(); g.moveTo(x-9,y-9); g.lineTo(x+9,y+9); g.moveTo(x+9,y-9); g.lineTo(x-9,y+9); g.stroke();}); g.beginPath(); g.moveTo(42,92); g.quadraticCurveTo(53,82,64,92); g.quadraticCurveTo(75,102,86,92); g.stroke(); }
    else if(state===2){ g.beginPath(); g.moveTo(34,54); g.lineTo(54,54); g.moveTo(74,54); g.lineTo(94,54); g.stroke(); g.beginPath(); g.arc(64,90,8,0,7); g.stroke(); g.font='bold 22px sans-serif'; g.fillText('z',98,30); g.font='bold 16px sans-serif'; g.fillText('z',110,16); }

  },128);

}
function mat(color,o){return new THREE.MeshStandardMaterial(Object.assign({color,roughness:.72,metalness:0},o||{}));}
function box(parent,w,h,d,color,o,noShadow){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color,o)); if(!noShadow){m.castShadow=true; m.receiveShadow=true;} parent.add(m); return m;}

/* ---------- state ---------- */
let world=null, dyn=null, npcG=null, itemG=null, cannonG=null;
let mapDef=MAPS[1], level=1, H=28, R=60, N=88, cell=1.5, HG=null, gear=0, aimYaw=0;
let PS=[], CS=[], rags=[], player=null, props=[], npcs=[], items=[], tramps=[];
let phase='walk', power=0, chargeT=0, flyT=0, still=0, thrustT=0, accum=0;
let broken=new Set(), trauma=0, brainLvl=0, ultra=false, headMult=1, rest=0.25, knocked=0;
let flyOff=0.7, camYaw=Math.PI, camPitch=0.38, camZoom=1, talkT=1.5, dragging=false, grpId=1;
const W={x:0,z:0,y:0,phase:0,amt:0};
const joy={x:0,y:0}, keys={};
const camTarget=new V3(), camPos=new V3(), _t=new V3(), _d=new V3();

function rng(seed){return function(){seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return((t^t>>>14)>>>0)/4294967296;}}

/* ---------- terrain ---------- */
function genTerrain(){
  const r=rng(level*977+mapDef.id*31);

        const d=Math.sqrt(d2)||1e-4,nx=dx/d,ny=dy/d,nz=dz/d,ov=rr-d,ws=p.w+q.w;
        const vn=(((q.x-q.px)-(p.x-p.px))*nx+((q.y-q.py)-(p.y-p.py))*ny+((q.z-q.pz)-(p.z-p.pz))*nz)/DT;
        p.x-=nx*ov*p.w/ws; p.y-=ny*ov*p.w/ws; p.z-=nz*ov*p.w/ws; q.x+=nx*ov*q.w/ws; q.y+=ny*ov*q.w/ws; q.z+=nz*ov*q.w/ws;
        if(vn<-6){ const s=-vn; hitBy(p,q,s); hitBy(q,p,s); }
      }
    }
  }
}
function hitBy(p,other,s){
  if(p.rag&&p.rag.isPlayer){ const k=other.w<.4?1.1:.75; if(s*k>p.imp)p.imp=s*k; }
  if(p.item&&p.item.id==='tnt'&&s>5)p.item.boom=true;
}
function centroid(rag){let x=0,y=0,z=0; for(const p of rag.list){x+=p.x;y+=p.y;z+=p.z;} const n=rag.list.length; return {x:x/n,y:y/n,z:z/n};}
function ragSpeed(rag){let s=0; for(const p of rag.list)s+=Math.hypot(p.x-p.px,p.y-p.py,p.z-p.pz)/DT; return s/rag.list.length;}
function preStep(){
  if(phase!=='fly')return;
  const P=player.P, [jx,jy]=readStick();
  if(Math.abs(jx)>.15||Math.abs(jy)>.15){
    const c=centroid(player); let ax=P.lSh.x-P.rSh.x,ay=P.lSh.y-P.rSh.y,az=P.lSh.z-P.rSh.z; let l=Math.hypot(ax,ay,az)||1; ax/=l;ay/=l;az/=l;
    let ux=P.neck.x-P.pelvis.x,uy=P.neck.y-P.pelvis.y,uz=P.neck.z-P.pelvis.z; l=Math.hypot(ux,uy,uz)||1; ux/=l;uy/=l;uz/=l;
    const K1=jy*20, K2=-jx*14;
    for(const p of player.list){const rx=p.x-c.x,ry=p.y-c.y,rz=p.z-c.z;
      p.ax+=(ay*rz-az*ry)*K1+(uy*rz-uz*ry)*K2; p.ay+=(az*rx-ax*rz)*K1+(uz*rx-ux*rz)*K2; p.az+=(ax*ry-ay*rx)*K1+(ux*ry-uy*rx)*K2;}
  }
  if(thrustT>0){ const fx=Math.cos(aimYaw),fz=Math.sin(aimYaw); for(const k of ['lFt','rFt','pelvis']){P[k].ax+=fx*30;P[k].az+=fz*30;P[k].ay+=36;} }
}
function step(){
  for(const p of PS){const vx=(p.x-p.px)*DAMP,vy=(p.y-p.py)*DAMP,vz=(p.z-p.pz)*DAMP; p.px=p.x;p.py=p.y;p.pz=p.z;
    p.x+=vx+p.ax*DT*DT; p.y+=vy+(G+p.ay)*DT*DT; p.z+=vz+p.az*DT*DT; p.ax=p.ay=p.az=0; p.imp=0; if(p.cd>0)p.cd-=DT;}
  for(let k=0;k<5;k++){ for(const c of CS)solve(c); if(k===0)pairCollide(); for(const p of PS)collide(p); }
  for(const p of PS){
    if(p.rag&&p.rag.isPlayer){ if(p.imp>0)onImpact(p,p.imp); if(p.lava){p.lava=false; if(p.cd<=0){pop('SIZZLE!',p,'hot'); p.cd=.25;}} }
    else { p.lava=false; if(p.imp>14&&p.cd<=0){ sfxThud(.22); p.cd=.25; if(p.imp>18)puff(p.x,p.y-p.r,p.z,2,0xd9d2c3); if(p.rag&&p.name==='head'&&Math.random()<.3)pop(pick(TALK_HIT),p,'npc'); }
      if(p.item&&p.item.id==='tnt'&&p.imp>11)p.item.boom=true; }
  }
  for(const it of items)if(it.boom&&!it.dead){explode(it); break;}
}

/* ---------- damage ---------- */
function onImpact(p,imp){
  if(p.cd>0||imp<5)return;
  p.cd=.15;
  if(imp>8){sfxThud(Math.min(1,imp/30)); puff(p.x,p.y-p.r*.5,p.z,imp>14?4:2,mapDef.lava?0x7a4a3a:0xe0dccd);}
  if(p.name==='head'){ addTrauma((imp-5)*headMult); if(imp>12)pop('BONK!',p,'head'); }
  let n=imp>T*1.8?2:imp>T?1:0;
  for(const b of p.bones){ if(n<=0)break; if(!broken.has(b)){breakBone(b,p); n--;} }
}
const BONE_MESH={'Skull':'head','Neck':'torso','Upper Spine':'torso','Ribs':'torso','Lower Spine':'torso','Pelvis':'torso','L Arm':'lUp','L Forearm':'lLo','L Hand':'lLo','R Arm':'rUp','R Forearm':'rLo','R Hand':'rLo','L Femur':'lTh','L Shin':'lCalf','L Foot':'lCalf','R Femur':'rTh','R Shin':'rCalf','R Foot':'rCalf'};
const BRUISE=new THREE.Color(0x8a5cf6);
function breakBone(b,p){
  broken.add(b); sfxCrack(); pop('CRACK! '+b.toUpperCase(),p);
  const m=player.M[BONE_MESH[b]]; if(m)(Array.isArray(m.material)?m.material:[m.material]).forEach(mt=>mt.color.lerp(BRUISE,.3));
  const S=player.stab;
  if(b==='Neck')S.head.forEach(c=>c.stiff=.06);
  if(b==='Upper Spine'||b==='Lower Spine')S.spine.forEach(c=>c.stiff=.06);
  if(b==='L Femur'||b==='L Shin')S.lLeg.len=.3;
  if(b==='R Femur'||b==='R Shin')S.rLeg.len=.3;
  if(b==='L Arm'||b==='L Forearm')S.lArm.len=.15;
  if(b==='R Arm'||b==='R Forearm')S.rArm.len=.15;
  checkUltra(); hud();
}
function addTrauma(v){
  trauma+=v; let nl=0; BRAIN.forEach((b,i)=>{if(trauma>=b[0])nl=i;});
  if(nl>brainLvl){brainLvl=nl; bigPop(BRAIN[nl][1]+'!'); setFace(player,nl>=4?3:nl>=3?2:1);}
  checkUltra(); hud();
}
function checkUltra(){ if(!ultra&&broken.size===BONES.length&&brainLvl>=4){ultra=true; bigPop('ULTRA BRAIN DAMAGE!!','ultra');} }

/* ---------- popups & sound ---------- */
const popsEl=$('pops'), _v=new V3();
function pop(text,p,cls){
  _v.set(p.x,p.y,p.z).project(camera); if(_v.z>1||Math.abs(_v.x)>1.1||Math.abs(_v.y)>1.1)return;
  if(popsEl.childElementCount>14)popsEl.firstChild.remove();
  const el=document.createElement('div'); el.className='pop '+(cls||''); el.textContent=text;
  el.style.left=((_v.x+1)/2*100)+'%'; el.style.top=((1-_v.y)/2*100)+'%';
  popsEl.appendChild(el); setTimeout(()=>el.remove(),cls==='talk'?2300:1150);
}
function bigPop(text,cls){const el=document.createElement('div'); el.className='pop big '+(cls||''); el.textContent=text; popsEl.appendChild(el); setTimeout(()=>el.remove(),1650);}
function toast(text){const el=document.createElement('div'); el.className='pop toast'; el.textContent=text; popsEl.appendChild(el); setTimeout(()=>el.remove(),2450);}
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}} if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function noise(dur,type,freq,gain,pw){const a=ac(); if(!a)return; const len=Math.floor(a.sampleRate*dur),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,pw);
  const s=a.createBufferSource(); s.buffer=buf; const f=a.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=a.createGain(); g.gain.value=gain; s.connect(f); f.connect(g); g.connect(a.destination); s.start();}
function tone(f0,f1,dur,gain,type){const a=ac(); if(!a)return; const now=a.currentTime,o=a.createOscillator(),g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f0,now); o.frequency.exponentialRampToValueAtTime(f1,now+dur); g.gain.setValueAtTime(gain,now); g.gain.exponentialRampToValueAtTime(.001,now+dur); o.connect(g); g.connect(a.destination); o.start(now); o.stop(now+dur+.02);}
const sfxCrack=()=>noise(.12,'highpass',1500,.55,4), sfxBoom=()=>{noise(.6,'lowpass',420,.8,2); tone(80,30,.5,.5);}, sfxBoing=()=>tone(180,620,.25,.25,'triangle'), sfxPop=()=>tone(500,900,.08,.15,'square');
let lastThud=0;
function sfxThud(v){const a=ac(); if(!a)return; if(a.currentTime-lastThud<.05)return; lastThud=a.currentTime; tone(110,40,.18,.35*v);}

/* ---------- run lifecycle ---------- */
const goalFor=lv=>Math.min(BONES.length,3+lv*2);
function walkGoal(){ $('goal').innerHTML='GOAL: BREAK '+goalFor(level)+' BONES · KNOCK OVER NPCS<br>STICK = WALK · HOLD JUMP · OR WALK OFF THE EDGE'; }
function resetPlayerUI(){ phase='walk'; power=0; $('jumpBtn').style.setProperty('--p',0); $('jumpLbl').textContent='JUMP'; $('jumpSub').textContent='hold'; $('results').hidden=true; showControls(true); walkGoal(); }
function startRun(mapId,lv){
  mapDef=MAPS[mapId]; level=lv;
  disposeWorld(); PS=[];CS=[];rags=[];items=[];tramps=[];props=[];player=null;cannonG=null;knocked=0;
  genTerrain(); buildWorld();
  skyMat.uniforms.top.value.set(mapDef.skyTop); skyMat.uniforms.bot.value.set(mapDef.skyBot);
  scene.fog=new THREE.Fog(mapDef.skyBot,70,R*2.6+140);
  hemi.color.set(mapDef.lava?0xffb08a:0xdfefff); hemi.groundColor.set(mapDef.lava?0x501a10:0x5a6a50);
  sun.color.set(mapDef.lava?0xffb070:0xfff3dd);
  aimYaw=0; camYaw=Math.PI; camPitch=.38; camZoom=1; W.x=0;W.z=0;W.y=H;W.amt=0;
  setupPlayer(); placeNPCs();
  renderGear(); resetPlayerUI(); hud(); updateMapBtn();
  camTarget.set(W.x,W.y+2,W.z); camPos.set(W.x-9,W.y+5,W.z);
}
function respawn(){
  if(player){ const pl=new Set(player.list); props.forEach(q=>{pl.add(q.a); pl.add(q.b);}); PS=PS.filter(p=>!pl.has(p)); CS=CS.filter(c=>!pl.has(c.a)); }
  aimYaw=0; W.x=0;W.z=0;W.y=H;W.amt=0; camYaw=Math.PI;
  setupPlayer(); resetPlayerUI();
}
function finish(){
  phase='done';
  const goal=goalFor(level), n=broken.size, pass=n>=goal;
  const score=n*100+Math.round(trauma)*5+knocked*250+(ultra?5000:0);
  let newBest=false; if(score>(save.best||0)){save.best=score; newBest=true;}
  if(pass&&level>=(save.lv[mapDef.id]||1))save.lv[mapDef.id]=level+1;
  persist();
  setTimeout(()=>{
    if(phase!=='done')return;
    $('resHead').textContent=pass?'LEVEL '+level+' CLEARED':'NOT ENOUGH BONES';
    $('resHead').className='res-head '+(pass?'win':'lose');
    $('resBanner').innerHTML=ultra?'<div class="banner">ULTRA BRAIN DAMAGE</div>':'';
    $('resStats').innerHTML=
      '<span>Bones broken</span><span>'+n+' / '+BONES.length+'</span>'+
      '<span>Goal</span><span>'+goal+'</span>'+
      '<span>Brain</span><span>'+(ultra?'ULTRA BRAIN DAMAGE':BRAIN[brainLvl][1])+'</span>'+
      '<span>NPCs knocked over</span><span>'+knocked+'</span>'+
      '<span>Mountain height</span><span>'+H+' m</span>'+
      '<span>Score</span><span>'+score.toLocaleString()+'</span>'+
      '<span>Best</span><span>'+(save.best||0).toLocaleString()+(newBest?' NEW!':'')+'</span>';
    $('resBones').innerHTML=BONES.map(b=>'<div class="bone'+(broken.has(b)?' x':'')+'">'+b+'</div>').join('');
    $('resNote').innerHTML=pass?'':'<div class="note">Need '+(goal-n)+' more. Try TNT, the Cannon, or flip so you land on your head.</div>';
    $('btnNext').hidden=!pass;
    $('results').hidden=false; showControls(false);
  },900);
}
function showControls(on){ $('stick').hidden=!on; $('jumpBtn').hidden=!on; if(!on)closeTrays(); }

/* ---------- render & camera ---------- */
function updateMeshes(t){
  for(const r of rags)updateRag(r,t);
  for(const q of props){const dx=q.b.x-q.a.x,dy=q.b.y-q.a.y,dz=q.b.z-q.a.z,L=Math.hypot(dx,dy,dz)||1;
    q.m.position.set((q.a.x+q.b.x)/2,(q.a.y+q.b.y)/2,(q.a.z+q.b.z)/2); q.m.quaternion.setFromUnitVectors(XAX,_d.set(dx/L,dy/L,dz/L)); q.m.scale.x=L+q.pad*2;}
  updateItems();
  if(mapDef.lava&&world)world.userData.plane.material.emissiveIntensity=.7+.18*Math.sin(t*.003);
}
function updateCamera(dt){
  let tx,ty,tz,dist,pitch=camPitch;
  if(phase==='fly'||phase==='done'){ const c=centroid(player); tx=c.x;ty=c.y+.5;tz=c.z; dist=(13+Math.min(ragSpeed(player),30)*.3)*camZoom; pitch=Math.max(camPitch,.6); }
  else { tx=W.x;ty=W.y+2.2;tz=W.z; dist=9*camZoom; }
  const yaw=(phase==='fly'||phase==='done')?Math.atan2(tz,tx)+flyOff:camYaw;
  let px=tx+Math.cos(yaw)*Math.cos(pitch)*dist, py=ty+Math.sin(pitch)*dist, pz=tz+Math.sin(yaw)*Math.cos(pitch)*dist;
  py=Math.max(py,heightAt(px,pz)+1.5,1.5);
  const k=1-Math.pow(.015,dt);
  camTarget.lerp(_t.set(tx,ty,tz),k); camPos.lerp(_d.set(px,py,pz),k);
  camera.position.copy(camPos); camera.lookAt(camTarget);
  sky.position.copy(camera.position);
  sun.position.set(camTarget.x+SUN_DIR.x*90,camTarget.y+SUN_DIR.y*90,camTarget.z+SUN_DIR.z*90); sun.target.position.copy(camTarget);
}

/* ---------- UI ---------- */
function hud(){
  $('lvlChip').textContent=(mapDef.lava?'LAVA ':'')+'LV '+level+' · '+H+' m';
  $('boneChip').textContent='BONES '+broken.size+'/'+BONES.length;
  $('npcChip').textContent='NPCS '+knocked;
  const bc=$('brainChip'); bc.textContent='BRAIN: '+(ultra?'ULTRA BRAIN DAMAGE':BRAIN[brainLvl][1]); bc.dataset.l=ultra?5:brainLvl;
}
function renderGear(){
  $('gearRow').innerHTML=GEAR.map((g,i)=>'<button class="slot" data-i="'+i+'" aria-pressed="'+(i===gear)+'"><b><i style="background:'+g.color+'"></i>'+g.name+'</b><small>'+g.desc+'</small></button>').join('');
}
$('itemRow').innerHTML=ITEMS.map(it=>'<button class="slot" data-id="'+it.id+'"><b><i style="background:'+it.color+'"></i>'+it.name+'</b><small>'+it.desc+'</small></button>').join('');
$('itemRow').addEventListener('click',e=>{const b=e.target.closest('.slot'); if(b)spawnItem(b.dataset.id);});
$('clearItems').onclick=()=>{clearItems(); toast('Items cleared');};
$('gearRow').addEventListener('click',e=>{const b=e.target.closest('.slot'); if(!b)return; if(phase!=='walk'){toast('Change gear on the mountain top'); return;} gear=+b.dataset.i; setupPlayer(); renderGear(); toast(GEAR[gear].name+' equipped');});
function closeTrays(){ $('itemTray').hidden=true; $('gearTray').hidden=true; $('bItems').setAttribute('aria-pressed','false'); $('bGear').setAttribute('aria-pressed','false'); }
function toggleTray(which){ const tr=$(which+'Tray'), btn=$(which==='item'?'bItems':'bGear'), open=tr.hidden; closeTrays(); if(open){tr.hidden=false; btn.setAttribute('aria-pressed','true');} }
$('bItems').onclick=()=>{ac(); toggleTray('item');};
$('bGear').onclick=()=>{ac(); toggleTray('gear');};
function updateMapBtn(){ $('bMap').textContent=mapDef.id===1?'LAVA':'BLOCKY'; }
$('bMap').onclick=()=>{ ac(); const other=mapDef.id===1?2:1;
  if(other===2&&!map2Open()){ const days=Math.ceil((MAP2_DATE-new Date())/864e5); toast('Lava Peaks opens Sunday, Oct 18 ('+days+' day'+(days===1?'':'s')+' left)'); return; }
  startRun(other,save.lv[other]||1); };
$('bReset').onclick=()=>{ ac(); respawn(); };
$('btnRetry').onclick=()=>respawn();
$('btnNext').onclick=()=>startRun(mapDef.id,level+1);

const stick=$('stick'), knob=$('knob'); let stickId=null;
function stickMove(e){ if(!e)return; const r=stick.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, R0=r.width/2-14;
  let dx=e.clientX-cx, dy=e.clientY-cy; const l=Math.hypot(dx,dy); if(l>R0){dx*=R0/l; dy*=R0/l;}
  joy.x=dx/R0; joy.y=dy/R0; knob.style.transform='translate('+dx+'px,'+dy+'px)'; }
stick.addEventListener('pointerdown',e=>{e.preventDefault(); ac(); stickId=e.pointerId; try{stick.setPointerCapture(e.pointerId);}catch(err){} stickMove(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
['pointerup','pointercancel'].forEach(ev=>stick.addEventListener(ev,e=>{if(e.pointerId!==stickId)return; stickId=null; joy.x=joy.y=0; knob.style.transform='';}));
function pressJump(){ac(); if(phase==='walk'){phase='charge'; chargeT=0;}}
function releaseJump(){if(phase==='charge')launchWith(4+9*power,3+6*power,true);}
const jb=$('jumpBtn');
jb.addEventListener('pointerdown',e=>{e.preventDefault(); pressJump();});
['pointerup','pointerleave','pointercancel'].forEach(ev=>jb.addEventListener(ev,releaseJump));
window.addEventListener('keydown',e=>{ keys[e.code]=true; if(e.repeat)return;
  if(e.code==='Space'){e.preventDefault(); pressJump();}
  if(e.code==='KeyR')respawn(); });
window.addEventListener('keyup',e=>{ keys[e.code]=false; if(e.code==='Space')releaseJump(); });
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId}; dragging=true; try{canvas.setPointerCapture(e.pointerId);}catch(err){}});
canvas.addEventListener('pointermove',e=>{ if(!drag||e.pointerId!==drag.id)return; if(phase==='fly'||phase==='done')flyOff+=(e.clientX-drag.x)*.008; else camYaw+=(e.clientX-drag.x)*.008; camPitch=clamp(camPitch+(e.clientY-drag.y)*.005,.05,1.3); drag.x=e.clientX; drag.y=e.clientY;});
['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,e=>{if(drag&&e.pointerId===drag.id){drag=null; dragging=false;}}));
canvas.addEventListener('wheel',e=>{e.preventDefault(); camZoom=clamp(camZoom*(1+e.deltaY*.001),.5,2.5);},{passive:false});

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000); last=now;
  if(phase==='walk'||phase==='charge')walk(dt);
  if(phase==='charge'){chargeT+=dt; power=.5-.5*Math.cos(chargeT*3.4); $('jumpBtn').style.setProperty('--p',power.toFixed(3));}
  accum+=dt; let guard=0;
  while(accum>=DT&&guard<10){preStep(); step(); accum-=DT; guard++;}
  if(guard>=10)accum=0;
  checkKnocks();
  if(thrustT>0)thrustT-=dt;
  if(phase==='fly'){ flyT+=dt; still=ragSpeed(player)<1.6?still+dt:0; if((flyT>1.5&&still>1.3)||flyT>24)finish(); }
  if(world){ updateNPCs(dt); talk(dt); updateMeshes(now); updateFX(dt); updateCamera(dt); }
  renderer.render(scene,camera);
}
startRun(1,save.lv[1]||1);
requestAnimationFrame(frame);
window.__bb={spawnItem,joy,get phase(){return phase;},get W(){return W;},get knocked(){return knocked;},get broken(){return broken.size;},get items(){return items.length;}};
})();
</script>
