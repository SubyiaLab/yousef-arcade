<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Giggle Scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b14;--ink:#fff;--muted:rgba(255,255,255,.75);--pink:#ff3d7f;--sheet:#fff;--sheetInk:#1d1a2b;--sheetMuted:#6b6880;--line:#ecebf3}
:root[data-theme="dark"]{--bg:#0d0b14}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0b14;--sheet:#1b1826;--sheetInk:#f3f1fa;--sheetMuted:#a9a5bd;--line:#2c2839}}
:root[data-theme="dark"]{--sheet:#1b1826;--sheetInk:#f3f1fa;--sheetMuted:#a9a5bd;--line:#2c2839}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Nunito,system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 20% 20%,#2a1840 0,transparent 50%),radial-gradient(circle at 80% 80%,#10324a 0,transparent 50%),var(--bg)}
#stage{position:relative;height:100%;width:100%;overflow:hidden;touch-action:none;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#top{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;background:linear-gradient(rgba(0,0,0,.35),transparent);z-index:5}
.logo{font-family:'Luckiest Guy',cursive;font-size:24px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.logo span{color:#ffd23f}
.tabs{display:flex;gap:16px;font-weight:900;font-size:15px}
.tabs b{border-bottom:3px solid #fff;padding-bottom:2px}
.tabs i{font-style:normal;opacity:.6}
#top button{pointer-events:auto}
.ib{background:rgba(0,0,0,.35);border:0;color:#fff;width:40px;height:40px;border-radius:50%;font-size:19px;cursor:pointer;display:grid;place-items:center}
#ui{position:absolute;inset:0;pointer-events:none;z-index:4;will-change:transform}
#side{position:absolute;right:10px;bottom:calc(140px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px;pointer-events:auto}
.act{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:#fff;cursor:pointer;font:800 13px Nunito,sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.7);padding:0}
.act .ic{width:48px;height:48px;display:grid;place-items:center;font-size:30px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5));transition:transform .15s}
.act:active .ic{transform:scale(.85)}
.act svg{width:38px;height:38px}
#likeBtn.on svg path{fill:var(--pink);stroke:var(--pink)}
#likeBtn.pop .ic{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.av{position:relative;width:52px;height:52px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:28px;margin-bottom:8px}
.fol{position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font:900 16px/22px Nunito;text-align:center;border:0;cursor:pointer;padding:0}
.fol.on{background:#fff;color:var(--pink)}
.disc{width:44px;height:44px;border-radius:50%;background:conic-gradient(#222,#555,#222,#555,#222);border:8px solid #1a1a1a;display:grid;place-items:center;font-size:16px;animation:spin 3s linear infinite}
.paused .disc{animation-play-state:paused}
@keyframes spin{to{transform:rotate(360deg)}}
#info{position:absolute;left:14px;right:84px;bottom:calc(74px + env(safe-area-inset-bottom));text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}
#info .who{font-weight:900;font-size:17px;margin-bottom:5px}
#info .cap{font-weight:700;font-size:15px;line-height:1.3;margin-bottom:8px}
#info .cap em{font-style:normal;font-weight:900;color:#ffe680}
.snd{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;overflow:hidden;white-space:nowrap}
.snd .mq{overflow:hidden;width:200px;max-width:70%}
.snd .mq span{display:inline-block;padding-left:100%;animation:mq 8s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
#prog{position:absolute;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));height:3px;background:rgba(255,255,255,.2);z-index:4}
#prog div{height:100%;width:0;background:#fff}
#pauseIcon{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:64px;opacity:0;pointer-events:none;z-index:4;transition:opacity .15s;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.paused #pauseIcon{opacity:.85}
#hint{position:absolute;left:50%;bottom:30%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:10px 18px;border-radius:30px;font-weight:900;font-size:17px;z-index:4;pointer-events:none;opacity:0;transition:opacity .4s;white-space:nowrap}
#hint.show{opacity:1;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-12px)}}
.heart{position:absolute;font-size:90px;pointer-events:none;z-index:6;animation:heart .9s ease-out forwards}
@keyframes heart{0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r));opacity:0}20%{transform:translate(-50%,-50%) scale(1.2) rotate(var(--r));opacity:1}40%{transform:translate(-50%,-50%) scale(1) rotate(var(--r))}100%{transform:translate(-50%,-160%) scale(1.3) rotate(var(--r));opacity:0}}
#toast{position:absolute;left:50%;top:22%;transform:translate(-50%,-10px);background:#fff;color:#1d1a2b;font-weight:900;padding:10px 18px;border-radius:30px;z-index:9;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#sheet{position:absolute;left:0;right:0;bottom:calc(54px + env(safe-area-inset-bottom));height:60%;background:var(--sheet);color:var(--sheetInk);border-radius:18px 18px 0 0;z-index:8;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#sheet.open{transform:none}
#sheet:not(.open){transform:translateY(calc(105% + 60px))}
#sheet header{padding:14px 16px 10px;font-weight:900;text-align:center;position:relative;border-bottom:1px solid var(--line)}
#sheet header button{position:absolute;right:10px;top:8px;background:none;border:0;font-size:22px;color:var(--sheetInk);cursor:pointer;width:36px;height:36px}
#clist{flex:1;overflow-y:auto;padding:6px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.cm{display:flex;gap:10px;padding:10px 0;align-items:flex-start}
.cm .a{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:19px}
.cm .b{flex:1;min-width:0}
.cm .n{font-weight:800;font-size:13px;color:var(--sheetMuted)}
.cm .t{font-weight:700;font-size:15px;margin-top:2px;word-wrap:break-word}
.cm.rep{margin-left:46px;padding:6px 0}
.cm.rep .a{width:28px;height:28px;font-size:15px}
.cm .rp{background:none;border:0;padding:4px 0 0;color:var(--sheetMuted);font:800 13px Nunito,sans-serif;cursor:pointer}
.badge{background:var(--pink);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px}
.typing .t{color:var(--sheetMuted);font-style:italic}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:currentColor;margin-left:3px;animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
#replyBar{padding:8px 16px;font-weight:800;font-size:13px;color:var(--sheetMuted);border-top:1px solid var(--line);cursor:pointer}
.cm .h{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--sheetMuted);cursor:pointer;background:none;border:0;padding:0 2px;font-weight:800}
.cm .h span{font-size:18px}
.cm .h.on span{color:var(--pink)}
#cform{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
#cform input{flex:1;border:0;background:var(--line);color:var(--sheetInk);border-radius:22px;padding:11px 16px;font:700 15px Nunito,sans-serif;outline:none;-webkit-user-select:text;user-select:text}
#cform button{border:0;background:var(--pink);color:#fff;border-radius:22px;padding:0 18px;font:900 15px Nunito,sans-serif;cursor:pointer}
#start{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 35%,#ff5fa2 0,#7b3cff 45%,#1a0f33 100%);text-align:center;padding:24px}
#start h1{font-family:'Luckiest Guy',cursive;font-weight:400;font-size:clamp(46px,13vw,76px);line-height:.95;margin:0;text-shadow:0 5px 0 #2b0f55,0 10px 20px rgba(0,0,0,.4);transform:rotate(-4deg)}
#start h1 span{color:#ffd23f;display:block}
#start p{font-weight:800;font-size:18px;margin:0;max-width:320px;opacity:.95}
#go{font-family:'Luckiest Guy',cursive;font-size:30px;background:#ffd23f;color:#2b0f55;border:0;border-radius:40px;padding:16px 38px 12px;box-shadow:0 6px 0 #c98f00;cursor:pointer;animation:pulse 1.4s ease-in-out infinite}
#go:active{transform:translateY(4px);box-shadow:0 2px 0 #c98f00}
@keyframes pulse{50%{transform:scale(1.06)}}
.faces{font-size:40px;letter-spacing:6px}
#start small{opacity:.75;font-weight:700}

#nav{position:absolute;left:0;right:0;bottom:0;height:calc(54px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#0d0b14;display:flex;align-items:center;justify-content:space-around;z-index:13;border-top:1px solid rgba(255,255,255,.08)}
#nav button{background:none;border:0;color:rgba(255,255,255,.6);font:800 11px Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:64px}
#nav button i{font-style:normal;font-size:22px}
#nav button.on{color:#fff}
#navPlus{width:52px;height:34px;border-radius:10px!important;background:linear-gradient(90deg,#3dd8ff 0 18%,#fff 18% 82%,#ff3d7f 82%)!important;color:#111!important;font:900 26px/34px Nunito!important;min-width:0!important;display:block!important}
.ovl{position:absolute;inset:0;bottom:calc(54px + env(safe-area-inset-bottom));z-index:12;background:var(--sheet);color:var(--sheetInk);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.ovl[hidden],#editor[hidden],.modal[hidden]{display:none}
.chTop{padding:calc(56px + env(safe-area-inset-top)) 16px 16px;text-align:center;color:#fff;position:relative}
.chAv{width:92px;height:92px;border-radius:50%;margin:0 auto 8px;background:rgba(255,255,255,.25);border:4px solid #fff;display:grid;place-items:center;font-size:52px}
.chName{font:400 26px 'Luckiest Guy',sans-serif;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.chBio{font-weight:700;opacity:.95;margin-top:2px;min-height:4px}
.chStats{display:flex;justify-content:center;gap:18px;margin:14px 0 12px}
.chStats div{display:flex;flex-direction:column;font-size:12px;font-weight:800;opacity:.95}
.chStats b{font-size:20px;font-weight:900}
.chBtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 14px;font:900 15px Nunito,sans-serif;cursor:pointer;background:rgba(255,255,255,.22);color:#fff}
.btn.pri{background:var(--pink);color:#fff}
.btn.light{background:var(--line);color:var(--sheetInk)}
.saved{margin-top:10px;font-size:12px;font-weight:800;opacity:.9}
.saved.flash{animation:fl .8s}
@keyframes fl{30%{transform:scale(1.12)}}
.chNew{display:flex;gap:10px;padding:14px 16px}
.chNew button{flex:1;padding:14px;font-size:16px}
.chTabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--sheet);z-index:2}
.chTabs button{flex:1;background:none;border:0;padding:12px 4px;font:900 14px Nunito,sans-serif;color:var(--sheetMuted);border-bottom:3px solid transparent;cursor:pointer}
.chTabs button.on{color:var(--sheetInk);border-color:var(--sheetInk)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.tile{position:relative;aspect-ratio:9/16;border:0;padding:0;background:#222;cursor:pointer;overflow:hidden;border-radius:4px}
.tile canvas{width:100%;height:100%;display:block}
.tile .views{position:absolute;left:6px;bottom:24px;color:#fff;font:900 13px Nunito;text-shadow:0 1px 3px #000}
.tile .tt{position:absolute;left:0;right:0;bottom:0;padding:4px 6px;color:#fff;font:800 11px Nunito;background:linear-gradient(transparent,rgba(0,0,0,.7));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tile .kind{position:absolute;right:5px;top:5px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 6px;font:900 10px Nunito}
.empty{padding:30px 20px;text-align:center;color:var(--sheetMuted);font-weight:800}
.modal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--sheet);color:var(--sheetInk);width:100%;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));touch-action:pan-y}
.modal h3{margin:0 0 12px;font:400 24px 'Luckiest Guy',sans-serif;text-align:center}
.modal label{display:block;font-weight:900;font-size:14px;margin:12px 0 6px}
.modal input,.modal textarea,.edbody input{width:100%;border:2px solid var(--line);background:var(--line);color:var(--sheetInk);border-radius:12px;padding:11px 14px;font:800 16px Nunito,sans-serif;outline:none;-webkit-user-select:text;user-select:text}
.modal textarea{height:84px;font-size:12px;resize:none}
.modal .row{display:flex;gap:8px;margin-top:14px}
.modal .row .btn{flex:1}
.err{color:#ff3d5a;font-weight:900;font-size:13px;min-height:16px;margin-top:6px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{width:44px;height:44px;border-radius:12px;border:3px solid transparent;background:var(--line);font-size:24px;cursor:pointer;padding:0}
.picks button.on{border-color:var(--pink)}
.sw{width:34px!important;height:34px!important;border-radius:50%!important}
.menuList button{display:block;width:100%;text-align:left;margin-bottom:8px;font-size:17px;padding:14px}
#editor{position:absolute;inset:0;z-index:16;overflow:hidden;background:#14111f;color:#fff;display:flex;flex-direction:column}
.edh{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;gap:8px}
.edh b{font:400 22px 'Luckiest Guy',sans-serif}
.edh .btn{padding:8px 12px;font-size:14px}
.edprev{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:6px}
#edCv{height:min(36vh,330px);aspect-ratio:9/16;border-radius:12px;background:#000;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.edctl{display:flex;gap:10px;align-items:center;font-weight:800;font-size:13px}
.edctl .btn{padding:6px 12px;font-size:13px}
#edScenes{display:flex;gap:6px;justify-content:center;padding:4px 10px 8px;flex-wrap:wrap}
#edScenes button{border:0;border-radius:10px;padding:7px 12px;font:900 14px Nunito;cursor:pointer;background:#2c2840;color:#fff}
#edScenes button.on{background:#ffd23f;color:#1d1a2b}
.edbody{flex:1;min-height:0;overflow-y:auto;background:var(--sheet);color:var(--sheetInk);border-radius:18px 18px 0 0;padding:6px 12px 16px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.edsec{margin-top:12px}
.edsec h4{margin:0 0 6px;font-size:14px;font-weight:900;display:flex;justify-content:space-between;align-items:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;touch-action:pan-x}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:3px solid transparent;background:var(--line);color:var(--sheetInk);border-radius:14px;min-width:62px;padding:6px 6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font:800 11px Nunito,sans-serif;cursor:pointer}
.chip i{font-style:normal;font-size:24px;line-height:1.1}
.chip.on{border-color:var(--pink);background:rgba(255,61,127,.12)}
.edfoot{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--sheet);display:flex;gap:8px}
.edfoot .btn{flex:1;padding:14px;font-size:17px}
</style>
</head>
<body>
<div id="app">
 <div id="stage">
  <canvas id="cv"></canvas>
  <div id="top">
   <div class="logo">Giggle<span>Scroll</span></div>
   <div class="tabs"><i>Following</i><b>For You</b></div>
   <button class="ib" id="sndBtn" aria-label="Sound">🔊</button>
  </div>
  <div id="ui">
   <div id="side">
    <div class="av" id="avatar">🐱<button class="fol" id="folBtn" aria-label="Follow">+</button></div>
    <button class="act" id="likeBtn" aria-label="Like"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.2 0 3.6 1.2 4.4 2.5h1.6c.8-1.3 2.2-2.5 4.4-2.5 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z" fill="#fff" stroke="#fff" stroke-width="1"/></svg></span><span id="likeN">0</span></button>
    <button class="act" id="comBtn" aria-label="Comments"><span class="ic"><svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.8 2 11.5c0 2.6 1.4 4.9 3.6 6.5L5 21.5l4-2c.9.3 2 .5 3 .5 5.5 0 10-3.8 10-8.5S17.5 3 12 3z" fill="#fff"/><circle cx="8" cy="11.5" r="1.3" fill="#333"/><circle cx="12" cy="11.5" r="1.3" fill="#333"/><circle cx="16" cy="11.5" r="1.3" fill="#333"/></svg></span><span id="comN">0</span></button>
    <button class="act" id="shareBtn" aria-label="Share"><span class="ic"><svg viewBox="0 0 24 24"><path d="M14 4l8 7.5-8 7.5v-4.5C8 14.5 4.5 16.5 2 21c.8-6.5 4.5-11.5 12-12.5V4z" fill="#fff"/></svg></span><span id="shareN">0</span></button>
    <div class="disc" id="disc">🎵</div>
   </div>
   <div id="info">
    <div class="who" id="who">@creator</div>
    <div class="cap" id="cap">caption</div>
    <div class="snd">🎵 <div class="mq"><span id="sndName">original sound</span></div></div>
   </div>
  </div>
  <div id="prog"><div id="progBar"></div></div>
  <div id="pauseIcon">▶</div>
  <div id="hint">Swipe up for more! ⬆️</div>
  <div id="toast"></div>
  <div id="sheet">
   <header><span id="sheetTitle">Comments</span><button id="closeSheet" aria-label="Close">✕</button></header>
   <div id="clist"></div>
   <div id="replyBar" hidden></div>
   <form id="cform"><input id="cin" maxlength="80" placeholder="Add a funny comment..." autocomplete="off"><button type="submit">Post</button></form>
  </div>
  <div id="channel" class="ovl" hidden></div>
  <div id="editor" hidden></div>
  <nav id="nav"><button data-nav="home" class="on"><i>🏠</i>Home</button><button id="navPlus" aria-label="Create">+</button><button data-nav="me"><i>👤</i>Me</button></nav>
  <div id="start">
   <div class="faces">😂🐱🦆🤖🍔</div>
   <h1>Giggle<span>Scroll</span></h1>
   <p>Endless funny cartoon videos. Swipe up for the next one!</p>
   <button id="go">TAP TO START</button>
   <small>Turn your sound on 🔊</small>
  </div>
 </div>
</div>
<script>
'use strict';
// ================= helpers =================
const TAU = Math.PI * 2, OUT = '#1d1a2b';
let c = null; // current 2d context
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const eo = x => 1 - Math.pow(1 - x, 3);
const ei = x => x * x * x;
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const k = 1.9; return 1 + (k + 1) * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); };

        SAVE = Object.assign(defaultSave(), o); followed.clear(); (SAVE.following || []).forEach(n => followed.add(n)); saveNow(); m.remove(); toast('✅ Save loaded!'); showMe(); bindUI();
      } catch (e) { m.querySelector('#scErr').textContent = "That code didn't work. Check you copied all of it."; }
    };
  });
}

// ---------- channel page ----------
let chTab = 'short';
function thumb(cv, v) {
  const g = cv.getContext('2d'); const w = cv.width = 216, h = cv.height = 384;
  const old = c; c = g; g.save(); g.fillStyle = '#000'; g.fillRect(0, 0, w, h); g.scale(w / 360, h / 640);
  try { drawScene(v.scenes[0], 1.6); } catch (e) { } g.restore(); c = old;
}
function renderChannel() {
  const ch = SAVE.channel; if (!ch) return;
  const vids = SAVE.videos;
  const shorts = vids.filter(v => v.published && v.kind === 'short'), longs = vids.filter(v => v.published && v.kind === 'video'), drafts = vids.filter(v => !v.published);
  const list = (chTab === 'short' ? shorts : chTab === 'video' ? longs : drafts).slice().sort((a, b) => b.created - a.created);
  $('channel').innerHTML = `<div class="chTop" style="background:linear-gradient(160deg,${ch.color},${shade(ch.color, -60)})">
    <div class="chAv">${ch.emoji}</div><div class="chName">@${esc(ch.name)}</div><div class="chBio">${esc(ch.bio || '')}</div>
    <div class="chStats"><div><b>${fmt(followers())}</b>Followers</div><div><b>${followed.size}</b>Following</div><div><b>${fmt(totalLikes())}</b>Likes</div><div><b>${fmt(totalViews())}</b>Views</div></div>
    <div class="chBtns"><button class="btn" data-a="edit">✏️ Edit channel</button><button class="btn" data-a="code">💾 Save code</button></div>
    <div class="saved">${saveLine()}</div></div>
    <div class="chNew"><button class="btn pri" data-a="short">📱 New Short</button><button class="btn pri" style="background:#7b3cff" data-a="video">🎬 New Video</button></div>
    <div class="chTabs"><button data-t="short" class="${chTab === 'short' ? 'on' : ''}">Shorts ${shorts.length}</button><button data-t="video" class="${chTab === 'video' ? 'on' : ''}">Videos ${longs.length}</button><button data-t="draft" class="${chTab === 'draft' ? 'on' : ''}">Drafts ${drafts.length}</button></div>
    ${list.length ? `<div class="grid">${list.map(v => `<button class="tile" data-id="${v.id}"><canvas></canvas>${v.kind === 'video' ? `<span class="kind">${v.scenes.length * SCENE_D}s</span>` : ''}${v.published ? `<span class="views">▶ ${fmt(v.views)}</span>` : '<span class="views">✏️ draft</span>'}<span class="tt">${esc(v.title)}</span></button>`).join('')}</div>`
      : `<div class="empty">${chTab === 'draft' ? 'No drafts. Tap "Save draft" in the studio to keep a video for later.' : chTab === 'short' ? 'No Shorts yet. Tap 📱 New Short to make your first one!' : 'No Videos yet. Tap 🎬 New Video to make a longer one!'}</div>`}`;
  $('channel').querySelectorAll('.tile').forEach(t => thumb(t.querySelector('canvas'), SAVE.videos.find(v => v.id === t.dataset.id)));
}
$('channel').addEventListener('click', e => {
  const a = e.target.closest('[data-a]'), tb = e.target.closest('[data-t]'), tile = e.target.closest('.tile');
  if (a) { play('ui'); const k = a.dataset.a; if (k === 'edit') channelForm(false); else if (k === 'code') saveCodeModal(); else openEditor(null, k); }
  else if (tb) { chTab = tb.dataset.t; play('ui'); renderChannel(); }
  else if (tile) { play('ui'); tileMenu(SAVE.videos.find(v => v.id === tile.dataset.id)); }
});
function tileMenu(v) {
  if (!v) return;
  modal(`<h3>${esc(v.title)}</h3>${v.published ? `<p style="text-align:center;font-weight:800;margin:-4px 0 12px">▶ ${fmt(v.views)} views · ❤️ ${fmt(v.likes)} · 💬 ${v.comments.length}</p>` : ''}<div class="menuList">
    ${v.published ? '<button class="btn pri" data-k="watch">▶ Watch it</button>' : '<button class="btn pri" data-k="pub">🚀 Publish now</button>'}
    <button class="btn light" data-k="edit">✏️ Edit</button>
    <button class="btn light" data-k="del" style="color:#ff3d5a">🗑️ Delete</button>
    <button class="btn light" data-k="x">Cancel</button></div>`, m => {
    m.querySelectorAll('button').forEach(b => b.onclick = () => {
      const k = b.dataset.k; m.remove(); play('ui');
      if (k === 'watch') watchVideo(v);
      else if (k === 'edit') openEditor(v);
      else if (k === 'pub') publishVideo(v, true);
      else if (k === 'del') { if (confirm('Delete "' + v.title + '"? This cannot be undone.')) { SAVE.videos = SAVE.videos.filter(x => x !== v); for (let i = feed.length - 1; i > cur; i--) if (feed[i].video === v) feed.splice(i, 1); saveNow(); renderChannel(); toast('Deleted'); } }
    });
  });
}
function watchVideo(v) {
  showHome(); closeSheet();
  feed.splice(cur + 1, 0, userItem(v));
  goTo(1);
}

// ---------- editor ----------
const ED = { v: null, i: 0, playAll: false, t: 0, lastT: 0, editing: null };
function openEditor(existing, kind) {
  closeSheet();
  if (existing) { ED.v = JSON.parse(JSON.stringify({ kind: existing.kind, title: existing.title, caption: existing.caption, scenes: existing.scenes })); ED.editing = existing; }
  else {
    const s1 = randomScene(); ED.v = { kind: kind || 'short', title: '', caption: '', scenes: [s1] }; ED.editing = null;
    if (ED.v.kind === 'video') { ED.v.scenes.push(randomScene(s1)); }
  }
  ED.i = 0; ED.playAll = false; ED.t = 0; ED.lastT = -.001;
  $('editor').hidden = false; buildEditor(); setPaused(true);
}
function randomScene(like) {
  const s = newScene(), r = a => a[Math.floor(Math.random() * a.length)][0];
  s.bg = like ? like.bg : r(ST.bgs); s.actor = like ? like.actor : r(ST.actors); s.action = r(ST.actions.filter(a => !like || a[0] !== like.action));
  s.col = ST.colors[Math.floor(Math.random() * ST.colors.length)]; s.sfx = r(ST.sfx.slice(1)); s.music = like ? like.music : r(ST.music.slice(1)); s.fx = Math.random() < .5 ? 'none' : r(ST.fx.slice(1));
  if (like) s.col = like.col;
  return s;
}
function chipsHTML(k, list, cur) { return `<div class="chips" data-k="${k}">${list.map(([id, ic, nm]) => `<button class="chip${id === cur ? ' on' : ''}" data-v="${id}"><i>${ic}</i>${nm}</button>`).join('')}</div>`; }
function swHTML(k, list, cur) { return `<div class="picks" data-k="${k}">${list.map(cl => `<button class="sw${cl === cur ? ' on' : ''}" data-v="${cl}" style="background:${cl}"></button>`).join('')}</div>`; }
function buildEditor() {
  const v = ED.v, s = v.scenes[ED.i];
  $('editor').innerHTML = `<header class="edh"><button class="btn" id="edCancel">✕</button><b>${ED.editing ? 'Edit' : 'New'} ${v.kind === 'short' ? 'Short' : 'Video'}</b><button class="btn" id="edDraft">Save draft</button></header>
   <div class="edprev"><canvas id="edCv" width="270" height="480"></canvas><div class="edctl">${v.kind === 'video' ? `<button class="btn" id="edPlay" style="background:#2c2840">${ED.playAll ? '⏹ Stop' : '▶ Play whole video'}</button>` : ''}<button class="btn" id="edRand" style="background:#2c2840">🎲 Surprise me</button></div></div>
   ${v.kind === 'video' ? `<div id="edScenes">${v.scenes.map((x, i) => `<button data-s="${i}" class="${i === ED.i ? 'on' : ''}">Scene ${i + 1}</button>`).join('')}${v.scenes.length < 4 ? '<button data-s="add">＋ Add scene</button>' : ''}${v.scenes.length > 2 ? '<button data-s="del">🗑️</button>' : ''}</div>` : ''}
   <div class="edbody" id="edBody">
    <div class="edsec"><h4>Type</h4><div class="chips" data-k="kind"><button class="chip${v.kind === 'short' ? ' on' : ''}" data-v="short"><i>📱</i>Short</button><button class="chip${v.kind === 'video' ? ' on' : ''}" data-v="video"><i>🎬</i>Video</button></div></div>
    <div class="edsec"><h4>Place</h4>${chipsHTML('bg', ST.bgs, s.bg)}</div>
    <div class="edsec"><h4>Star</h4>${chipsHTML('actor', ST.actors, s.actor)}<div style="height:6px"></div>${swHTML('col', ST.colors, s.col)}${s.actor === 'kid' ? '<div style="height:6px"></div>' + swHTML('skin', ST.skins, s.skin) : ''}</div>
    <div class="edsec"><h4>What happens</h4>${chipsHTML('action', ST.actions, s.action)}</div>
    <div class="edsec"><h4>Big text</h4><input id="edText" maxlength="28" placeholder="type something funny..." value="${esc(s.text)}" autocomplete="off"><div style="height:6px"></div>${swHTML('tcol', ST.tcolors, s.tcol)}<div style="height:6px"></div>${chipsHTML('tpos', [['top', '⬆️', 'Top'], ['middle', '⏺️', 'Middle'], ['bottom', '⬇️', 'Bottom']], s.tpos)}</div>
    <div class="edsec"><h4>Speech bubble</h4><input id="edSay" maxlength="36" placeholder="what does your star say?" value="${esc(s.say)}" autocomplete="off"></div>
    <div class="edsec"><h4>Sound effect</h4>${chipsHTML('sfx', ST.sfx, s.sfx)}</div>
    <div class="edsec"><h4>Effect</h4>${chipsHTML('fx', ST.fx, s.fx)}</div>
    <div class="edsec"><h4>Music</h4>${chipsHTML('music', ST.music, s.music)}</div>
    <div class="edsec"><h4>Title</h4><input id="edTitle" maxlength="40" placeholder="My funny ${v.kind === 'short' ? 'short' : 'video'}" value="${esc(v.title)}" autocomplete="off"></div>
    <div class="edsec"><h4>Hashtags</h4><input id="edCap" maxlength="50" placeholder="#funny #lol" value="${esc(v.caption)}" autocomplete="off"></div>
   </div>
   <div class="edfoot"><button class="btn pri" id="edPub">${ED.editing && ED.editing.published ? 'Save changes ✅' : 'Publish 🚀'}</button></div>`;
  const E = $('editor');
  E.querySelector('#edCancel').onclick = () => { if (confirm('Leave the studio? Changes that are not saved will be lost.')) closeEditor(); };
  E.querySelector('#edDraft').onclick = () => finishEditor(false);
  E.querySelector('#edPub').onclick = () => finishEditor(true);
  E.querySelector('#edRand').onclick = () => { const keep = v.scenes[ED.i]; const r = randomScene(); r.text = keep.text; r.say = keep.say; v.scenes[ED.i] = r; ED.t = 0; ED.lastT = -.001; play('sparkle'); rebuild(); };
  const pb = E.querySelector('#edPlay'); if (pb) pb.onclick = () => { ED.playAll = !ED.playAll; ED.t = ED.playAll ? 0 : 0; ED.lastT = -.001; if (!ED.playAll) ED.i = Math.min(ED.i, v.scenes.length - 1); rebuild(); };
  E.querySelectorAll('#edScenes button').forEach(b => b.onclick = () => {
    const k = b.dataset.s; play('ui'); ED.playAll = false;
    if (k === 'add') { v.scenes.push(randomScene(v.scenes[v.scenes.length - 1])); ED.i = v.scenes.length - 1; }
    else if (k === 'del') { if (confirm('Delete Scene ' + (ED.i + 1) + '?')) { v.scenes.splice(ED.i, 1); ED.i = Math.max(0, ED.i - 1); } }
    else ED.i = +k;
    ED.t = 0; ED.lastT = -.001; rebuild();
  });
  E.querySelectorAll('[data-k]').forEach(row => row.addEventListener('click', e => {
    const b = e.target.closest('[data-v]'); if (!b) return; const k = row.dataset.k, val = b.dataset.v;
    if (k === 'kind') {
      if (val === v.kind) return; v.kind = val;
      if (val === 'short') v.scenes = v.scenes.slice(ED.i, ED.i + 1); else if (v.scenes.length < 2) v.scenes.push(randomScene(v.scenes[0]));
      ED.i = 0; ED.playAll = false; play('ui'); rebuild(); return;
    }
    const sc = v.scenes[ED.i]; sc[k] = val;
    if (k === 'sfx' && val !== 'none') play(val); else play('ui');
    if (k === 'action' || k === 'actor') { ED.t = 0; ED.lastT = -.001; }
    if (k === 'actor') { rebuild(); return; }
    row.querySelectorAll('[data-v]').forEach(x => x.classList.toggle('on', x === b));
  }));
  E.querySelector('#edText').oninput = e => { v.scenes[ED.i].text = clean(e.target.value); };
  E.querySelector('#edSay').oninput = e => { v.scenes[ED.i].say = clean(e.target.value); };
  E.querySelector('#edTitle').oninput = e => { v.title = e.target.value; };
  E.querySelector('#edCap').oninput = e => { v.caption = e.target.value; };
}
function rebuild() { const sc = $('edBody') ? $('edBody').scrollTop : 0; buildEditor(); $('edBody').scrollTop = sc; }
function closeEditor() { $('editor').hidden = true; $('editor').innerHTML = ''; setPaused(false); if (!$('channel').hidden) renderChannel(); }
function finishEditor(publish) {
  const v = ED.v;
  v.title = clean((v.title || '').trim()) || (v.kind === 'short' ? 'My funny short' : 'My funny video');
  v.caption = clean((v.caption || '').trim());
  let target = ED.editing;
  if (target) { target.kind = v.kind; target.title = v.title; target.caption = v.caption; target.scenes = v.scenes; target.rev = (target.rev || 0) + 1; }
  else { target = { id: 'v' + Date.now().toString(36) + Math.floor(Math.random() * 1e4), kind: v.kind, title: v.title, caption: v.caption, scenes: v.scenes, created: Date.now(), published: false, views: 0, likes: 0, shares: 0, comments: [], liked: false, pot: 300 + Math.floor(Math.random() * 2200), likeRate: .08 + Math.random() * .1, rev: 0 }; SAVE.videos.push(target); }
  closeEditor();
  if (publish) publishVideo(target, !target.published);
  else { saveNow(); toast('💾 Saved to Drafts'); chTab = 'draft'; showMe(); }
}
function publishVideo(v, isNew) {
  if (isNew) { v.published = true; v.created = Date.now(); v.views = 10 + Math.floor(Math.random() * 30); }
  saveNow(); play('win');
  toast(isNew ? '🚀 Published! People are watching...' : '✅ Changes saved');
  chTab = v.kind === 'short' ? 'short' : 'video'; showMe();
  if (isNew) setTimeout(() => checkNews(false), 6000);
}
function studioTick(dt) {
  if ($('editor').hidden) return;
  const cv = $('edCv'); if (!cv) return;
  const v = ED.v, g = cv.getContext('2d');
  const dur = ED.playAll ? v.scenes.length * SCENE_D : SCENE_D;
  const nt = ED.t + dt;
  const evs = ED.playAll ? v.scenes.flatMap((s, i) => sceneEvents(s, i * SCENE_D)) : sceneEvents(v.scenes[ED.i], 0);
  const fire = (a, b) => evs.forEach(e => { if (e[0] > a && e[0] <= b) play(e[1], e[2]); });
  if (nt >= dur) { fire(ED.lastT, dur); ED.t = nt - dur; ED.lastT = -.001; fire(ED.lastT, ED.t); } else { fire(ED.lastT, nt); ED.t = nt; }
  ED.lastT = ED.t;
  const old = c; c = g; g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height); g.save(); g.scale(cv.width / 360, cv.height / 640);
  try {
    if (ED.playAll) { const i = Math.min(v.scenes.length - 1, Math.floor(ED.t / SCENE_D)), lt = ED.t - i * SCENE_D; drawScene(v.scenes[i], lt); if (i > 0 && lt < .2) { g.globalAlpha = 1 - lt / .2; bgFill('#fff'); g.globalAlpha = 1; } }
    else drawScene(v.scenes[ED.i], ED.t);
  } catch (e) { console.error(e); }
  g.restore(); c = old;
}

// first-run news
if (SAVE.channel) checkNews(true);
bindUI();
</script>
