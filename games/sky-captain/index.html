<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sky Captain</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1e3f; touch-action: none; }
#canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
#status { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(#1b4f9c, #0b1e3f); color: #fff; font-family: "Russo One", "Trebuchet MS", sans-serif; z-index: 10; }
#status.hidden { display: none; }
#title { font-size: 46px; letter-spacing: 2px; color: #ffd84a; text-shadow: 0 3px 10px rgba(0,0,0,0.5); }
#sub { font-size: 16px; opacity: 0.85; margin: 8px 0 26px; font-family: "Exo 2", "Trebuchet MS", sans-serif; }
#bar { width: 300px; height: 14px; border: 2px solid #ffffffaa; border-radius: 10px; overflow: hidden; background: #ffffff22; }
#fill { height: 100%; width: 0%; background: linear-gradient(90deg, #ffb13b, #ffd84a); transition: width .2s; }
#msg { margin-top: 12px; font-size: 14px; opacity: .8; font-family: "Exo 2", sans-serif; }
#plane { font-size: 50px; margin-bottom: 10px; animation: fly 2.4s ease-in-out infinite; }
@keyframes fly { 0%,100% { transform: translateY(0) rotate(-8deg);} 50% { transform: translateY(-14px) rotate(4deg);} }
</style>


<canvas id="canvas" tabindex="0"></canvas>
<div id="status">
  <div id="plane">✈️</div>
  <div id="title">SKY CAPTAIN</div>
  <div id="sub">Real planes · Real controls · Real flying</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="msg">Loading the engine...</div>
</div>
<script>
(function () {
  // The engine wasm is split into 3 parts (15 MB per-file limit); stitch it back together.
  // The data pack is served as index.pck.wasm.
  var origFetch = window.fetch.bind(window);
  var fill = document.getElementById('fill');
  var msg = document.getElementById('msg');
  var parts = ['index.part1.wasm', 'index.part2.wasm', 'index.part3.wasm'];
  var prog = { done: 0, total: 0 };
  function note(p) { fill.style.width = Math.round(p * 100) + '%'; }
  function fetchPart(u, onBytes) {
    return origFetch(u).then(function (r) {
      if (!r.ok) throw new Error('fetch ' + u + ' ' + r.status);
      var reader = r.body.getReader();
      var chunks = [];
      var len = 0;
      return new Promise(function (resolve, reject) {
        function pump() {
          reader.read().then(function (res) {
            if (res.done) {
              var out = new Uint8Array(len);
              var off = 0;
              chunks.forEach(function (c) { out.set(c, off); off += c.length; });
              resolve(out);
              return;
            }
            chunks.push(res.value); len += res.value.length; onBytes(res.value.length); pump();
          }).catch(reject);
        }
        pump();
      });
    });
  }
  window.fetch = function (input, init) {
    var url = (typeof input === 'string') ? input : (input && input.url) || '';
    if (/index\.wasm(\?.*)?$/.test(url) && !/part\d\.wasm/.test(url)) {
      msg.textContent = 'Loading the engine (40 MB)...';
      var got = 0;
      return Promise.all(parts.map(function (p) {
        return fetchPart(p, function (n) { got += n; note(Math.min(0.85, got / 41000000)); });
      })).then(function (bufs) {
        var total = bufs.reduce(function (a, b) { return a + b.length; }, 0);
        var out = new Uint8Array(total);
        var off = 0;
        bufs.forEach(function (b) { out.set(b, off); off += b.length; });
        msg.textContent = 'Starting the engine...';
        note(0.9);
        return new Response(out.buffer, { status: 200, headers: { 'Content-Type': 'application/wasm' } });
      });
    }
    if (/index\.pck(\?.*)?$/.test(url)) {
      msg.textContent = 'Loading planes and world...';
      return origFetch('index.pck.wasm', init).then(function (r) {
        return r.arrayBuffer().then(function (b) {
          note(0.97);
          return new Response(b, { status: 200, headers: { 'Content-Type': 'application/octet-stream' } });
        });
      });
    }
    return origFetch(input, init);
  };
})();
</script>
<script src="index.js"></script>
<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":356124,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine = new Engine(GODOT_CONFIG);
(function () {
  const statusEl = document.getElementById('status');
  const msg = document.getElementById('msg');
  const canvas = document.getElementById('canvas');
  if (!Engine.isWebGLAvailable()) {
    msg.textContent = 'WebGL is not available in this browser.';
    return;
  }
  var args = ['--'];
  var h = (location.hash || '').replace('#', '');
  if (h) { h.split(',').forEach(function (a) { if (a === 'fast') args.push('--fast'); else if (a) args.push('--screen=' + a); }); }
  engine.startGame({
    args: args,
    onProgress: function (current, total) {
      if (total > 0) { document.getElementById('fill').style.width = Math.round(90 + 8 * current / total) + '%'; }
    }
  }).then(function () {
    statusEl.classList.add('hidden');
    canvas.focus();
  }, function (err) {
    msg.textContent = 'Could not start: ' + err;
  });
  // keep the canvas focused on touch so keyboard/touch events reach the game
  canvas.addEventListener('touchstart', function () { canvas.focus(); }, { passive: true });
})();
</script>

</body></html>
